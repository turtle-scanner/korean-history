<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>한국사능력검정시험 심화 올인원 마스터</title>
  <!-- Google Fonts: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif'],
            serif: ['Nanum Myeongjo', 'serif']
          },
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#4f46e5',
              600: '#4338ca',
              700: '#3730a3',
              800: '#312e81',
              900: '#1e1b4b'
            },
            history: {
              amber: '#d97706',
              gold: '#b45309',
              dark: '#0f172a'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Mobile-first readability for Samsung Galaxy & Android */
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    .font-scale-sm { font-size: 15px; }
    .font-scale-base { font-size: 17px; }
    .font-scale-lg { font-size: 19px; }
    .font-scale-xl { font-size: 21px; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: #a5b4fc;
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }

    /* Passcode Keypad Button Animation */
    .key-btn:active {
      transform: scale(0.92);
    }
    
    /* Shake animation for wrong password */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    /* Pulse animation */
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .pulse-soft {
      animation: pulse-soft 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-scale-base transition-colors duration-200">

  <!-- ========================================== -->
  <!-- 1. 보안 암호 잠금 화면 (PIN GATE: 1353) -->
  <!-- ========================================== -->
  <div id="authOverlay" class="fixed inset-0 z-50 bg-slate-900/95 backdrop-blur-md flex items-center justify-center p-4">
    <div id="authCard" class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-indigo-100 dark:border-slate-800 p-6 sm:p-8 max-w-sm w-full text-center relative overflow-hidden">
      <!-- Decor Top Bar -->
      <div class="h-2 w-full bg-gradient-to-r from-amber-500 via-indigo-600 to-purple-600 absolute top-0 left-0"></div>
      
      <!-- Lock Icon -->
      <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
        <i data-lucide="shield-check" class="w-9 h-9"></i>
      </div>
      
      <h2 class="text-xl sm:text-2xl font-black text-slate-800 dark:text-white tracking-tight">한국사능력검정시험 마스터</h2>
      <p class="text-sm sm:text-base text-slate-500 dark:text-slate-400 mt-1 mb-4">접속 암호 <span class="font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/40 px-2 py-0.5 rounded-md">4자리</span>를 눌러주세요</p>

      <!-- PIN Display Dots -->
      <div id="pinDots" class="flex justify-center items-center gap-4 my-4 py-2">
        <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 dark:border-slate-600 bg-transparent transition-all"></div>
        <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 dark:border-slate-600 bg-transparent transition-all"></div>
        <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 dark:border-slate-600 bg-transparent transition-all"></div>
        <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 dark:border-slate-600 bg-transparent transition-all"></div>
      </div>

      <!-- Error Message -->
      <div id="authErrorMsg" class="h-6 text-sm font-semibold text-rose-500 dark:text-rose-400 opacity-0 transition-opacity">암호가 일치하지 않습니다.</div>

      <!-- Numeric Touch Keypad (Samsung Galaxy optimized) -->
      <div class="grid grid-cols-3 gap-2.5 sm:gap-3 mt-3 max-w-[280px] mx-auto">
        <button onclick="inputPin('1')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">1</button>
        <button onclick="inputPin('2')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">2</button>
        <button onclick="inputPin('3')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">3</button>
        
        <button onclick="inputPin('4')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">4</button>
        <button onclick="inputPin('5')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">5</button>
        <button onclick="inputPin('6')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">6</button>
        
        <button onclick="inputPin('7')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">7</button>
        <button onclick="inputPin('8')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">8</button>
        <button onclick="inputPin('9')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">9</button>
        
        <button onclick="clearPin()" class="key-btn h-14 sm:h-16 rounded-2xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-900/60 text-sm font-bold text-rose-600 dark:text-rose-400 transition shadow-sm border border-rose-200 dark:border-rose-900/50 flex items-center justify-center">전체삭제</button>
        <button onclick="inputPin('0')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">0</button>
        <button onclick="backspacePin()" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 transition shadow-sm border border-slate-300 dark:border-slate-600 flex items-center justify-center">
          <i data-lucide="delete" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Quick Hint -->
      <div class="mt-4 text-xs text-slate-400 dark:text-slate-500">
        키보드로 1353을 직접 입력하셔도 됩니다
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. 상단 고정 네비게이션 헤더 -->
  <!-- ========================================== -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
    <div class="max-w-6xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-2">
      <!-- Title & Emblem -->
      <div class="flex items-center gap-2 sm:gap-3 cursor-pointer" onclick="switchTab('theory')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-indigo-600 text-white flex items-center justify-center font-black shadow-md shadow-indigo-500/20">
          <span class="text-lg">史</span>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black text-slate-900 dark:text-white leading-tight flex items-center gap-1.5">
            한능검 심화 마스터
            <span class="text-[11px] font-bold text-amber-700 dark:text-amber-400 bg-amber-100 dark:bg-amber-950/60 px-1.5 py-0.5 rounded border border-amber-300 dark:border-amber-800 hidden sm:inline-block">1급 완벽대비</span>
          </h1>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">이론 ➔ 5지선다 문제풀이 ➔ 상세해설</p>
        </div>
      </div>

      <!-- Top Tools: Font Resizer, Dark Mode, Lock -->
      <div class="flex items-center gap-1 sm:gap-2">
        <!-- Font Size Scaler (Samsung Galaxy Reading Support) -->
        <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-lg p-0.5 border border-slate-200 dark:border-slate-700">
          <button onclick="changeFontSize('down')" title="글자 축소" class="px-2 py-1 text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-indigo-600">가-</button>
          <span id="fontScaleLabel" class="text-xs font-bold text-indigo-600 dark:text-indigo-400 px-1">기본</span>
          <button onclick="changeFontSize('up')" title="글자 확대" class="px-2 py-1 text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-indigo-600">가+</button>
        </div>

        <!-- Dark Mode Toggle -->
        <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-amber-500 flex items-center justify-center transition border border-slate-200 dark:border-slate-700" title="다크/라이트 모드">
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
        </button>

        <!-- Lock Button -->
        <button onclick="lockApp()" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-rose-500 flex items-center justify-center transition border border-slate-200 dark:border-slate-700" title="화면 잠금">
          <i data-lucide="lock" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Era Selection Horizontal Scroller -->
    <div class="bg-slate-100/80 dark:bg-slate-900/80 border-t border-slate-200 dark:border-slate-800 px-2 sm:px-6 py-2 overflow-x-auto no-scrollbar">
      <div id="eraPillsContainer" class="flex gap-2 min-w-max">
        <!-- Rendered by JS -->
      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- 3. 메인 콘텐츠 컨테이너 -->
  <!-- ========================================== -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-6 pb-24">

    <!-- Active Era Banner -->
    <div id="eraBanner" class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 text-white rounded-2xl p-4 sm:p-6 mb-6 shadow-md relative overflow-hidden">
      <div class="relative z-10">
        <div class="flex items-center gap-2 mb-1.5">
          <span id="bannerTag" class="text-xs font-extrabold bg-amber-500 text-slate-950 px-2 py-0.5 rounded-full"></span>
          <span id="bannerPeriod" class="text-xs text-indigo-200 font-medium"></span>
        </div>
        <h2 id="bannerTitle" class="text-xl sm:text-2xl font-black tracking-tight"></h2>
        <p id="bannerSummary" class="text-sm sm:text-base text-indigo-100/90 mt-2 leading-relaxed max-w-3xl"></p>
      </div>
      <!-- Background pattern -->
      <div class="absolute -right-8 -bottom-8 text-white/5 font-serif text-9xl select-none pointer-events-none">韓國史</div>
    </div>

    <!-- Mode Selector Navigation Tabs (1. 이론, 2. 5지선다 문제풀이, 3. 오답노트 & 검색) -->
    <div class="flex border-b border-slate-200 dark:border-slate-800 mb-6 gap-2">
      <button onclick="switchTab('theory')" id="tabBtn-theory" class="tab-btn pb-3 px-3 sm:px-5 font-black text-sm sm:text-base border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 flex items-center gap-2 transition">
        <i data-lucide="book-open" class="w-4 h-4"></i>
        <span>1단계: 핵심 이론 마스터</span>
      </button>
      <button onclick="switchTab('quiz')" id="tabBtn-quiz" class="tab-btn pb-3 px-3 sm:px-5 font-bold text-sm sm:text-base border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-2 transition">
        <i data-lucide="check-square" class="w-4 h-4"></i>
        <span>2·3단계: 5지선다 문제풀이 & 해설</span>
      </button>
      <button onclick="switchTab('notes')" id="tabBtn-notes" class="tab-btn pb-3 px-3 sm:px-5 font-bold text-sm sm:text-base border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-2 transition">
        <i data-lucide="bookmark" class="w-4 h-4"></i>
        <span>오답노트 & 검색</span>
      </button>
    </div>

    <!-- TAB 1: 핵심 이론 마스터 -->
    <section id="section-theory" class="space-y-6">
      <!-- Mnemonic Cards -->
      <div class="bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/60 rounded-2xl p-4 sm:p-5">
        <div class="flex items-center gap-2 text-amber-800 dark:text-amber-300 font-extrabold text-base sm:text-lg mb-3">
          <i data-lucide="zap" class="w-5 h-5 text-amber-500 fill-amber-500"></i>
          <span>한능검 1초 킬러 암기 공식</span>
        </div>
        <div id="mnemonicsList" class="space-y-2 text-sm sm:text-base text-amber-900 dark:text-amber-200/90 font-medium leading-relaxed">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Comparison Tables -->
      <div id="tablesContainer" class="space-y-6">
        <!-- Rendered by JS -->
      </div>

      <!-- Killer Historical Records (사료 원문 박스) -->
      <div class="mt-6">
        <h3 class="text-lg sm:text-xl font-black text-slate-800 dark:text-white mb-4 flex items-center gap-2">
          <i data-lucide="file-text" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
          <span>시험에 100% 나오는 빈출 사료 원문 분석</span>
        </h3>
        <div id="recordsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Bottom Next Action Button -->
      <div class="pt-6 flex justify-center">
        <button onclick="switchTab('quiz')" class="w-full sm:w-auto px-8 py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-base sm:text-lg shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-3 transition">
          <span>이 시대 실전 5지선다 문제 풀러 가기</span>
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </div>
    </section>

    <!-- TAB 2: 5지선다형 문제풀이 & 상세 해설 -->
    <section id="section-quiz" class="hidden space-y-8">
      <div class="bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900/50 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wide">PRACTICE EXAM</span>
          <h3 class="text-base sm:text-lg font-black text-slate-900 dark:text-white">실전 기출 유형 5지선다형 모의평가</h3>
        </div>
        <div id="quizCounter" class="text-xs sm:text-sm font-bold text-indigo-700 dark:text-indigo-300 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-xl border border-indigo-200 dark:border-slate-700 shadow-sm">
          문항 준비 완료
        </div>
      </div>

      <!-- Questions List Container -->
      <div id="questionsContainer" class="space-y-8">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- TAB 3: 오답노트 & 통합 검색 -->
    <section id="section-notes" class="hidden space-y-6">
      <!-- Search Input -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="relative">
          <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="globalSearchInput" oninput="handleGlobalSearch()" placeholder="인물, 사건, 조약, 제도 검색 (예: 신문왕, 대동법, 헌의6조)" class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm sm:text-base">
        </div>
        <div id="searchResultsCount" class="text-xs text-slate-500 mt-2 ml-1">검색어를 입력하면 전체 9개 시대의 이론과 문제를 즉시 찾아냅니다.</div>
      </div>

      <!-- Search Results Area -->
      <div id="searchResultsList" class="space-y-4"></div>

      <!-- Saved Wrong Notes (오답노트) -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-6 border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 dark:border-slate-800">
          <div class="flex items-center gap-2">
            <i data-lucide="bookmark-check" class="w-5 h-5 text-rose-500"></i>
            <h3 class="text-base sm:text-lg font-black text-slate-900 dark:text-white">나만의 한능검 오답노트</h3>
          </div>
          <button onclick="clearAllWrongNotes()" class="text-xs text-rose-500 hover:underline">전체 비우기</button>
        </div>
        <div id="wrongNotesContainer" class="space-y-4">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>

  </main>

  <!-- ========================================== -->
  <!-- 4. 모바일 하단 네비게이션 툴바 (스마트폰 최적화) -->
  <!-- ========================================== -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 py-2 px-4 flex justify-around items-center sm:hidden shadow-lg">
    <button onclick="switchTab('theory')" class="flex flex-col items-center gap-1 text-indigo-600 dark:text-indigo-400">
      <i data-lucide="book-open" class="w-5 h-5"></i>
      <span class="text-[11px] font-bold">이론정리</span>
    </button>
    <button onclick="switchTab('quiz')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">
      <i data-lucide="check-square" class="w-5 h-5"></i>
      <span class="text-[11px] font-bold">5지선다</span>
    </button>
    <button onclick="switchTab('notes')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">
      <i data-lucide="bookmark" class="w-5 h-5"></i>
      <span class="text-[11px] font-bold">오답/검색</span>
    </button>
    <button onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" class="flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">
      <i data-lucide="arrow-up" class="w-5 h-5"></i>
      <span class="text-[11px] font-bold">맨위로</span>
    </button>
  </nav>

  <!-- ========================================== -->
  <!-- 5. JavaScript Application Core -->
  <!-- ========================================== -->

사하고, 신라 영토에 고구려 당주가 주둔하였다는 내용이 기록되어 있다.\n• 성격: 남진 정책의 결과로 한강 유역을 완전히 장악했음을 증명한다.", "options": ["① 영락이라는 독자적인 연호를 사용하였다.", "② 평양으로 수도를 천도하고 백제의 한성을 함락하였다.", "③ 율령을 반포하고 불교를 공인하여 체제를 정비하였다.", "④ 을파소의 건의를 받아들여 진대법을 처음 실시하였다.", "⑤ 살수에서 수나라 군대를 크게 물리쳤다."], "answer": 2, "explanation": {"summary": "제시된 비석은 '충주(중원) 고구려비'이며, 이를 건립한 왕은 남진 정책을 추진한 '장수왕'입니다.", "choices": ["① 오답: 영락 연호 사용은 광개토대왕입니다.", "② 정답: 장수왕은 427년 평양으로 천도하고, 475년 백제의 한성을 공격하여 개로왕을 전사시키고 남한강 유역까지 영토를 넓혔습니다.", "③ 오답: 율령 반포와 불교 공인은 소수림왕입니다.", "④ 오답: 진대법 실시는 고국천왕입니다.", "⑤ 오답: 살수대첩은 영양왕 때 을지문덕 장군이 이끈 전투입니다."]}}, {"id": "q2_2", "question": "(가) 왕의 재위 시기에 신라에서 일어난 사실로 옳은 것은?", "passage": "백제 성왕은 (가) 과/와 연합하여 고구려를 공격하고 한강 상류 지역을 차지하였다. 그러나 곧이어 (가) 이/가 동맹을 깨고 백제가 되찾았던 한강 하류 지역까지 빼앗아 버렸다. 이에 분노한 성왕이 군사를 일으켜 공격하였으나 관산성에서 전사하고 말았다.", "options": ["① 건원이라는 독자적인 연호를 최초로 제정하였다.", "② 이차돈의 순교를 계기로 불교를 공인하였다.", "③ 화랑도를 국가적 조직으로 개편하고 대가야를 정복하였다.", "④ 우산국을 복속시키고 시장을 감독하는 동시전을 설치하였다.", "⑤ 국학을 설립하여 유교 경전을 교육하였다."], "answer": 3, "explanation": {"summary": "(가) 왕은 성왕과 한강을 일시 회복했다가 한강 전 유역을 독점 장악하고 관산성 전투에서 성왕을 전사시킨 신라의 '진흥왕'입니다.", "choices": ["① 오답: 건원 연호 제정은 법흥왕입니다.", "② 오답: 이차돈 순교와 불교 공인은 법흥왕입니다.", "③ 정답: 진흥왕은 화랑도를 국가 조직화하고 대가야를 정복(562)하였으며 한강 유역을 장악하고 4개 순수비를 건립하였습니다.", "④ 오답: 우산국 복속과 동시전 설치는 지증왕입니다.", "⑤ 오답: 국학 설립은 통일신라 신문왕입니다."]}}]}, {"id": "era3", "name": "3. 남북국 시대 (통일신라 & 발해)", "tag": "출제 3문항", "period": "7세기 후반 ~ 10세기 초", "summary": "신문왕의 전제 왕권 강화책(녹읍 폐지, 관료전, 9주5소경)과 신라 하대의 혼란 및 사상(선종, 풍수지리설), 그리고 발해 대조영·무왕·문왕·선왕의 업적과 대외 관계를 체계적으로 정리해야 합니다.", "theory": {"tables": [{"title": "통일신라 중대(전성기) vs 하대(혼란기) 핵심 대조표", "headers": ["구분", "통일신라 중대 (무열왕~혜공왕)", "통일신라 하대 (선덕왕~경순왕)"], "rows": [["정치 상황", "왕권 전제화, 진골 귀족 억압, 집사부 시중 권한 강화", "진골 귀족의 왕위 쟁탈전(김헌창의 난), 화백회의 귀족 권한 강화"], ["핵심 국왕", "신문왕: 김흠돌 숙청, 관료전 지급, 녹읍 폐지, 9주 5소경, 국학", "원성왕(독서삼품과), 진성여왕(원종·애노의 난, 적고적의 난)"], ["지배/반발 세력", "6두품 세력이 국왕의 학문적·정치적 조언자로 활약", "호족 세력 대두(성주, 장군 자칭), 6두품 반신라화(최치원 시무 10조 좌절)"], ["불교 및 사상", "교종 발달 (원효의 화쟁/아미타, 의상의 화엄/관음)", "선종 9산선문 유행(개인 참선 깨달음), 풍수지리설(도선, 지방 호족 뒷받침)"]]}, {"title": "해동성국 발해의 4대 핵심 국왕과 체제", "headers": ["국왕", "연호", "주요 업적 및 대외 관계", "역사적 의미"], "rows": [["고왕 (대조영)", "-", "고구려 유민과 말갈족을 이끌고 동모산 기슭에 건국(698)", "고구려 계승 선언 (정혜공주묘 모줄임 천장 구조)"], ["무왕 (대무예)", "인안", "당과 대립: 장문휴 수군을 보내 당의 산둥반도 등주 선제 공격, 북만주 장악", "일본에 보낸 국서에 '고려국왕' 자칭"], ["문왕 (대흠무)", "대흥", "당과 친선: 3성 6부제 수용, 상경 천도, 주자감 설치, 신라도 개설", "문물 제도 완성, 불교 장려(정효공주묘 벽화)"], ["선왕 (대인수)", "건흥", "최대 영토 확보(5경 15부 62주 완비), 대부분의 말갈족 복속", "당으로부터 '바다 동쪽의 번성한 나라(해동성국)' 칭호 획득"]]}], "killer_records": [{"title": "사료 1: 신라 촌락문서 (민정문서, 일본 정창원 발견)", "text": "서원경 관내 4개 촌락 조사... 호(戶)는 인정(人丁)의 다소에 따라 상상호에서 하하호까지 9등급으로 나누고, 인구는 남녀 연령별로 6등급으로 파악하였다. 토지의 면적과 뽕나무·잣나무·호두나무 수, 소와 말의 수를 낱낱이 파악하여 3년마다 다시 작성한다."}, {"title": "사료 2: 원효의 일심 사상과 화쟁 (대승기신론소)", "text": "열면 헤아릴 수 없이 많은 뜻이 종(宗)이 되고, 합하면 온갖 이치가 하나의 마음에 돌아간다... 모든 종파의 서로 다른 이론을 조화시켜 하나로 융합하니 이를 화쟁(和諍)이라 한다."}], "mnemonics": ["💡 신문왕의 귀족 제압 4종: [흠·문·녹·국] ➔ 김흠돌 숙청 ➔ 문무관료전 지급 ➔ 녹읍 폐지 ➔ 국학 설치", "💡 발해 왕 연호 3인방: [무인 - 문대 - 선건] ➔ 무왕(인안), 문왕(대흥), 선왕(건흥)"]}, "questions": [{"id": "q3_1", "question": "다음 업적을 남긴 통일신라 국왕의 정책으로 옳은 것은?", "passage": "• 김흠돌의 모반 사건을 계기로 진골 귀족들을 대대적으로 숙청하였다.\n• 문무 관료들에게 관료전을 지급하고, 귀족들의 경제적 기반이었던 녹읍을 혁파하였다.\n• 전국을 9주로 나누고 군사·행정상 요충지에 5소경을 두었다.", "options": ["① 독서삼품과를 시행하여 인재를 등용하고자 하였다.", "② 최고 교육 기관으로 국학을 설립하여 유교 경전을 교육하였다.", "③ 시장을 감독하는 관청인 동시전을 처음 설치하였다.", "④ 최치원의 시무 10조를 수용하여 개혁을 단행하였다.", "⑤ 이차돈의 순교를 계기로 불교를 공인하였다."], "answer": 2, "explanation": {"summary": "제시된 자료는 신라 중대 전제 왕권을 확립한 '신문왕'의 업적입니다.", "choices": ["① 오답: 독서삼품과 시행은 신라 하대 원성왕입니다.", "② 정답: 신문왕은 유학 교육을 위해 국학을 설치하여 인재를 양성하고 왕권을 뒷받침했습니다.", "③ 오답: 동시전 설치는 신라 지증왕입니다.", "④ 오답: 최치원의 시무 10조는 신라 하대 진성여왕에게 건의되었습니다.", "⑤ 오답: 불교 공인은 법흥왕입니다."]}}, {"id": "q3_2", "question": "다음 가상 인터뷰에 등장하는 국왕(발해)의 재위 시기에 있었던 사실로 옳은 것은?", "passage": "기자: 전하께서 장문휴 장군에게 명하여 바다 건너 당의 등주를 공격하게 하신 이유는 무엇입니까?\n국왕: 당이 흑수말갈과 내통하여 우리를 압박하려 하였소. 또한 우리는 독자적으로 '인안'이라는 연호를 제정하여 대등한 자주 국가임을 만천하에 선포하였소.", "options": ["① 3성 6부의 중앙 관제를 완비하고 상경으로 도읍을 옮겼다.", "② 거란의 침략을 받아 홀한성이 함락되고 멸망하였다.", "③ 5경 15부 62주의 지방 제도를 완비하고 해동성국이라 불렸다.", "④ 장문휴를 파견하여 산둥반도의 등주를 기습 공격하였다.", "⑤ 동모산 기슭에 도읍을 정하고 국호를 진국이라 하였다."], "answer": 4, "explanation": {"summary": "자료에서 장문휴를 통한 등주 공격과 독자 연호 '인안'을 사용하는 왕은 발해의 '무왕'입니다.", "choices": ["① 오답: 3성 6부제 완비와 상경 천도는 문왕입니다.", "② 오답: 거란의 침략으로 멸망한 것은 926년 애왕 때입니다.", "③ 오답: 5경 15부 62주와 해동성국 칭호는 선왕입니다.", "④ 정답: 발해 무왕은 당과 대립하며 장문휴 수군을 보내 산둥반도 등주를 선제 타격하였습니다.", "⑤ 오답: 동모산 건국은 고왕 대조영입니다."]}}]}, {"id": "era4", "name": "4. 고려 시대", "tag": "출제 4~5문항", "period": "918년 ~ 1392년 (조선 건국 전까지)", "summary": "태조·광종·성종의 기틀 정비, 도병마사와 식목도감 등 통치체제, 거란·여진·몽골의 대외 항쟁사, 무신정권(최씨 정권), 공민왕의 반원 개혁, 그리고 의천과 지눌의 불교 사상을 완벽 정리해야 합니다.", "theory": {"tables": [{"title": "고려 대외 항쟁사 4단계 (침략과 격퇴)", "headers": ["외세", "시기", "원인 및 발단", "주요 격전지와 영웅", "결과 및 영향"], "rows": [["거란 (1차)", "10세기 말 (성종)", "고려의 친송북진 정책", "서희의 외교 담판 (소손녕과 담판)", "피 한 방울 안 묻히고 '강동 6주' 획득"], ["거란 (2·3차)", "11세기 초 (현종)", "강조의 정변 구실", "양규의 선전(2차) / 강감찬의 귀주 대첩(3차)", "개경에 나성 축조, 압록강~도련포에 천리장성 축조"], ["여진", "12세기 초 (예종)", "여진족 성장과 국경 침략", "윤관의 별무반(신기·신보·항마군)", "여진을 몰아내고 동북 9성 축조 (이후 환부)"], ["몽골", "13세기 (고종)", "저고여 피살 사건 구실", "처인성 전투(김윤후-살리타 사살), 충주성 전투", "강화도 천도 장기 항전, 팔만대장경 조판, 황룡사 9층 목탑 소실, 개경 환도 반발 삼별초 항쟁"]]}, {"title": "공민왕의 반원 개혁 정치 핵심 정리", "headers": ["분야", "개혁 정책 내용", "목적 및 의의"], "rows": [["반원 자주책", "기철 등 친원 세력 숙청, 정동행성 이문소 폐지, 몽골풍(변발·호복) 폐지, 관제 복구", "원나라의 간섭을 완전히 벗어나 고려의 자주권 회복"], ["영토 회복", "유인우, 이자춘 등을 파견하여 쌍성총관부 무력 수복", "철령 이북의 영토를 되찾고 압록강 너머까지 진출"], ["왕권 강화 및 민생", "신돈 등용 ➔ 전민변정도감 설치", "권문세족이 불법으로 빼앗은 토지를 본래 주인에게 돌려주고 억울하게 노비가 된 백성을 양인으로 해방"]]}], "killer_records": [{"title": "사료 1: 서희의 소손녕 외교 담판 (고려사)", "text": "소손녕이 이르기를 '너희 나라는 신라 땅에서 일어났고 고구려 땅은 우리 영토인데 너희가 침식하였다.' 하니 서희가 대답하기를 '그렇지 않다. 우리는 고구려를 계승하여 국호를 고려라 하였고 평양을 서경으로 삼았다... 만약 여진을 몰아내고 우리의 옛 땅을 되찾아 도로를 통하게 해 준다면 어찌 국교를 맺지 않겠는가?'"}, {"title": "사료 2: 지눌의 권수정혜결사문 (수선사 결사)", "text": "땅에서 넘어진 자는 땅을 짚고 일어나야 하듯이, 마음을 어지럽힌 자는 마음을 닦아 깨달아야 한다. 마땅히 명예와 이익을 버리고 산림에 은둔하여 결사를 맺고, 함께 정혜(定慧)를 닦고 경전을 읽으며 참선에 힘쓰자."}], "mnemonics": ["💡 고려 침략 외세 순서: [거 ➔ 여 ➔ 몽 ➔ 홍·왜] ➔ 거란 ➔ 여진 ➔ 몽골 ➔ 홍건적·왜구", "💡 고려 불교 승려 비교: [의천 - 교관겸수 / 천태종] vs [지눌 - 정혜쌍수, 돈오점수 / 조계종, 수선사결사]"]}, "questions": [{"id": "q4_1", "question": "다음 정책을 추진한 고려 국왕에 대한 설명으로 옳은 것은?", "passage": "• 쌍기의 건의를 받아들여 시험을 통해 관리를 선발하는 과거제를 처음 도입하였다.\n• 호족의 경제적·군사적 기반을 약화시키기 위해 불법으로 노비가 된 자를 양인으로 해방하는 노비안검법을 실시하였다.\n• 백관의 공복을 제정하고 스스로 황제라 칭하며 '광덕', '준풍'이라는 연호를 사용하였다.", "options": ["① 최승로의 시무 28조를 수용하여 12목에 지방관을 파견하였다.", "② 훈요 10조를 남겨 후대 왕들이 지켜야 할 정책 지침을 제시하였다.", "③ 과감한 개혁을 단행하여 왕권을 강화하고 호족 세력을 숙청한 광종이다.", "④ 신돈을 등용하고 전민변정도감을 설치하여 권문세족을 억압하였다.", "⑤ 도병마사와 식목도감을 설치하여 독자적 귀족 합의 체제를 마련하였다."], "answer": 3, "explanation": {"summary": "과거제 최초 도입, 노비안검법 실시, 백관 공복 제정, 광덕·준풍 연호 사용 국왕은 '광종'입니다.", "choices": ["① 오답: 최승로의 시무 28조 수용과 12목 파견은 성종입니다.", "② 오답: 훈요 10조를 남긴 왕은 태조 왕건입니다.", "③ 정답: 광종은 노비안검법과 과거제를 통해 공신과 호족을 숙청하고 왕권을 크게 강화하였습니다.", "④ 오답: 신돈 기용과 전민변정도감 설치는 공민왕입니다.", "⑤ 오답: 도병마사와 식목도감은 고려의 독자적 회의 기구입니다."]}}, {"id": "q4_2", "question": "다음 자료의 상황이 나타난 시기의 고려 사회 모습으로 가장 적절한 것은?", "passage": "공민왕이 우왕 2년... 신돈을 기용하여 권세가들이 빼앗은 토지와 노비를 본래대로 바로잡고자 전민변정도감을 두었다. 신돈이 방을 붙이기를 '권세가가 빼앗은 토지는 주인에게 돌려주고 억울하게 노비가 된 자는 양인으로 풀어주겠다'고 하니 기뻐 날뛰는 백성들이 많았다.", "options": ["① 권문세족이 도평의사사를 장악하고 대농장을 경영하였다.", "② 성종의 명으로 전국 12목에 처음으로 목사가 파견되었다.", "③ 묘청이 서경 천도를 주장하며 대화국을 세우고 반란을 일으켰다.", "④ 윤관이 신기군, 신보군, 항마군으로 구성된 별무반을 이끌었다.", "⑤ 강화도에서 몽골에 대항하여 팔만대장경판을 조판하였다."], "answer": 1, "explanation": {"summary": "자료는 원 간섭기 권문세족의 폐단을 시정하기 위해 공민왕과 신돈이 추진한 '전민변정도감' 개혁입니다.", "choices": ["① 정답: 원 간섭기 친원파 중심의 권문세족은 최고 관직 기구인 도평의사사를 독점하고 산천을 경계로 삼을 정도의 거대한 대농장을 경영하였습니다.", "② 오답: 성종의 12목 지방관 파견은 고려 초기(10세기 말)입니다.", "③ 오답: 묘청의 서경천도운동은 인종 때(12세기 문벌귀족기)입니다.", "④ 오답: 윤관의 별무반은 숙종~예종 때(12세기 여진 정벌)입니다.", "⑤ 오답: 팔만대장경 조판은 13세기 고종 무신정권기 몽골 항쟁 시기입니다."]}}]}, {"id": "era5", "name": "5. 조선 전기", "tag": "출제 4문항", "period": "1392년 ~ 1637년 (조선 건국 ~ 병자호란)", "summary": "태종·세종·세조·성종의 통치 체제 정비, 3사의 언론 기능, 4대 사화(무오·갑자·기묘·을사), 붕당의 발생과 임진왜란·병자호란의 격전지와 전개 과정을 체계적으로 학습해야 합니다.", "theory": {"tables": [{"title": "조선 초기 4대 국왕의 정치 및 제도 완비", "headers": ["국왕", "권력 구조", "핵심 제도 및 국방", "문화 및 편찬 사업"], "rows": [["태종 (이방원)", "6조 직계제 단행 (왕권 강화)", "사병 혁파, 호패법 실시(조세·군역 확보), 신문고 설치", "주자소 설치, 계미자 주조"], ["세종대왕", "의정부 서사제 (왕권과 신권 조화)", "집현전 설치, 4군 6진 개척(최윤덕·김종서), 공법(전분6등·연분9등)", "훈민정음 창제, 칠정산, 농사직설, 자격루, 측우기, 갑인자"], ["세조 (수양대군)", "6조 직계제 부활", "집현전·경연 폐지, 직전법 실시(현직 관리에게만 과전 지급)", "경국대전 편찬 시작"], ["성종", "홍문관(옥당) 설치, 경연 활성화", "사림파(김종직 등) 대거 등용하여 훈구 견제", "경국대전 완성 및 반포, 국조오례의, 동국여지승람, 악학궤범"]]}, {"title": "4대 사화 (훈구 vs 사림의 대립)", "headers": ["사화명", "시기(왕)", "발단 및 직접적 원인", "결과 및 영향"], "rows": [["무오사화 (1498)", "연산군", "김일손의 사초에 실린 김종직의 <조의제문>(세조의 단종 찬탈 비판)", "김일손 처형, 김종직 부관참시 등 영남 사림 대거 피화"], ["갑자사화 (1504)", "연산군", "폐비 윤씨 사사 사건의 전말 폭로", "사림뿐만 아니라 훈구 대신들까지 대대적으로 숙청됨"], ["기묘사화 (1519)", "중종", "조광조의 도학 개혁(현량과, 소격서 폐지, 공납 개혁, 위훈삭제)에 훈구 반발", "'주초위왕(走肖爲王)' 모함으로 조광조 사사, 개혁 좌절"], ["을사사화 (1545)", "명종", "외척 간의 권력 다툼(대윤 윤임 vs 소윤 윤원형)", "윤임 일파와 이에 연루된 사림 세력이 대거 화를 입음"]]}], "killer_records": [{"title": "사료 1: 김종직의 조의제문 (무오사화)", "text": "정축년 10월 어느 날... 꿈에 칠척이나 되는 거인이 헌걸찬 모습으로 와서 말하기를 '나는 초나라 회왕 손심인데 항우에게 살해당하여 침강에 던져졌다' 하고는 사라졌다... 내가 가만히 생각해보니 회왕은 억울하게 죽은 것이로다. 내 붓을 들어 조문하는 글을 짓노라."}, {"title": "사료 2: 조광조의 개혁 상소 (기묘사화)", "text": "현량과를 설치하여 널리 어진 인재를 뽑아 쓰소서... 소격서는 도교의 제사를 지내는 곳으로 이단에 해당하니 속히 혁파하여 유학의 바른 도리를 바로잡으소서... 중종반정 공신 중 공이 없으면서 훈록을 받은 자의 거짓 훈작(위훈)을 삭제하소서."}], "mnemonics": ["💡 4대 사화 순서: [무 ➔ 갑 ➔ 기 ➔ 을] (무오 ➔ 갑자 ➔ 기묘 ➔ 을사)", "💡 조선의 3사: [사헌부(감찰) + 사간원(간쟁) + 홍문관(경연/서적)] ➔ 언론 3사로 권력 독점 방지"]}, "questions": [{"id": "q5_1", "question": "다음 정책을 시행한 조선의 국왕에 대한 설명으로 옳은 것은?", "passage": "• 의정부의 권한을 줄이고 판서들이 국왕에게 직접 국정을 보고하는 6조 직계제를 처음 실시하였다.\n• 백성들의 억울함을 직접 호소할 수 있도록 대궐 문루에 신문고를 설치하였다.\n• 16세 이상 모든 남성에게 신분과 거주지를 명시한 호패를 발급하는 호패법을 시행하였다.", "options": ["① 경국대전을 완성하여 반포하였다.", "② 집현전을 확대 개편하고 훈민정음을 창제하였다.", "③ 과전의 부족을 해결하고자 현직 관리에게만 토지를 주는 직전법을 단행하였다.", "④ 사병을 혁파하고 왕권을 강화한 태종이다.", "⑤ 금난전권을 철폐하는 신해통공을 단행하였다."], "answer": 4, "explanation": {"summary": "6조 직계제 최초 시행, 신문고 설치, 호패법 실시 국왕은 '태종(이방원)'입니다.", "choices": ["① 오답: 경국대전 완성 및 반포는 성종입니다.", "② 오답: 집현전 확대와 훈민정음 창제는 세종입니다.", "③ 오답: 직전법 단행은 세조입니다.", "④ 정답: 태종은 사병을 전격 혁파하여 군사권을 장악하고 왕권을 확립하였습니다.", "⑤ 오답: 신해통공 단행은 조선 후기 정조입니다."]}}, {"id": "q5_2", "question": "다음 인물이 추진한 개혁 정치에 대한 설명으로 옳은 것은?", "passage": "중종의 신임을 얻은 이 인물은 성리학적 도학 정치를 표방하며 과거제의 폐단을 보완하기 위해 '현량과'를 설치하여 사림을 대거 천거하였다. 또한 도교 사당인 소격서를 폐지하고, 중종반정 공신들의 거짓 훈작을 취소하는 '위훈 삭제'를 과감히 추진하다가 훈구파의 반발을 사 사사되었다.", "options": ["① 성학십도를 저술하여 군주의 덕성을 강조하였다.", "② 기묘사화로 화를 입은 조광조이다.", "③ 만언봉사를 올려 10만 양병설을 주장하였다.", "④ 붕당정치의 폐해를 비판하며 탕평비를 건립하였다.", "⑤ 최초의 서원인 백운동 서원을 건립하였다."], "answer": 2, "explanation": {"summary": "현량과 실시, 소격서 폐지, 위훈 삭제를 단행하다 기묘사화로 사사된 인물은 '조광조'입니다.", "choices": ["① 오답: 성학십도를 저술한 학자는 이황입니다.", "② 정답: 조광조는 급진적 도학 개혁을 추진하다가 훈구파의 '주초위왕' 모함으로 기묘사화(1519) 때 숙청되었습니다.", "③ 오답: 10만 양병설은 이이입니다.", "④ 오답: 탕평비 건립은 영조입니다.", "⑤ 오답: 백운동 서원 건립은 주세붕입니다."]}}]}, {"id": "era6", "name": "6. 조선 후기", "tag": "출제 4~5문항", "period": "17세기 중반 ~ 19세기 중반 (세도정치까지)", "summary": "비변사의 비대화와 5군영, 3대 수취제도(영정법·대동법·균역법), 영조와 정조의 탕평책, 실학자 8인(중농학파 vs 중상학파), 그리고 세도정치와 농민 봉기(홍경래의 난, 임술 농민 봉기)를 총정리합니다.", "theory": {"tables": [{"title": "조선 후기 3대 수취 제도 개혁 비교", "headers": ["제도명", "시행 국왕", "개혁 배경", "핵심 개혁 내용", "결과 및 영향"], "rows": [["영정법 (1635)", "인조", "전세 제도의 문란 (연분9등법의 복잡성)", "풍흉에 관계없이 토지 1결당 쌀 4두로 고정", "지주 부담은 줄었으나 각종 부가세가 소작농에게 전가됨"], ["대동법 (1608~숙종)", "광해군(경기) ➔ 숙종(전국)", "공납(방납의 폐단)으로 인한 백성 파탄", "가호(집집마다) 기준 특산물 부과 ➔ 토지 결수(1결당 쌀 12두) 부과", "공인(어용 상인) 등장 ➔ 상품 화폐 경제 급속 발전"], ["균역법 (1750)", "영조", "군역(백골징포, 황구첨정)의 극심한 폐단", "1년에 군포 2필을 1필로 감면", "결작(1결당 2두), 선무군관포(부유한 상민 1필), 어염선세 징수로 보충"]]}, {"title": "실학의 두 흐름: 중농학파 vs 중상학파", "headers": ["구분", "대표 학자", "대표 저서", "핵심 주장 및 개혁안"], "rows": [["중농학파 (경세치용)", "유형원", "<반계수록>", "균전론: 신분에 따른 차등 토지 재분배 주장"], ["중농학파 (경세치용)", "이익", "<성호사설>", "한전론: 생계 보장용 '영업전' 설정하여 매매 금지(하한선 보장), 6좀 비판"], ["중농학파 (경세치용)", "정약용", "<경세유표>, <목민심서>", "여전론: 1여 단위 공동 소유·공동 노동·노동량에 따른 분배 ➔ 정전론, 거중기 설계"], ["중상학파 (이용후생)", "유수원", "<우서>", "사농공상의 직업적 평등화, 상공업 진흥"], ["중상학파 (이용후생)", "홍대용", "<임하필기>, <의산문답>", "혼천의 제작, 지전설과 무한 우주론 주장, 성리학적 중국 중심 세계관 비판"], ["중상학파 (이용후생)", "박지원", "<열하일기>, <양반전>", "수레와 선박의 이용, 화폐 유통 필요성 강조, 양반의 무위도식 비판"], ["중상학파 (이용후생)", "박제가", "<북학의>", "청과의 통상 확대, 소비 촉진론 (재물은 우물물과 같아서 퍼내야 채워짐)"]]}], "killer_records": [{"title": "사료 1: 대동법의 본질 (이원익 상소)", "text": "각 고을의 공물은 특산물이 나오지 않아 방납하는 무리에게 높은 값을 주고 사서 바치느라 백성의 뼈가 깎입니다. 청컨대 경기 지역에 시험하여 토지 결수를 기준으로 1결마다 쌀 12두를 거두어 공물을 대신하게 하소서."}, {"title": "사료 2: 박제가의 우물물 비유 (북학의)", "text": "재물은 대체로 우물과 같다. 퍼내면 차고 버려두면 말라 버린다. 비단 옷을 입지 않으므로 나라에 비단 짜는 사람이 없고, 그릇이 일그러져도 고치지 않으므로 기예가 발전하지 못한다. 절약만 숭상하고 소비를 권장하지 않으니 나라가 가난해진다."}], "mnemonics": ["💡 대동법 핵심 요점: [토지 결수 기준 / 1결당 12두 / 공인 등장 / 장시와 화폐 발달]", "💡 정조 4대 업적: [규장각 / 초계문신제 / 장용영 / 신해통공(금난전권 철폐)]"]}, "questions": [{"id": "q6_1", "question": "다음 제도의 시행으로 나타난 사회 경제적 변화로 옳은 것은?", "passage": "공물을 집집마다 거두지 않고 토지의 결수에 따라 1결당 쌀 12말, 또는 삼베나 무명, 동전 등으로 거두게 하였다. 이 법이 전국적으로 확대되자 관청에서 필요한 물품을 대량으로 사들이는 어용 상인들이 등장하였다.", "options": ["① 지주에게 결작이라 하여 1결당 쌀 2두를 추가로 징수하였다.", "② 풍흉에 따라 연분 9등으로 전세를 책정하였다.", "③ 공인이 등장하여 상품 화폐 경제와 장시 발달을 촉진하였다.", "④ 양반에게도 군포를 징수하는 호포제가 전국에 실시되었다.", "⑤ 수신전과 휼양전을 폐지하고 현직 관리에게만 수조권을 지급하였다."], "answer": 3, "explanation": {"summary": "제시된 제도는 방납의 폐단을 시정하기 위해 광해군 때 경기도를 시작으로 숙종 때 전국으로 확대된 '대동법'입니다.", "choices": ["① 오답: 결작 징수는 영조의 균역법입니다.", "② 오답: 연분 9등법은 조선 전기 세종의 공법입니다.", "③ 정답: 대동법 시행으로 관청에 필요한 물품을 조달하는 국가 공인 어용 상인인 '공인'이 등장하여 장시와 화폐 유통이 활성화되었습니다.", "④ 오답: 호포제는 흥선대원군 때의 개혁입니다.", "⑤ 오답: 수신전·휼양전 폐지와 현직 지급은 세조의 직전법입니다."]}}, {"id": "q6_2", "question": "다음 정책을 단행한 조선 후기 국왕의 업적으로 옳은 것은?", "passage": "• 왕실 도서관이자 학술 연구 기관으로 규장각을 설치하고 서얼 출신 인재를 검서관으로 기용하였다.\n• 능력 있는 젊은 문신들을 선발하여 직접 교육하는 초계문신제를 실시하였다.\n• 시전 상인의 특권이었던 금난전권을 육의전을 제외하고 철폐하는 '신해통공'을 단행하였다.", "options": ["① 서원을 300여 개소 정리하고 성균관에 탕평비를 건립하였다.", "② 군역의 부담을 줄이기 위해 균역법을 제정하였다.", "③ 국왕의 친위 부대로 장용영을 설치하고 수원 화성을 축조하였다.", "④ 삼정의 문란을 수습하기 위해 삼정이정청을 설치하였다.", "⑤ 훈련도감을 설치하여 포수·사수·살수의 삼수미병을 양성하였다."], "answer": 3, "explanation": {"summary": "규장각 설치, 초계문신제, 신해통공(1791)을 단행한 국왕은 '정조'입니다.", "choices": ["① 오답: 서원 정리와 탕평비 건립은 영조입니다.", "② 오답: 균역법 제정은 영조입니다.", "③ 정답: 정조는 왕권을 뒷받침할 군사적 기반으로 국왕 친위 부대인 '장용영'을 창설하고 이상 도시인 '수원 화성'을 건설하였습니다.", "④ 오답: 삼정이정청 설치는 철종 때(1862 임술 농민 봉기 수습책)입니다.", "⑤ 오답: 훈련도감 설치는 선조 때 임진왜란 중입니다."]}}]}, {"id": "era7", "name": "7. 근대 개항기", "tag": "출제 5~6문항", "period": "1863년 ~ 1910년 (흥선대원군 집권 ~ 경술국치)", "summary": "흥선대원군의 대내외 개혁, 불평등 조약 체결, 임오군란·갑신정변, 동학농민운동(전주화약, 우금치), 갑오·을미개혁, 독립협회 vs 대한제국 광무개혁, 을사늑약 및 국권 피탈 조약 과정을 완벽히 정리해야 합니다.", "theory": {"tables": [{"title": "흥선대원군의 양대 외환 (병인양요 vs 신미양요)", "headers": ["사건명", "연도 및 침략국", "원인 및 계기", "주요 격전지 및 활약 인물", "결과 및 피해"], "rows": [["병인양요", "1866년 (프랑스)", "병인박해 (프랑스 선교사와 천주교도 처형)", "문수산성(한성근), 정족산성(양헌수)", "프랑스군 격퇴, 외규장각 도서 및 의궤 약탈당함"], ["신미양요", "1871년 (미국)", "제너럴 셔먼호 사건 (1866년 평양 관민이 침몰)", "초지진·덕진진 함락, 광성보(어재연 장군 결사항전)", "미군 격퇴(스스로 철수), 어재연 수자기 약탈당함, 전국에 척화비 건립"]]}, {"title": "근대 개혁 운동 4대 비교표 (정강 및 핵심 개혁)", "headers": ["사건명", "주도 세력", "핵심 개혁 내용", "한계 및 의의"], "rows": [["갑신정변 (1884)", "급진개화파 (김옥균, 박영효)", "14개조 정강: 청 사대 청산, 문벌 폐지·인민 평등, 호조로 재정 일원화", "민중 지지 결여, 청군 개입 3일 천하 / 최초의 근대 국민 국가 수립 운동"], ["동학농민운동 (1894)", "동학 농민군 (전봉준, 손화중)", "폐정 개혁안 12조: 탐관오리 처벌, 토지 평균 분작, 노비문서 소각, 왜와 통하는 자 엄벌", "우금치 전투 패배로 좌절 / 반봉건·반외세 민족 운동, 갑오개혁에 반영"], ["제1차 갑오개혁 (1894)", "김홍집 내각 (군국기무처)", "신분제(공사 노비제) 철폐, 과거제 폐지, 과부 재가 허용, 은본위 화폐, 탁지아문 재정 일원화", "일본의 간섭, 군제 개혁 및 토지 개혁 부재 / 봉건적 악습 공식 철폐"], ["대한제국 광무개혁 (1897)", "고종 황제", "구본신참(옛것을 근본으로 새것을 참작), 양전 사업 및 지계 발급, 원수부 설치, 상공업 진흥", "황제권 무한 집중, 외세 간섭 / 자주적 근대화 시도"]]}], "killer_records": [{"title": "사료 1: 동학 농민군의 백산 격문 (1894년)", "text": "우리가 의를 들어 여기에 이른 것은 그 뜻이 결코 딴 데 있지 아니하고 백성을 도탄에서 건지고 국가를 반석 위에 올려놓기 위함이다. 안으로는 탐학한 관리의 머리를 베고, 밖으로는 횡포한 강적의 무리를 몰아내고자 함이다. 군자나 유학자들은 우리를 도적이라 부르지 말라."}, {"title": "사료 2: 독립협회 관민공동회 헌의 6조 (1898년)", "text": "1. 외국인에게 의지하지 말고 관민이 한마음으로 황제권을 공고히 할 것. 2. 광산, 철도, 석탄, 차관 등 이권에 관한 조약은 각 대신과 중추원 의장이 합동 날인할 것. 3. 전국의 재정은 탁지부에서 관할하고 예산과 결산을 공포할 것."}], "mnemonics": ["💡 강화도 조약 3대 불평등: [해안측량권 + 영사재판권(치외법권) + 3개 항구 개항(부산, 원산, 인천)]", "💡 재정 일원화 기구 감별: 갑신정변=[호조] vs 1차 갑오개혁=[탁지아문] vs 독립협회 헌의6조=[탁지부]"]}, "questions": [{"id": "q7_1", "question": "다음 개혁안을 추진한 개혁 기구(또는 정부)에 대한 설명으로 옳은 것은?", "passage": "• 공·사 노비 제도를 전면 혁파하여 신분 차별을 없앤다.\n• 문벌과 가문을 따지지 않고 인재를 등용하며 과거 시험을 폐지한다.\n• 과부의 재가를 귀천을 막론하고 자유에 맡긴다.\n• 은본위 화폐 제도를 채택하고 조세는 탁지아문에서 일원화하여 관할한다.", "options": ["① 김홍집 내각이 군국기무처를 설치하여 추진한 제1차 갑오개혁이다.", "② 구본신참의 원칙에 따라 토지 문서인 지계를 발급하였다.", "③ 우정총국 개국 축하연을 기회로 정변을 일으켜 14개조 정강을 발표하였다.", "④ 종로 백성들과 함께 만민공동회를 열어 러시아의 침략을 규탄하였다.", "⑤ 헌의 6조를 국왕에게 건의하여 중추원 관제를 개편하고자 하였다."], "answer": 1, "explanation": {"summary": "공사 노비제 폐지, 과거제 폐지, 과부 재가 허용, 은본위제, 탁지아문 재정 일원화는 1894년 '제1차 갑오개혁(군국기무처)'입니다.", "choices": ["① 정답: 제1차 갑오개혁은 군국기무처를 중심으로 수백 건의 봉건적 악습을 혁파하였습니다.", "② 오답: 구본신참과 지계 발급은 대한제국 광무개혁입니다.", "③ 오답: 우정총국 축하연과 14개조 정강은 갑신정변(1884)입니다.", "④ 오답: 만민공동회와 절영도 조차 저지는 독립협회입니다.", "⑤ 오답: 헌의 6조와 중추원 개편은 독립협회 관민공동회입니다."]}}, {"id": "q7_2", "question": "다음 조약이 체결된 결과로 나타난 사실로 옳은 것은?", "passage": "제1조: 일본국 정부는 도쿄에 있는 외무성을 통하여 금후 한국의 외국에 대한 관계 및 사무를 감리·지휘할 것임.\n제2조: 일본국 정부는 한국과 타국 사이에 현존하는 조약의 실행을 완전히 유지할 책임을 지며, 한국 정부는 금후 일본국 정부의 중개를 거치지 않고서는 어떠한 국제적 조약이나 약속을 맺지 못함.\n제3조: 통감부를 서울에 두고 통감 1명을 주재하게 함.", "options": ["① 고종이 헤이그 만국 평화 회의에 특사를 파견하였다.", "② 메가타가 재정 고문으로 부임하여 화폐 정리 사업을 단행하였다.", "③ 군대가 해산되고 통감의 추천을 받은 일본인이 차관으로 임명되었다.", "④ 사법권을 일제에 빼앗기고 교도소 행정권을 박탈당하였다.", "⑤ 조·일 수호 조규가 체결되어 부산, 원산, 인천이 개항되었다."], "answer": 1, "explanation": {"summary": "제시된 조약은 외교권 박탈과 통감부 설치를 규정한 1905년 '제2차 한일협약(을사늑약)'입니다.", "choices": ["① 정답: 고종 황제는 을사늑약의 부당성을 세계에 알리기 위해 1907년 네덜란드 헤이그에 이상설, 이준, 이위종 특사를 파견하였습니다.", "② 오답: 메가타 고문 파견은 1904년 제1차 한일협약입니다.", "③ 오답: 군대 해산과 차관 정치는 1907년 한일신협약(정미7조약)입니다.", "④ 오답: 사법권 박탈은 1909년 기유각서입니다.", "⑤ 오답: 3개 항구 개항은 1876년 강화도 조약입니다."]}}]}, {"id": "era8", "name": "8. 일제 강점기", "tag": "출제 6~7문항", "period": "1910년 ~ 1945년 (국권 피탈 ~ 광복)", "summary": "1910 무단 / 1920 문화 / 1930~40 민족말살 통치 방식 비교, 3·1운동과 대한민국 임시정부의 변천, 국내 실력양성 및 학생·사회 운동(신간회), 국외 무장독립운동사(봉오동, 청산리, 한중연합작전, 의열단, 한인애국단, 한국광복군)를 총정리합니다.", "theory": {"tables": [{"title": "일제의 식민 통치 3대 시기 총정리", "headers": ["시기", "통치 방식 (정치·치안)", "경제 수탈 정책", "민족의 대응 및 독립운동"], "rows": [["1910년대", "무단 통치: 헌병 경찰제, 즉결 처분권, 조선태형령, 칼 찬 교원", "토지조사사업(기한부 신고제 ➔ 미신고 토지 수탈), 회사령(허가제)", "국내 비밀결사(독립의군부, 대한광복회), 3·1 운동(1919)"], ["1920년대", "문화 통치 (민족 분열책): 보통 경찰제, 조선·동아일보 창간 허용, 치안유지법(1925)", "산미증식계획(증산량 < 수탈량, 소작농 전락), 회사령 폐지(신고제)", "실력양성(물산장려, 밀립대학), 6·10만세, 광주학생, 신간회 결성(1927), 봉오동·청산리 대첩"], ["1930~40년대", "민족 말살 통치: 황국신민서사 암송, 신사참배 강요, 창씨개명, 조선어학회 사건(1942)", "병참기지화, 국가총동원법(1938) ➔ 징용, 징병, 위안부, 식량배급·공출제", "한중 연합 작전(한국독립군, 조선혁명군), 한인애국단(이봉창·윤봉길), 한국광복군 창설(1940)"]]}, {"title": "무장 독립 투쟁의 3대 핵심 조직과 활약", "headers": ["단체명", "결성 연도 및 중심 인물", "행동 강령 / 성격", "주요 활동 및 격전"], "rows": [["의열단", "1919년 만주 길림 (김원봉)", "신채호의 <조선혁명선언> (민중의 직접 폭력 혁명 표방)", "김익상(조선총독부), 김상옥(종로경찰서), 나석주(동양척식주식회사·식산은행) 폭탄 투척"], ["한인애국단", "1931년 상하이 (김구)", "임시정부 침체 타개를 위한 의열 투쟁 조직", "이봉창(도쿄 일왕 마차 폭탄 투척) ➔ 윤봉길(상하이 훙커우 공원 전승기념식 폭탄 투척, 장제스 지원 계기)"], ["한국광복군", "1940년 충칭 (지청천 총사령관)", "대한민국 임시정부의 정규 국군", "대일 선전포고(1941), 인도·미얀마 전선 영국군 연합 심리전, 미국 OSS 합작 국내 진공 작전 추진"]]}], "killer_records": [{"title": "사료 1: 신채호의 조선혁명선언 (의열단 선언 1923년)", "text": "강도 일본이 우리의 국호를 없이 하며 정권을 빼앗았으니... 우리는 선언하노라. 민중은 우리 혁명의 대본영이다. 폭력은 우리 혁명의 유일한 무기이다. 우리는 민중 속에 들어가 민중과 손을 잡고 끊임없는 폭력 - 암살, 파괴, 폭동으로써 강도 일본의 통치를 타도하고..."}, {"title": "사료 2: 신간회 창립 강령 (1927년)", "text": "1. 우리는 정치적·경제적 각성을 촉진한다.\n2. 우리는 단결을 공고히 한다.\n3. 우리는 기회주의를 일체 부인한다."}], "mnemonics": ["💡 1930년대 초 만주 한중연합군: [한·호·지 - 쌍사대] (한국독립군+중국호로군+지청천 = 쌍성보·사도하자·대전자령) / [조·의·양 - 영흥] (조선혁명군+중국의용군+양세봉 = 영릉가·흥경성)", "💡 신간회 핵심 요약: [정우회 선언 계기 / 비타협적 민족주의 + 사회주의 연대 / 회장 이상재 / 광주학생항일운동 진상조사단 파견]"]}, "questions": [{"id": "q8_1", "question": "다음 강령을 내걸고 결성된 민족 운동 단체에 대한 설명으로 옳은 것은?", "passage": "1. 우리는 정치적, 경제적 각성을 촉진한다.\n2. 우리는 단결을 공고히 한다.\n3. 우리는 기회주의를 일체 부인한다.\n\n• 배경: 비타협적 민족주의자와 사회주의 진영이 연대한 정우회 선언을 바탕으로 창립되었다.", "options": ["① 김원봉을 중심으로 만주 길림에서 결성되어 파괴와 암살 활동을 펼쳤다.", "② 광주 학생 항일 운동에 진상 조사단을 파견하고 민중 대회를 계획하였다.", "③ 물산장려운동을 주도하며 '내 살림 내 것으로'라는 구호를 내걸었다.", "④ 파리 강화 회의에 김규식을 파견하여 독립 청원서를 제출하였다.", "⑤ 1천만이 한 사람이 1원씩 모금하자는 밀립대학 설립 운동을 전개하였다."], "answer": 2, "explanation": {"summary": "제시된 강령('기회주의 일체 부인')과 정우회 선언을 계기로 결성된 단체는 민족유일당 단체인 '신간회(1927)'입니다.", "choices": ["① 오답: 김원봉 중심의 만주 결성 단체는 의열단입니다.", "② 정답: 신간회는 1929년 광주 학생 항일 운동이 일어나자 진상 조사단을 파견하고 대규모 민중 대회를 추진하며 전국적 항일 열기를 이끌었습니다.", "③ 오답: 물산장려운동은 조선물산장려회(조만식 등)입니다.", "④ 오답: 파리강화회의 김규식 파견은 신한청년당 및 대한민국 임시정부입니다.", "⑤ 오답: 밀립대학 설립 운동은 조선민립대학기성회(이상재 등)입니다."]}}, {"id": "q8_2", "question": "대한민국 임시정부의 정규 군대인 (가) 군대에 대한 설명으로 옳은 것은?", "passage": "(가) 은/는 1940년 9월 중국 충칭에서 창설되었다. 지청천이 총사령관에 취임하였고, 이후 김원봉이 이끄는 조선의용대의 일부 병력이 합류하였다. 태평양 전쟁 발발 후 일제에 선전포고를 하였으며, 영국군과 연합하여 인도·미얀마 전선에서 활약하였다.", "options": ["① 봉오동 전투에서 일본군 월강추격대를 대파하였다.", "② 북로군정서군과 연합하여 청산리 대첩에서 큰 승리를 거두었다.", "③ 미국 전략정보국(OSS)과 합작하여 국내 진공 작전을 계획하였다.", "④ 중국 호로군과 연합하여 쌍성보와 대전자령 전투를 승리로 이끌었다.", "⑤ 참의부, 정의부, 신민부의 3부를 통합하여 조직되었다."], "answer": 3, "explanation": {"summary": "1940년 충칭에서 창설된 임시정부 정규군은 '한국광복군(총사령관 지청천)'입니다.", "choices": ["① 오답: 봉오동 전투는 홍범도의 대한독립군 등 연합부대입니다.", "② 오답: 청산리 대첩은 김좌진의 북로군정서와 홍범도 부대 등입니다.", "③ 정답: 한국광복군은 미국의 첩보기관 OSS와 협력하여 국내 정진군을 훈련하고 1945년 국내 진공 작전(독수리 작전)을 준비하였습니다.", "④ 오답: 쌍성보·대전자령 전투는 지청천의 한국독립군입니다.", "⑤ 오답: 3부 통합은 국민부, 혁신의회 등입니다."]}}]}, {"id": "era9", "name": "9. 현대사", "tag": "출제 4~5문항", "period": "1945년 광복 ~ 2000년대 (남북 화해)", "summary": "모스크바 3상 회의, 5·10 총선과 대한민국 정부 수립, 농지개혁법과 반민특위, 6·25 전쟁, 4·19 혁명, 박정희 정부(유신체제), 5·18과 6월 민주항쟁, 그리고 역대 정부의 3대 남북 합의(7·4, 기본합의서, 6·15)를 총정리합니다.", "theory": {"tables": [{"title": "광복 후 대한민국 정부 수립 6단계 타임라인", "headers": ["단계", "시기", "핵심 사건", "결정 사항 및 역사적 전개"], "rows": [["1단계", "1945.12", "모스크바 3국 외상 회의", "한국 임시 민주정부 수립, 미·소 공동위원회 설치, 최고 5년간 4개국 신탁통치 결정 ➔ 우익 반탁 vs 좌익 찬탁 대립"], ["2단계", "1946.06", "이승만의 정읍 발언", "남한만이라도 단독 정부를 수립해야 한다고 주장 ➔ 민족 분단 위기 고조"], ["3단계", "1946.07", "좌우 합작 위원회", "김규식(중도우), 여운형(중도좌) 주도, 좌우 합작 7원칙 발표 (토지 유상매수·체감매상·무상분배)"], ["4단계", "1947~48", "UN 소총회 결의 & 남북협상", "선거 가능한 남한만의 단독 총선거 결의 ➔ 김구의 <삼천만 동포에게 읍고함>, 남북 연석회의(김구·김규식 평양 방문)"], ["5단계", "1948.05.10", "5·10 총선거 (제헌국회)", "우리나라 최초의 보통·평등·직접·비밀선거, 제헌 국회의원 선출 (임기 2년), 헌법 제정(대통령 이승만)"], ["6단계", "1948.08.15", "대한민국 정부 수립 선포", "삼권분립에 기초한 민주공화국 출범 (UN 총회에서 한반도 유일 합법 정부 승인)"]]}, {"title": "역대 정부의 3대 핵심 통일 선언 비교 (킬러 1순위)", "headers": ["합의 문서명", "발표 연도 / 정부", "핵심 원칙 및 합의 내용", "설치 기구 및 역사적 의의"], "rows": [["7·4 남북 공동 성명", "1972년 (박정희 정부)", "자주, 평화, 민족 대단결의 통일 3대 원칙 천명", "남북조절위원회 설치 (이후 10월 유신헌법 등 권력 강화에 악용)"], ["남북 기본 합의서", "1991년 (노태우 정부)", "상호 체제 인정 및 존중, 상호 불가침, 교류 협력 확대, 잠정적 특수 관계 규정", "남북한 UN 동시 가입(1991.9) 직후 채택, 한반도 비핵화 공동 선언 발표"], ["6·15 남북 공동 선언", "2000년 (김대중 정부)", "남측의 연합제 안과 북측의 낮은 단계의 연방제 안의 공통성 인정", "분단 후 최초의 남북 정상회담, 개성공단 착공, 경의선 철도 복원, 이산가족 상봉"]]}], "killer_records": [{"title": "사료 1: 7·4 남북 공동 성명 (1972년)", "text": "첫째, 통일은 외세에 의존하거나 외세의 간섭을 받음이 없이 자주적으로 해결하여야 한다.\n둘째, 통일은 서로 상대방을 반대하는 무력 행사에 의거하지 않고 평화적 방법으로 실현하여야 한다.\n셋째, 사상과 이념, 제도의 차이를 초월하여 우선 하나의 민족으로서 민족적 대단결을 도모하여야 한다."}, {"title": "사료 2: 남북 기본 합의서 (1991년 노태우 정부)", "text": "남과 북은 서로 상대방의 체제를 인정하고 존중한다... 남과 북은 상대방을 파괴·전복하려는 일체의 행위를 하지 아니한다... 쌍방 사이의 관계가 나라와 나라 사이의 관계가 아닌 통일을 지향하는 과정에서 잠정적으로 형성되는 특수 관계임을 인정하고..."}], "mnemonics": ["💡 3대 통일선언 매칭: [7·4 성명(박정희 - 자주·평화·민족대단결)] ➔ [기본합의서(노태우 - 체제인정·불가침)] ➔ [6·15 선언(김대중 - 연합제·낮은연방제)]", "💡 민주화 항쟁 순서: [4·19 혁명(1960, 이승만 하야)] ➔ [5·18 민주화운동(1980, 광주 시민군)] ➔ [6월 민주항쟁(1987, 5년 단임 직선제 개헌)]"]}, "questions": [{"id": "q9_1", "question": "다음 성명이 발표된 계기가 된 민주화 운동에 대한 설명으로 옳은 것은?", "passage": "• 구호: '호헌 철폐, 독재 타도!', '직선제로 개헌하라!'\n• 계기: 박종철 고문치사 사건 은폐 축소 의혹, 전두환 대통령의 4·13 호헌 조치, 이한열 열사의 최루탄 피격 사망 사건\n• 결과: 노태우 민정당 대표최고위원이 평화적 정권 교체와 5년 단임 대통령 직선제를 수용하는 '6·29 민주화 선언'을 발표하였다.", "options": ["① 3·15 부정선거에 항거하여 일어났으며 이승만 대통령의 하야를 이끌어냈다.", "② 신군부의 비상계엄 확대에 맞서 광주에서 시민군을 결성하여 항전하였다.", "③ 한·일 국교 정상화 추진에 반대하여 일어난 6·3 시위이다.", "④ 1987년 6월 민주항쟁으로 현행 5년 단임 대통령 직선제 개헌(제9차 개헌)을 이끌어냈다.", "⑤ 유신 체제 종말의 직접적 계기가 된 YH 무역 사건이다."], "answer": 4, "explanation": {"summary": "호헌 철폐, 독재 타도를 외치며 6·29 선언을 이끌어낸 사건은 1987년 '6월 민주항쟁'입니다.", "choices": ["① 오답: 3·15 부정선거 항거와 이승만 하야는 1960년 4·19 혁명입니다.", "② 오답: 신군부 계엄 확대와 광주 시민군 결성은 1980년 5·18 민주화운동입니다.", "③ 오답: 한일 국교 정상화 반대는 1964년 6·3 시위입니다.", "④ 정답: 6월 민주항쟁의 승리로 1987년 9차 개헌이 이루어져 국민이 직접 대통령을 뽑는 5년 단임 직선제가 확립되었습니다.", "⑤ 오답: YH 무역 사건은 1979년 유신 말기 사건입니다."]}}, {"id": "q9_2", "question": "다음 남북 합의서가 채택된 정부 시기의 통일 노력 및 대외 정책으로 옳은 것은?", "passage": "• 합의서 명칭: 남북 사이의 화해와 불가침 및 교류·협력에 관한 합의서\n• 핵심 내용: 남과 북은 서로 상대방의 체제를 인정하고 존중하며, 상대방을 파괴·전복하려는 일체의 행위를 하지 않는다. 쌍방 사이의 관계는 나라와 나라 사이의 관계가 아닌 통일을 지향하는 잠정적 특수 관계임을 인정한다.", "options": ["① 최초로 남북 정상회담을 개최하고 6·15 남북 공동 선언을 발표하였다.", "② 7·4 남북 공동 성명을 발표하고 남북조절위원회를 설치하였다.", "③ 남북한이 UN에 동시 가입하고 한반도 비핵화 공동 선언을 채택하였다.", "④ 금강산 육로 관광을 시작하고 개성공단 사업을 착공하였다.", "⑤ 10·4 남북 공동 선언을 통해 서해 평화협력특별지대 설치를 합의하였다."], "answer": 3, "explanation": {"summary": "자료는 1991년 12월 노태우 정부 시기에 채택된 '남북 기본 합의서'입니다.", "choices": ["① 오답: 최초 정상회담과 6·15 공동 선언은 2000년 김대중 정부입니다.", "② 오답: 7·4 남북 공동 성명은 1972년 박정희 정부입니다.", "③ 정답: 노태우 정부는 북방 외교의 성과로 1991년 9월 남북한 UN 동시 가입을 성사시켰고, 12월 남북 기본 합의서와 한반도 비핵화 공동 선언을 발표하였습니다.", "④ 오답: 금강산 육로 관광과 개성공단 착공은 김대중~노무현 정부 시기입니다.", "⑤ 오답: 10·4 공동 선언은 2007년 노무현 정부입니다."]}}]}];

    // State Variables
    let currentEraIndex = 0;
    let activeTab = 'theory';
    let enteredPin = '';
    const CORRECT_PIN = '1353';
    let fontSizes = ['sm', 'base', 'lg', 'xl'];
    let currentFontIndex = 1; // 'base' is default

    // User Quiz Answers State: { qId: selectedOptionIndex }
    let userAnswers = {};
    // Saved Wrong Notes: Array of question IDs
    let savedWrongIds = JSON.parse(localStorage.getItem('korean_history_wrong_ids') || '[]');

    // ------------------------------------------
    // Init on Load
    // ------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      checkAuth();
      renderEraPills();
      loadEra(0);
      renderWrongNotes();

      // Listen for keyboard PIN input
      window.addEventListener('keydown', (e) => {
        const authOverlay = document.getElementById('authOverlay');
        if (authOverlay && !authOverlay.classList.contains('hidden')) {
          if (e.key >= '0' && e.key <= '9') {
            inputPin(e.key);
          } else if (e.key === 'Backspace') {
            backspacePin();
          } else if (e.key === 'Escape') {
            clearPin();
          }
        }
      });
    });

    // ------------------------------------------
    // 1. PIN Security Authentication (1353)
    // ------------------------------------------
    function checkAuth() {
      const savedAuth = localStorage.getItem('korean_history_auth');
      if (savedAuth === CORRECT_PIN) {
        unlockApp();
      }
    }

    function inputPin(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        updatePinDots();
        if (enteredPin.length === 4) {
          setTimeout(verifyPin, 150);
        }
      }
    }

    function backspacePin() {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDots();
        hideAuthError();
      }
    }

    function clearPin() {
      enteredPin = '';
      updatePinDots();
      hideAuthError();
    }

    function updatePinDots() {
      const dots = document.querySelectorAll('.pin-dot');
      dots.forEach((dot, idx) => {
        if (idx < enteredPin.length) {
          dot.classList.add('bg-indigo-600', 'dark:bg-indigo-400', 'border-indigo-600', 'scale-110');
          dot.classList.remove('bg-transparent');
        } else {
          dot.classList.remove('bg-indigo-600', 'dark:bg-indigo-400', 'border-indigo-600', 'scale-110');
          dot.classList.add('bg-transparent');
        }
      });
    }

    function verifyPin() {
      if (enteredPin === CORRECT_PIN) {
        localStorage.setItem('korean_history_auth', CORRECT_PIN);
        unlockApp();
      } else {
        showAuthError();
        const card = document.getElementById('authCard');
        card.classList.add('shake');
        setTimeout(() => {
          card.classList.remove('shake');
          clearPin();
        }, 400);
      }
    }

    function showAuthError() {
      const msg = document.getElementById('authErrorMsg');
      msg.textContent = '비밀번호가 일치하지 않습니다 (힌트: 1353)';
      msg.classList.remove('opacity-0');
    }

    function hideAuthError() {
      const msg = document.getElementById('authErrorMsg');
      msg.classList.add('opacity-0');
    }

    function unlockApp() {
      const overlay = document.getElementById('authOverlay');
      overlay.classList.add('opacity-0', 'pointer-events-none', 'transition-opacity', 'duration-300');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    function lockApp() {
      localStorage.removeItem('korean_history_auth');
      clearPin();
      const overlay = document.getElementById('authOverlay');
      overlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
    }

    // ------------------------------------------
    // 2. Era Navigation & Rendering
    // ------------------------------------------
    function renderEraPills() {
      const container = document.getElementById('eraPillsContainer');
      container.innerHTML = erasData.map((era, index) => {
        const isCurrent = index === currentEraIndex;
        return `
          <button onclick="loadEra(${index})" id="eraPill-${index}" class="px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-bold transition whitespace-nowrap ${
            isCurrent
              ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
              : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'
          }">
            ${era.name}
          </button>
        `;
      }).join('');
    }

    function loadEra(index) {
      currentEraIndex = index;
      renderEraPills();
      const era = erasData[index];

      // Update Banner
      document.getElementById('bannerTag').textContent = era.tag;
      document.getElementById('bannerPeriod').textContent = era.period;
      document.getElementById('bannerTitle').textContent = era.name;
      document.getElementById('bannerSummary').textContent = era.summary;

      // Update Mnemonics
      const mnemonicsContainer = document.getElementById('mnemonicsList');
      mnemonicsContainer.innerHTML = era.theory.mnemonics.map(m => `
        <div class="p-2.5 rounded-xl bg-white/70 dark:bg-slate-900/60 border border-amber-200 dark:border-amber-900/40">${m}</div>
      `).join('');

      // Update Tables
      const tablesContainer = document.getElementById('tablesContainer');
      tablesContainer.innerHTML = era.theory.tables.map(tbl => `
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
          <h4 class="text-base sm:text-lg font-black text-slate-900 dark:text-white mb-3 flex items-center gap-2">
            <i data-lucide="table" class="w-4 h-4 text-indigo-500"></i>
            <span>${tbl.title}</span>
          </h4>
          <div class="overflow-x-auto -mx-4 sm:mx-0">
            <table class="w-full text-left border-collapse min-w-[580px]">
              <thead>
                <tr class="bg-slate-100 dark:bg-slate-800/80 text-xs sm:text-sm text-slate-700 dark:text-slate-300">
                  ${tbl.headers.map(h => `<th class="p-3 border-b border-slate-200 dark:border-slate-700 font-extrabold">${h}</th>`).join('')}
                </tr>
              </thead>
              <tbody class="text-xs sm:text-sm divide-y divide-slate-100 dark:divide-slate-800">
                ${tbl.rows.map(row => `
                  <tr class="hover:bg-indigo-50/40 dark:hover:bg-slate-800/50 transition">
                    ${row.map((cell, cIdx) => `
                      <td class="p-3 font-${cIdx === 0 ? 'bold text-indigo-900 dark:text-indigo-300 whitespace-nowrap' : 'normal text-slate-700 dark:text-slate-300'}">${cell}</td>
                    `).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `).join('');

      // Update Records (사료 원문)
      const recordsContainer = document.getElementById('recordsContainer');
      recordsContainer.innerHTML = era.theory.killer_records.map(rec => `
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center gap-2 text-indigo-600 dark:text-indigo-400 font-bold text-sm mb-2">
              <i data-lucide="scroll" class="w-4 h-4"></i>
              <span>${rec.title}</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 font-serif leading-relaxed bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800">
              "${rec.text}"
            </p>
          </div>
        </div>
      `).join('');

      // Update Questions (5지선다)
      renderQuestions(era.questions);

      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ------------------------------------------
    // 3. 5-Choice Multiple Choice Questions Rendering
    // ------------------------------------------
    function renderQuestions(questions) {
      const container = document.getElementById('questionsContainer');
      document.getElementById('quizCounter').textContent = `총 ${questions.length}문항`;

      container.innerHTML = questions.map((q, qIndex) => {
        const isSaved = savedWrongIds.includes(q.id);
        const selected = userAnswers[q.id];
        return `
          <div id="card-${q.id}" class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-7 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
            <!-- Header: Number & Bookmark -->
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-xl bg-indigo-600 text-white font-black text-sm flex items-center justify-center">${qIndex + 1}</span>
                <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/60 px-2.5 py-1 rounded-full border border-indigo-200 dark:border-indigo-900">한능검 실전 5지선다</span>
              </div>
              <button onclick="toggleSaveWrong('${q.id}')" class="text-xs font-bold flex items-center gap-1.5 px-3 py-1.5 rounded-xl border transition ${
                isSaved
                  ? 'bg-rose-50 dark:bg-rose-950/60 text-rose-600 border-rose-300 dark:border-rose-800'
                  : 'bg-slate-50 dark:bg-slate-800 text-slate-500 border-slate-200 dark:border-slate-700'
              }">
                <i data-lucide="bookmark" class="w-4 h-4 ${isSaved ? 'fill-rose-500 text-rose-500' : ''}"></i>
                <span>${isSaved ? '오답노트 저장됨' : '오답노트 담기'}</span>
              </button>
            </div>

            <!-- Question Text -->
            <h4 class="text-base sm:text-lg font-black text-slate-900 dark:text-white leading-snug">
              ${q.question}
            </h4>

            <!-- Passage Box (자료/사료) -->
            ${q.passage ? `
              <div class="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/80 text-xs sm:text-sm text-slate-800 dark:text-slate-200 leading-relaxed font-serif whitespace-pre-line">
                ${q.passage}
              </div>
            ` : ''}

            <!-- 5 Options (1 to 5) -->
            <div class="space-y-2.5 pt-2">
              ${q.options.map((opt, optIdx) => {
                const optNum = optIdx + 1;
                const isSelected = selected === optNum;
                return `
                  <button onclick="selectOption('${q.id}', ${optNum})" id="optBtn-${q.id}-${optNum}" class="option-btn w-full text-left p-3.5 sm:p-4 rounded-2xl border text-xs sm:text-sm font-semibold transition flex items-start gap-3 ${
                    isSelected
                      ? 'bg-indigo-50 dark:bg-indigo-950/50 border-indigo-500 text-indigo-900 dark:text-indigo-200 shadow-sm'
                      : 'bg-white dark:bg-slate-800/40 border-slate-200 dark:border-slate-700/80 text-slate-700 dark:text-slate-300 hover:border-slate-300 dark:hover:border-slate-600'
                  }">
                    <span class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold flex items-center justify-center shrink-0 text-xs">${optNum}</span>
                    <span class="flex-1 pt-0.5 leading-relaxed">${opt.replace(/^[①②③④⑤]\s*/, '')}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Submit Check Button -->
            <div class="pt-2">
              <button onclick="submitAnswer('${q.id}')" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm sm:text-base transition shadow-md shadow-indigo-600/20 flex items-center justify-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4"></i>
                <span>정답 확인 및 상세 해설 보기</span>
              </button>
            </div>

            <!-- Detailed Explanation Box (Hidden initially) -->
            <div id="expBox-${q.id}" class="hidden mt-4 pt-4 border-t border-slate-200 dark:border-slate-800 space-y-4">
              <!-- Result Banner -->
              <div id="resultBanner-${q.id}" class="p-3.5 rounded-2xl text-sm font-bold flex items-center gap-2"></div>

              <!-- Summary Reason -->
              <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/60 p-3.5 rounded-2xl">
                <div class="text-xs font-black text-amber-800 dark:text-amber-300 uppercase tracking-wider mb-1">💡 정답 해설 및 핵심 요약</div>
                <div class="text-xs sm:text-sm text-amber-900 dark:text-amber-100 leading-relaxed">${q.explanation.summary}</div>
              </div>

              <!-- 5 Choices 1:1 Breakdown -->
              <div class="space-y-2">
                <div class="text-xs font-black text-slate-500 uppercase tracking-wider">선지별 1:1 정밀 감별</div>
                ${q.explanation.choices.map(c => `
                  <div class="p-2.5 rounded-xl text-xs sm:text-sm ${
                    c.includes('정답')
                      ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 border border-emerald-200 dark:border-emerald-800 font-medium'
                      : 'bg-slate-50 dark:bg-slate-800/40 text-slate-600 dark:text-slate-400 border border-slate-100 dark:border-slate-800'
                  }">
                    ${c}
                  </div>
                `).join('')}
              </div>
            </div>

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function selectOption(qId, optNum) {
      userAnswers[qId] = optNum;
      // Re-highlight options
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`optBtn-${qId}-${i}`);
        if (btn) {
          if (i === optNum) {
            btn.className = 'option-btn w-full text-left p-3.5 sm:p-4 rounded-2xl border text-xs sm:text-sm font-semibold transition flex items-start gap-3 bg-indigo-50 dark:bg-indigo-950/50 border-indigo-500 text-indigo-900 dark:text-indigo-200 shadow-sm';
          } else {
            btn.className = 'option-btn w-full text-left p-3.5 sm:p-4 rounded-2xl border text-xs sm:text-sm font-semibold transition flex items-start gap-3 bg-white dark:bg-slate-800/40 border-slate-200 dark:border-slate-700/80 text-slate-700 dark:text-slate-300 hover:border-slate-300 dark:hover:border-slate-600';
          }
        }
      }
    }

    function submitAnswer(qId) {
      const selected = userAnswers[qId];
      if (!selected) {
        alert('먼저 1번부터 5번 보기 중 하나를 선택해 주세요!');
        return;
      }

      // Find question
      let targetQ = null;
      erasData.forEach(era => {
        const found = era.questions.find(q => q.id === qId);
        if (found) targetQ = found;
      });

      if (!targetQ) return;

      const isCorrect = selected === targetQ.answer;
      const expBox = document.getElementById(`expBox-${qId}`);
      const banner = document.getElementById(`resultBanner-${qId}`);

      expBox.classList.remove('hidden');

      if (isCorrect) {
        banner.className = 'p-3.5 rounded-2xl text-sm font-bold flex items-center gap-2 bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-200 border border-emerald-300 dark:border-emerald-800';
        banner.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5 text-emerald-600"></i><span>정답입니다! 완벽하게 마스터하셨습니다. (정답: ${targetQ.answer}번)</span>`;
      } else {
        banner.className = 'p-3.5 rounded-2xl text-sm font-bold flex items-center gap-2 bg-rose-100 dark:bg-rose-950/60 text-rose-800 dark:text-rose-200 border border-rose-300 dark:border-rose-800';
        banner.innerHTML = `<i data-lucide="x-circle" class="w-5 h-5 text-rose-600"></i><span>아쉽게 틀렸습니다. (선택: ${selected}번 / 정답: ${targetQ.answer}번)</span>`;
        // Automatically add to wrong notes
        if (!savedWrongIds.includes(qId)) {
          savedWrongIds.push(qId);
          localStorage.setItem('korean_history_wrong_ids', JSON.stringify(savedWrongIds));
          renderWrongNotes();
        }
      }
      lucide.createIcons();
    }

    // ------------------------------------------
    // 4. Tab Switching
    // ------------------------------------------
    function switchTab(tab) {
      activeTab = tab;
      const tabs = ['theory', 'quiz', 'notes'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tabBtn-${t}`);
        const sec = document.getElementById(`section-${t}`);
        if (t === tab) {
          btn.className = 'tab-btn pb-3 px-3 sm:px-5 font-black text-sm sm:text-base border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 flex items-center gap-2 transition';
          sec.classList.remove('hidden');
        } else {
          btn.className = 'tab-btn pb-3 px-3 sm:px-5 font-bold text-sm sm:text-base border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-2 transition';
          sec.classList.add('hidden');
        }
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ------------------------------------------
    // 5. Wrong Notes & Search
    // ------------------------------------------
    function toggleSaveWrong(qId) {
      if (savedWrongIds.includes(qId)) {
        savedWrongIds = savedWrongIds.filter(id => id !== qId);
      } else {
        savedWrongIds.push(qId);
      }
      localStorage.setItem('korean_history_wrong_ids', JSON.stringify(savedWrongIds));
      // Re-render
      loadEra(currentEraIndex);
      renderWrongNotes();
    }

    function renderWrongNotes() {
      const container = document.getElementById('wrongNotesContainer');
      if (savedWrongIds.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-sm">
            <i data-lucide="bookmark" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
            저장된 오답 문제가 없습니다. 문제 풀이 중 헷갈리는 문제를 오답노트에 담아보세요!
          </div>
        `;
        lucide.createIcons();
        return;
      }

      let html = '';
      erasData.forEach(era => {
        era.questions.forEach(q => {
          if (savedWrongIds.includes(q.id)) {
            html += `
              <div class="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">[${era.name}]</span>
                  <button onclick="toggleSaveWrong('${q.id}')" class="text-xs text-rose-500 hover:underline">삭제</button>
                </div>
                <div class="text-sm font-bold text-slate-800 dark:text-slate-200">${q.question}</div>
                <div class="text-xs text-emerald-600 dark:text-emerald-400 font-bold">정답: ${q.answer}번</div>
                <div class="text-xs text-slate-500 dark:text-slate-400">${q.explanation.summary}</div>
              </div>
            `;
          }
        });
      });
      container.innerHTML = html;
      lucide.createIcons();
    }

    function clearAllWrongNotes() {
      if (confirm('모든 오답노트를 비우시겠습니까?')) {
        savedWrongIds = [];
        localStorage.removeItem('korean_history_wrong_ids');
        renderWrongNotes();
        loadEra(currentEraIndex);
      }
    }

    function handleGlobalSearch() {
      const query = document.getElementById('globalSearchInput').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('searchResultsList');
      const countSpan = document.getElementById('searchResultsCount');

      if (!query) {
        resultsDiv.innerHTML = '';
        countSpan.textContent = '검색어를 입력하면 전체 9개 시대의 이론과 문제를 즉시 찾아냅니다.';
        return;
      }

      let matchedTheories = [];
      let matchedQuestions = [];

      erasData.forEach((era, eIdx) => {
        // Search in summary & tables
        era.theory.tables.forEach(tbl => {
          tbl.rows.forEach(row => {
            if (row.some(cell => cell.toLowerCase().includes(query))) {
              matchedTheories.push({ era: era.name, eIdx, topic: tbl.title, snippet: row.join(' | ') });
            }
          });
        });
        // Search in questions
        era.questions.forEach(q => {
          if (q.question.toLowerCase().includes(query) || (q.passage && q.passage.toLowerCase().includes(query)) || q.options.some(o => o.toLowerCase().includes(query))) {
            matchedQuestions.push({ era: era.name, eIdx, question: q });
          }
        });
      });

      countSpan.textContent = `검색 결과: 이론 ${matchedTheories.length}건, 문제 ${matchedQuestions.length}건 발견`;

      let html = '';
      if (matchedTheories.length > 0) {
        html += `<h4 class="text-sm font-black text-indigo-600 dark:text-indigo-400 mt-4 mb-2">관련 이론 내용 (${matchedTheories.length}건)</h4>`;
        html += matchedTheories.map(t => `
          <div onclick="loadEra(${t.eIdx}); switchTab('theory');" class="cursor-pointer p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-indigo-500 transition text-xs sm:text-sm">
            <div class="font-bold text-slate-800 dark:text-slate-200">[${t.era}] ${t.topic}</div>
            <div class="text-slate-500 dark:text-slate-400 mt-1">${t.snippet}</div>
          </div>
        `).join('');
      }

      if (matchedQuestions.length > 0) {
        html += `<h4 class="text-sm font-black text-indigo-600 dark:text-indigo-400 mt-4 mb-2">관련 기출 문제 (${matchedQuestions.length}건)</h4>`;
        html += matchedQuestions.map(mq => `
          <div onclick="loadEra(${mq.eIdx}); switchTab('quiz');" class="cursor-pointer p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-indigo-500 transition text-xs sm:text-sm">
            <div class="font-bold text-indigo-600 dark:text-indigo-400">[${mq.era}]</div>
            <div class="text-slate-800 dark:text-slate-200 mt-1">${mq.question.question}</div>
          </div>
        `).join('');
      }

      resultsDiv.innerHTML = html;
    }

    // ------------------------------------------
    // 6. Font Scaler (Samsung Galaxy Support)
    // ------------------------------------------
    function changeFontSize(direction) {
      const body = document.body;
      const label = document.getElementById('fontScaleLabel');
      body.classList.remove(`font-scale-${fontSizes[currentFontIndex]}`);

      if (direction === 'up' && currentFontIndex < fontSizes.length - 1) {
        currentFontIndex++;
      } else if (direction === 'down' && currentFontIndex > 0) {
        currentFontIndex--;
      }

      body.classList.add(`font-scale-${fontSizes[currentFontIndex]}`);

      const labels = ['축소', '기본', '확대', '특대'];
      label.textContent = labels[currentFontIndex];
    }

    // ------------------------------------------
    // 7. Dark Mode Toggle
    // ------------------------------------------
    function toggleDarkMode() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('korean_history_theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('korean_history_theme', 'dark');
      }
    }

    // Initialize theme from preference
    if (localStorage.getItem('korean_history_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</body>
</html>
