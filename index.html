설치하였다.", "③ (나)는 동학 교주 최제우가 직접 지휘하여 전주성을 점령하였다.", "④ (나)의 결과 정부는 양반에게도 군포를 걷는 호포제를 즉각 시행하였다.", "⑤ (가)와 (나)는 모두 일본의 경제적 침탈에 맞선 반외세 운동이었다."], "answer": 1, "explanation": {"summary": "(가)는 1811년 홍경래의 난(정주성 패배), (나)는 1862년 임술 농민 봉기(진주 민란 ➔ 안핵사 박규수·삼정이정청 설치)입니다.", "choices": ["① 정답: 홍경래의 난은 서북인 차별 철폐를 외치며 청천강 이북을 장악했으나 정주성 전투에서 관군에 진압되었습니다.", "② 오답: 박규수 파견과 삼정이정청 설치는 (나) 임술 농민 봉기 때의 조치입니다.", "③ 오답: 전주성 점령은 1894년 전봉준의 동학 농민 운동입니다.", "④ 오답: 호포제는 이후 흥선대원군 집권기에 실시되었습니다.", "⑤ 오답: 세도 정치기 농민 봉기는 개항 이전으로, 탐관오리와 삼정의 문란에 맞선 반봉건 저항이었습니다."]}}]}, {"id": "era7", "name": "7. 근대 개항기", "tag": "출제 5~6문항", "period": "1863년 ~ 1910년 (흥선대원군 집권 ~ 경술국치)", "summary": "흥선대원군의 대내외 개혁, 불평등 조약 체결, 임오군란·갑신정변, 동학농민운동(전주화약, 우금치), 갑오·을미개혁, 독립협회 vs 대한제국 광무개혁, 을사늑약 및 국권 피탈 조약 과정을 완벽히 정리해야 합니다.", "theory": {"tables": [{"title": "흥선대원군의 양대 외환 (병인양요 vs 신미양요)", "headers": ["사건명", "연도 및 침략국", "원인 및 계기", "주요 격전지 및 활약 인물", "결과 및 피해"], "rows": [["병인양요", "1866년 (프랑스)", "병인박해 (프랑스 선교사와 천주교도 처형)", "문수산성(한성근), 정족산성(양헌수)", "프랑스군 격퇴, 외규장각 도서 및 의궤 약탈당함"], ["신미양요", "1871년 (미국)", "제너럴 셔먼호 사건 (1866년 평양 관민이 침몰)", "초지진·덕진진 함락, 광성보(어재연 장군 결사항전)", "미군 격퇴(스스로 철수), 어재연 수자기 약탈당함, 전국에 척화비 건립"]]}, {"title": "근대 개혁 운동 4대 비교표 (정강 및 핵심 개혁)", "headers": ["사건명", "주도 세력", "핵심 개혁 내용", "한계 및 의의"], "rows": [["갑신정변 (1884)", "급진개화파 (김옥균, 박영효)", "14개조 정강: 청 사대 청산, 문벌 폐지·인민 평등, 호조로 재정 일원화", "민중 지지 결여, 청군 개입 3일 천하 / 최초의 근대 국민 국가 수립 운동"], ["동학농민운동 (1894)", "동학 농민군 (전봉준, 손화중)", "폐정 개혁안 12조: 탐관오리 처벌, 토지 평균 분작, 노비문서 소각, 왜와 통하는 자 엄벌", "우금치 전투 패배로 좌절 / 반봉건·반외세 민족 운동, 갑오개혁에 반영"], ["제1차 갑오개혁 (1894)", "김홍집 내각 (군국기무처)", "신분제(공사 노비제) 철폐, 과거제 폐지, 과부 재가 허용, 은본위 화폐, 탁지아문 재정 일원화", "일본의 간섭, 군제 개혁 및 토지 개혁 부재 / 봉건적 악습 공식 철폐"], ["대한제국 광무개혁 (1897)", "고종 황제", "구본신참(옛것을 근본으로 새것을 참작), 양전 사업 및 지계 발급, 원수부 설치, 상공업 진흥", "황제권 무한 집중, 외세 간섭 / 자주적 근대화 시도"]]}], "killer_records": [{"title": "사료 1: 동학 농민군의 백산 격문 (1894년)", "text": "우리가 의를 들어 여기에 이른 것은 그 뜻이 결코 딴 데 있지 아니하고 백성을 도탄에서 건지고 국가를 반석 위에 올려놓기 위함이다. 안으로는 탐학한 관리의 머리를 베고, 밖으로는 횡포한 강적의 무리를 몰아내고자 함이다. 군자나 유학자들은 우리를 도적이라 부르지 말라."}, {"title": "사료 2: 독립협회 관민공동회 헌의 6조 (1898년)", "text": "1. 외국인에게 의지하지 말고 관민이 한마음으로 황제권을 공고히 할 것. 2. 광산, 철도, 석탄, 차관 등 이권에 관한 조약은 각 대신과 중추원 의장이 합동 날인할 것. 3. 전국의 재정은 탁지부에서 관할하고 예산과 결산을 공포할 것."}], "mnemonics": ["💡 강화도 조약 3대 불평등: [해안측량권 + 영사재판권(치외법권) + 3개 항구 개항(부산, 원산, 인천)]", "💡 재정 일원화 기구 감별: 갑신정변=[호조] vs 1차 갑오개혁=[탁지아문] vs 독립협회 헌의6조=[탁지부]"]}, "questions": [{"id": "q7_1", "question": "흥선대원군이 집권 기간(1863~1873)에 추진한 내정 개혁으로 옳지 않은 것은?", "passage": "고종이 어린 나이에 즉위하자 정권을 잡은 흥선대원군은 세도 정치를 청산하고 왕권을 강화하며 민생을 안정시키기 위한 개혁을 단행하였다.", "options": ["① 세도 가문의 기반인 비변사를 축소·폐지하고 의정부와 삼군부의 기능을 부활시켰다.", "② 양반에게도 군포를 징수하는 호포제를 실시하여 군정의 문란을 바로잡았다.", "③ 환곡의 폐단을 고치기 위해 면 단위로 주민이 자치 운영하는 사창제를 시행하였다.", "④ 국가 재정을 축내고 붕당의 온상이 된 서원을 47개소만 남기고 대폭 철폐하였다.", "⑤ 경복궁 중건 비용을 마련하기 위해 일본으로부터 대규모 차관을 도입하였다."], "answer": 5, "explanation": {"summary": "흥선대원군은 경복궁 중건 비용을 마련하기 위해 원납전 징수, 고액 화폐 당백전 발행, 사대문 통행세, 양반 묘지림 벌목 등을 시행했습니다.", "choices": ["① 옳음: 비변사 폐지, 의정부(정치)·삼군부(군사) 분리 부활입니다.", "② 옳음: 양반에게도 군포를 부과한 호포제(동포제)입니다.", "③ 옳음: 환곡을 사창제로 개혁했습니다.", "④ 옳음: 만동묘 철폐 및 전국 서원 47개소만 존치했습니다.", "⑤ 정답(옳지 않음): 흥선대원군은 통상 수교 거부 정책을 고수했으며, 경복궁 중건 자금은 원납전과 당백전 발행으로 조달했습니다."]}}, {"id": "q7_2", "question": "다음 두 외침 (가), (나)에 대한 설명으로 옳은 것은?", "passage": "(가) 1866년 병인박해를 구실로 프랑스 함대가 강화도를 침략하였다.\n(나) 1871년 제너럴 셔먼호 사건을 구실로 미국 아시아 함대가 강화도를 침략하였다.", "options": ["① (가)에서 어재연 장군이 광성보에서 끝까지 항전하다 전사하였다.", "② (가)에서 양헌수 부대가 정족산성에서 프랑스군을 격퇴하였으나 외규장각 의궤를 약탈당하였다.", "③ (나)에서 한성근 부대가 문수산성에서 미군을 격퇴하였다.", "④ (나) 직후 흥선대원군은 서양 문물을 수용하기 위해 통리기무아문을 설치하였다.", "⑤ (가)와 (나) 사이에 일본 운요호가 강화도 초지진에 불법 접근하였다."], "answer": 2, "explanation": {"summary": "(가)는 1866년 병인양요(프랑스, 문수산성 한성근·정족산성 양헌수, 외규장각 의궤 약탈), (나)는 1871년 신미양요(미국, 광성보 어재연, 수자기 약탈, 직후 전국 척화비 건립)입니다.", "choices": ["① 오답: 어재연 장군의 광성보 항전은 (나) 신미양요입니다.", "② 정답: 병인양요 때 양헌수가 정족산성에서 승리했으나 프랑스군은 철수하며 외규장각 도서와 의궤를 약탈했습니다.", "③ 오답: 한성근의 문수산성 전투는 (가) 병인양요입니다.", "④ 오답: 신미양요 직후 흥선대원군은 전국 각지에 '척화비'를 건립해 쇄국 의지를 더욱 굳혔습니다.", "⑤ 오답: 운요호 사건은 1875년으로 (나) 신미양요 이후입니다."]}}, {"id": "q7_3", "question": "1876년 체결된 강화도 조약(조·일 수호 조규)의 내용 및 성격으로 옳지 않은 것은?", "passage": "제1관 조선은 자주의 나라이며 일본과 평등한 권리를 보유한다.\n제4관 부산 외에 두 곳의 항구를 개항하여 일본인이 자유롭게 통상하도록 한다.\n제7관 일본국 항해자가 조선 연해를 자유로이 측량하도록 허가한다.\n제10관 일본 국민이 조선 항구에서 죄를 지으면 일본 관원이 심판한다.", "options": ["① 우리나라가 외국과 체결한 최초의 근대적 조약이자 불평등 조약이다.", "② 제1관은 조선에 대한 청나라의 전통적 종주권을 부인하려는 일본의 의도가 담겨 있다.", "③ 부산 외에 원산(군사)과 인천(정치·경제)의 2개 항구가 추가로 개항되었다.", "④ 일본에 조선의 해안 측량권과 영사 재판권(치외법권)을 허용하였다.", "⑤ 조선의 요구로 관세 부과 규정과 최혜국 대우 조항이 본 조약에 처음으로 포함되었다."], "answer": 5, "explanation": {"summary": "강화도 조약에는 관세 규정(부속 조약으로 무관세)과 최혜국 대우가 없었습니다. 관세 규정과 최혜국 대우가 처음 포함된 것은 1882년 조·미 수호 통상 조약입니다.", "choices": ["① 옳음: 최초의 근대적·불평등 조약입니다.", "② 옳음: 청의 간섭을 배제하고 조선 침략을 용이하게 하려는 의도입니다.", "③ 옳음: 부산, 원산, 인천 3개 항구가 개항되었습니다.", "④ 옳음: 해안 측량권(제7관)과 치외법권(제10관)이 대표적 불평등 조항입니다.", "⑤ 정답(옳지 않음): 강화도 조약에는 무관세·무항세였으며, 관세 및 최혜국 대우는 1882년 조·미 수호 통상 조약입니다."]}}, {"id": "q7_4", "question": "1882년 체결된 조·미 수호 통상 조약에 대한 설명으로 옳은 것은?", "passage": "제2차 수신사 김홍집이 일본에서 들여온 황준헌의 <조선책략>이 국내에 유포되면서 미국과의 수교 논의가 본격화되었다.", "options": ["① 서양 열강과 맺은 최초의 조약으로 청나라의 알선으로 체결되었다.", "② 거중 조정 조항은 빠졌으나 무관세 무역 규정이 명시되었다.", "③ 최혜국 대우 조항은 포함되지 않아 조선에 유리한 평등 조약이었다.", "④ 미국 선교사의 자유로운 포교 활동이 조약문에 공식적으로 허가되었다.", "⑤ 조약 체결 직후 일본에 보빙사를 파견하여 근대 문물을 시찰하였다."], "answer": 1, "explanation": {"summary": "조·미 수호 통상 조약(1882)은 서양 최초 조약으로 청의 알선으로 체결되었고, 거중 조정, 관세 부과, 치외법권, 최혜국 대우가 포함되었습니다.", "choices": ["① 정답: 러시아의 남하를 견제하려는 청(리홍장)의 적극적 알선으로 체결된 서양 최초 조약입니다.", "② 오답: 거중 조정과 '관세 부과' 규정이 포함되었습니다.", "③ 오답: 편무적 '최혜국 대우'와 치외법권이 포함된 불평등 조약입니다.", "④ 오답: 천주교 포교 허용(사실상 묵인)은 1886년 조·프 수호 통상 조약입니다.", "⑤ 오답: 보빙사(민영익·홍영식)는 일본이 아니라 '미국'에 파견되었습니다."]}}, {"id": "q7_5", "question": "개항 전후 유생들이 전개한 위정척사 운동의 시기별 흐름을 옳게 연결한 것은?", "passage": "바른 성리학(위정)을 지키고 서양과 일본의 사악한 문물(척사)을 배척하자는 위정척사 운동은 시기마다 주된 대상과 논리가 변화하였다.", "options": ["① 1860년대 - 최익현의 왜양일체론 (개항 반대)", "② 1870년대 - 이항로·기정진의 척화주전론 (통상 반대)", "③ 1880년대 - 이만손 등 영남 유생들의 영남 만인소 (<조선책략> 유포 반대)", "④ 1890년대 - 독립협회와 연합한 만민공동회 개최", "⑤ 1900년대 - 애국 계몽 운동으로 전환하여 신민회 결성"], "answer": 3, "explanation": {"summary": "위정척사 흐름: 1860년대(이항로·기정진, 통상 반대 척화주전론) ➔ 1870년대(최익현, 왜양일체론 개항 반대) ➔ 1880년대(이만손, 영남 만인소) ➔ 1890년대(을미의병 항일 의병 전쟁).", "choices": ["① 오답: 최익현의 왜양일체론은 1870년대(강화도 조약 반대)입니다.", "② 오답: 이항로·기정진의 척화주전론은 1860년대(흥선대원군 통상 수교 거부 지지)입니다.", "③ 정답: 1880년대에는 김홍집이 들여온 <조선책략>과 개화 정책에 반대하며 이만손을 비롯한 영남 유생들이 '영남 만인소'를 올렸습니다.", "④ 오답: 1890년대에는 을미사변·단발령에 반발해 '을미의병'으로 발전했습니다.", "⑤ 오답: 애국 계몽 운동과 신민회는 개화파 계열입니다."]}}, {"id": "q7_6", "question": "다음 사건의 결과로 체결된 조약과 영향으로 옳은 것은?", "passage": "신식 군대인 별기군에 비해 극심한 차별 대우를 받던 구식 군인들에게 13개월 만에 지급된 쌀에 겨와 모래가 섞여 있자 분노한 군인들이 봉기하였다. 이들은 일본 공사관을 습격하고 궁궐로 난입하였으며, 흥선대원군이 일시적으로 재집권하였다.", "options": ["① 일본과 제물포 조약을 체결하여 배상금 지불과 일본 공사관 경비병 주둔을 허용하였다.", "② 청·일 양국 간에 톈진 조약이 체결되어 군대 동시 철수를 약속하였다.", "③ 급진 개화파가 집권하여 14개조 개혁 정강을 발표하였다.", "④ 일본과 한성 조약을 체결하여 공사관 신축 비용을 부담하였다.", "⑤ 고종이 신변의 위협을 느껴 러시아 공사관으로 거처를 옮겼다."], "answer": 1, "explanation": {"summary": "구식 군인 차별 대우로 일어난 사건은 1882년 '임오군란'입니다. 결과로 제물포 조약(조·일)과 조·청 상민 수륙 무역 장정(조·청)이 체결되었습니다.", "choices": ["① 정답: 임오군란 결과 일본과 제물포 조약을 맺어 배상금 및 일본군 서울 주둔을 허용했고, 청과는 조·청 상민 수륙 무역 장정을 맺어 청의 내정 간섭이 심화되었습니다.", "② 오답: 톈진 조약은 1884년 갑신정변의 결과입니다.", "③ 오답: 14개조 개혁 정강은 갑신정변입니다.", "④ 오답: 한성 조약은 갑신정변의 결과입니다.", "⑤ 오답: 아관파천은 1896년 을미사변 이후입니다."]}}, {"id": "q7_7", "question": "다음 개혁 정강을 발표한 사건에 대한 설명으로 옳은 것은?", "passage": "1. 청에 잡혀간 대원군을 곧 돌아오게 하고 조공의 허례를 폐지할 것.\n2. 문벌을 폐지하여 인민 평등의 권리를 세우고 능력에 따라 관리를 등용할 것.\n3. 지조법을 개혁하여 간리를 막고 백성을 보호할 것.\n12. 모든 재정은 호조에서 총괄하여 관할할 것.", "options": ["① 김옥균·박영효 등 급진 개화파가 우정총국 개국 축하연을 계기로 일으킨 갑신정변이다.", "② 전봉준이 전주 화약을 체결한 뒤 집강소를 통해 실천한 폐정 개혁안이다.", "③ 군국기무처가 주도하여 추진한 제1차 갑오개혁의 핵심 내용이다.", "④ 독립협회가 관민공동회에서 결의하여 고종에게 올린 헌의 6조이다.", "⑤ 대한제국 정부가 구본신참의 원칙으로 발표한 대한국 국제이다."], "answer": 1, "explanation": {"summary": "청 조공 폐지, 문벌 폐지·인민 평등권, 지조법 개혁, 호조로 재정 일원화는 1884년 '갑신정변 14개조 개혁 정강'입니다.", "choices": ["① 정답: 급진 개화파가 우정총국 축하연에서 정변을 일으켰으나 청군의 개입으로 '3일 천하'로 끝나고 한성 조약·톈진 조약이 체결되었습니다.", "② 오답: 동학 농민 운동의 폐정 개혁안 12조입니다.", "③ 오답: 1차 갑오개혁은 탁지아문으로 재정 일원화입니다.", "④ 오답: 독립협회 헌의 6조는 탁지부 재정 일원화입니다.", "⑤ 오답: 대한국 국제는 황제권 절대화입니다."]}}, {"id": "q7_8", "question": "1894년 전개된 동학 농민 운동의 과정을 순서대로 옳게 나열한 것은?", "passage": "(가) 남접과 북접이 연합하여 항일 구국을 외치며 제2차 봉기를 일으켰으나 공주 우금치 전투에서 패배하였다.\n(나) 고부 군수 조병갑의 탐학에 분노한 농민들이 사발통문을 작성하고 고부 관아를 점령하였다.\n(다) 농민군이 황토현과 황룡촌 전투에서 관군을 격파하고 전주성을 점령한 뒤 전주 화약을 체결하였다.\n(라) 전라도 각지에 집강소를 설치하고 폐정 개혁안 12조를 자율적으로 실천하였다.", "options": ["① (나) - (다) - (라) - (가)", "② (나) - (라) - (다) - (가)", "③ (다) - (나) - (라) - (가)", "④ (나) - (다) - (가) - (라)", "⑤ (다) - (라) - (나) - (가)"], "answer": 1, "explanation": {"summary": "고부 봉기 ➔ 백산 봉기·황토현·황룡촌·전주성 점령·전주 화약 ➔ 집강소 설치 ➔ 일본 경복궁 점령 ➔ 2차 봉기(우금치 전투) 순입니다.", "choices": ["① 정답: (나) 고부 봉기 ➔ (다) 전주성 점령 및 전주 화약 ➔ (라) 집강소 운영 ➔ (가) 2차 봉기·우금치 패배 순서가 정확합니다.", "② 오답: 전주 화약 이후에 집강소가 설치되었습니다.", "③ 오답: 고부 봉기가 시작점입니다.", "④ 오답: 집강소 운영 중 일본이 경복궁을 점령해 2차 봉기가 일어났습니다.", "⑤ 오답: 순서가 뒤바뀌었습니다."]}}, {"id": "q7_9", "question": "다음 개혁안을 추진한 개혁 기구에 대한 설명으로 옳은 것은?", "passage": "• 공·사 노비 제도를 전면 혁파하여 신분 차별을 없앤다.\n• 문벌과 가문을 따지지 않고 인재를 등용하며 과거 시험을 폐지한다.\n• 과부의 재가를 귀천을 막론하고 자유에 맡긴다.\n• 은본위 화폐 제도를 채택하고 조세는 탁지아문에서 일원화하여 관할한다.", "options": ["① 김홍집 내각이 군국기무처를 설치하여 추진한 제1차 갑오개혁이다.", "② 구본신참의 원칙에 따라 토지 문서인 지계를 발급하였다.", "③ 우정총국 개국 축하연을 기회로 정변을 일으켜 14개조 정강을 발표하였다.", "④ 종로 백성들과 함께 만민공동회를 열어 러시아의 침략을 규탄하였다.", "⑤ 헌의 6조를 국왕에게 건의하여 중추원 관제를 개편하고자 하였다."], "answer": 1, "explanation": {"summary": "공사 노비제 폐지, 과거제 폐지, 과부 재가 허용, 은본위제, 탁지아문 재정 일원화는 1894년 '제1차 갑오개혁(군국기무처)'입니다.", "choices": ["① 정답: 제1차 갑오개혁은 군국기무처를 중심으로 봉건적 신분제와 과거제를 공식 철폐했습니다.", "② 오답: 대한제국 광무개혁입니다.", "③ 오답: 갑신정변(1884)입니다.", "④ 오답: 독립협회입니다.", "⑤ 오답: 독립협회 관민공동회입니다."]}}, {"id": "q7_10", "question": "1895년 을미사변 직후 추진된 을미개혁의 내용으로 옳지 않은 것은?", "passage": "삼국 간섭 이후 조선 정부가 러시아와 가까워지자 일본은 경복궁에 난입해 명성황후를 시해(을미사변)하고 친일 김홍집 내각을 통해 개혁을 밀어붙였다.", "options": ["① '건양'이라는 연호를 제정하고 양력(태양력)을 공식 채택하였다.", "② 전국에 종두법을 시행하고 근대적 초등 교육 기관인 소학교를 설치하였다.", "③ 성인 남성에게 상투를 자르게 하는 단발령을 강행하였다.", "④ 지방 행정 구역을 기존의 8도에서 23부로 개편하고 재판소를 설치하였다.", "⑤ 단발령과 명성황후 시해에 분노한 유생들이 을미의병을 일으켰다."], "answer": 4, "explanation": {"summary": "8도 ➔ 23부 개편, 재판소 설치(사법권 독립), 홍범 14조, 교육입국조서는 '제2차 갑오개혁(1894년 말)'의 내용입니다.", "choices": ["① 옳음: 건양 연호와 태양력 채택은 을미개혁입니다.", "② 옳음: 종두법·소학교·우편 사무 재개는 을미개혁입니다.", "③ 옳음: 단발령 강행은 을미개혁의 대표적 조치입니다.", "④ 정답(옳지 않음): 23부 개편과 재판소 설치는 제2차 갑오개혁입니다.", "⑤ 옳음: 유인석·이소응 등이 주도한 을미의병이 봉기했습니다."]}}, {"id": "q7_11", "question": "1896년 창립된 독립협회의 활동에 대한 설명으로 옳은 것은?", "passage": "서재필 등이 중심이 되어 창립한 독립협회는 자주 국권, 자유 민권, 자강 개혁을 목표로 활발한 민중 계몽 및 정치 운동을 전개하였다.", "options": ["① 만민공동회를 열어 러시아의 절영도 조차 요구와 한·러 은행 설치를 저지하였다.", "② 환구단에서 황제 즉위식을 거행하고 국호를 대한제국으로 선포하였다.", "③ 보부상들을 동원하여 황국협회를 조직하고 개혁 세력을 탄압하였다.", "④ 보안회를 조직하여 일본의 황무지 개간권 요구를 철회시켰다.", "⑤ 헤이그 만국 평화 회의에 특사를 파견하여 을사늑약의 무효를 알렸다."], "answer": 1, "explanation": {"summary": "독립협회는 독립문·독립관 건립, <독립신문> 발간, 만민공동회(러시아 절영도 저지), 관민공동회(헌의 6조, 의회 설립 추진)를 펼쳤습니다.", "choices": ["① 정답: 만민공동회를 통해 러시아의 부산 절영도 조차 요구를 저지하고 한·러 은행을 폐쇄하는 성과를 거두었습니다.", "② 오답: 대한제국 선포(1897)는 고종 황제입니다.", "③ 오답: 황국협회는 독립협회를 탄압·해산하기 위해 보수파 정부가 동원한 보부상 단체입니다.", "④ 오답: 보안회(1904)는 러일전쟁 중 결성된 애국 계몽 단체입니다.", "⑤ 오답: 헤이그 특사 파견(1907)은 고종입니다."]}}, {"id": "q7_12", "question": "다음 조약이 체결된 결과로 나타난 사실로 옳은 것은?", "passage": "제1조: 일본국 정부는 도쿄에 있는 외무성을 통하여 금후 한국의 외국에 대한 관계 및 사무를 감리·지휘할 것임.\n제3조: 통감부를 서울에 두고 통감 1명을 주재하게 함.", "options": ["① 고종이 헤이그 만국 평화 회의에 특사를 파견하였다.", "② 메가타가 재정 고문으로 부임하여 화폐 정리 사업을 단행하였다.", "③ 군대가 해산되고 일본인이 각 부 차관으로 임명되었다.", "④ 사법권을 일제에 빼앗기고 교도소 행정권을 박탈당하였다.", "⑤ 조·일 수호 조규가 체결되어 부산, 원산, 인천이 개항되었다."], "answer": 1, "explanation": {"summary": "외교권 박탈과 통감부 설치를 규정한 1905년 '을사늑약(제2차 한일협약)'입니다.", "choices": ["① 정답: 고종 황제는 을사늑약의 부당함을 국제 사회에 호소하기 위해 1907년 헤이그에 이상설·이준·이위종 특사를 파견했습니다.", "② 오답: 메가타 재정 고문 파견은 1904년 제1차 한일협약입니다.", "③ 오답: 군대 해산과 차관 정치는 1907년 정미7조약(한일신협약)입니다.", "④ 오답: 사법권 박탈은 1909년 기유각서입니다.", "⑤ 오답: 3개 항구 개항은 1876년 강화도 조약입니다."]}}]}, {"id": "era8", "name": "8. 일제 강점기", "tag": "출제 6~7문항", "period": "1910년 ~ 1945년 (국권 피탈 ~ 광복)", "summary": "1910 무단 / 1920 문화 / 1930~40 민족말살 통치 방식 비교, 3·1운동과 대한민국 임시정부의 변천, 국내 실력양성 및 학생·사회 운동(신간회), 국외 무장독립운동사(봉오동, 청산리, 한중연합작전, 의열단, 한인애국단, 한국광복군)를 총정리합니다.", "theory": {"tables": [{"title": "일제의 식민 통치 3대 시기 총정리", "headers": ["시기", "통치 방식 (정치·치안)", "경제 수탈 정책", "민족의 대응 및 독립운동"], "rows": [["1910년대", "무단 통치: 헌병 경찰제, 즉결 처분권, 조선태형령, 칼 찬 교원", "토지조사사업(기한부 신고제 ➔ 미신고 토지 수탈), 회사령(허가제)", "국내 비밀결사(독립의군부, 대한광복회), 3·1 운동(1919)"], ["1920년대", "문화 통치 (민족 분열책): 보통 경찰제, 조선·동아일보 창간 허용, 치안유지법(1925)", "산미증식계획(증산량 < 수탈량, 소작농 전락), 회사령 폐지(신고제)", "실력양성(물산장려, 밀립대학), 6·10만세, 광주학생, 신간회 결성(1927), 봉오동·청산리 대첩"], ["1930~40년대", "민족 말살 통치: 황국신민서사 암송, 신사참배 강요, 창씨개명, 조선어학회 사건(1942)", "병참기지화, 국가총동원법(1938) ➔ 징용, 징병, 위안부, 식량배급·공출제", "한중 연합 작전(한국독립군, 조선혁명군), 한인애국단(이봉창·윤봉길), 한국광복군 창설(1940)"]]}, {"title": "무장 독립 투쟁의 3대 핵심 조직과 활약", "headers": ["단체명", "결성 연도 및 중심 인물", "행동 강령 / 성격", "주요 활동 및 격전"], "rows": [["의열단", "1919년 만주 길림 (김원봉)", "신채호의 <조선혁명선언> (민중의 직접 폭력 혁명 표방)", "김익상(조선총독부), 김상옥(종로경찰서), 나석주(동양척식주식회사·식산은행) 폭탄 투척"], ["한인애국단", "1931년 상하이 (김구)", "임시정부 침체 타개를 위한 의열 투쟁 조직", "이봉창(도쿄 일왕 마차 폭탄 투척) ➔ 윤봉길(상하이 훙커우 공원 전승기념식 폭탄 투척, 장제스 지원 계기)"], ["한국광복군", "1940년 충칭 (지청천 총사령관)", "대한민국 임시정부의 정규 국군", "대일 선전포고(1941), 인도·미얀마 전선 영국군 연합 심리전, 미국 OSS 합작 국내 진공 작전 추진"]]}], "killer_records": [{"title": "사료 1: 신채호의 조선혁명선언 (의열단 선언 1923년)", "text": "강도 일본이 우리의 국호를 없이 하며 정권을 빼앗았으니... 우리는 선언하노라. 민중은 우리 혁명의 대본영이다. 폭력은 우리 혁명의 유일한 무기이다. 우리는 민중 속에 들어가 민중과 손을 잡고 끊임없는 폭력 - 암살, 파괴, 폭동으로써 강도 일본의 통치를 타도하고..."}, {"title": "사료 2: 신간회 창립 강령 (1927년)", "text": "1. 우리는 정치적·경제적 각성을 촉진한다.\n2. 우리는 단결을 공고히 한다.\n3. 우리는 기회주의를 일체 부인한다."}], "mnemonics": ["💡 1930년대 초 만주 한중연합군: [한·호·지 - 쌍사대] (한국독립군+중국호로군+지청천 = 쌍성보·사도하자·대전자령) / [조·의·양 - 영흥] (조선혁명군+중국의용군+양세봉 = 영릉가·흥경성)", "💡 신간회 핵심 요약: [정우회 선언 계기 / 비타협적 민족주의 + 사회주의 연대 / 회장 이상재 / 광주학생항일운동 진상조사단 파견]"]}, "questions": [{"id": "q8_1", "question": "1910년대 일제의 식민 통치 방식과 경제 수탈에 대한 설명으로 옳은 것은?", "passage": "일제는 1910년 국권을 강탈한 뒤 조선총독부를 설치하고 무력으로 한국인을 억압하는 무단 통치를 실시하였다.", "options": ["① 헌병 경찰제를 실시하고 한국인에게만 적용되는 조선태형령을 공포하였다.", "② 보통 경찰제로 전환하고 조선일보와 동아일보의 발행을 허가하였다.", "③ 산미 증식 계획을 추진하여 일본으로 막대한 쌀을 반출하였다.", "④ 국가 총동원법을 제정하여 징용과 징병, 식량 공출제를 강행하였다.", "⑤ 치안 유지법을 제정하여 사회주의자들과 독립운동가들을 탄압하였다."], "answer": 1, "explanation": {"summary": "1910년대 무단 통치: 헌병 경찰제(즉결처분권), 조선태형령(1912), 칼 찬 교원, 토지조사사업, 회사령(허가제).", "choices": ["① 정답: 헌병이 일반 경찰 업무까지 맡아 즉결 처분권을 행사했고, 1912년 조선태형령으로 한국인에게만 태형을 가했습니다.", "② 오답: 보통 경찰제와 조선·동아일보 창간 허용은 1920년대 문화 통치입니다.", "③ 오답: 산미 증식 계획은 1920년대입니다.", "④ 오답: 국가 총동원법(1938년)과 징용·징병은 1930~40년대 민족 말살 통치기입니다.", "⑤ 오답: 치안 유지법(1925년)은 1920년대 문화 통치기입니다."]}}, {"id": "q8_2", "question": "1920년대 일제가 시행한 '산미 증식 계획'의 결과로 옳은 것은?", "passage": "일제는 제1차 세계 대전 이후 급속한 공업화로 일본 국내의 쌀이 부족해지자 한국에서 쌀 생산량을 늘려 일본으로 가져가려 하였다.", "options": ["① 쌀 증산량보다 일본으로 반출된 수탈량이 훨씬 많아 한국인 1인당 쌀 소비량이 급감하였다.", "② 기한부 신고제를 통해 미신고 토지와 문중 토지를 총독부가 몰수하였다.", "③ 북부 지방에 중화학 공업을 육성하고 남면북양 정책을 강제하였다.", "④ 회사령을 허가제로 제정하여 민족 자본의 기업 설립을 원천 봉쇄하였다.", "⑤ 전쟁 물자 조달을 위해 놋그릇과 수저 등 쇠붙이를 강제로 공출하였다."], "answer": 1, "explanation": {"summary": "1920년대 산미 증식 계획으로 수리 조합비 등이 농민에게 전가되었고, 증산량 이상으로 쌀을 일본에 빼앗겨 만주산 잡곡(조·콩깻묵)을 수입해 연명해야 했습니다.", "choices": ["① 정답: 쌀 수탈량이 증산량을 크게 웃돌아 한국 농민들은 심각한 식량난과 소작농 전락을 겪었습니다.", "② 오답: 기한부 신고제는 1910년대 토지조사사업입니다.", "③ 오답: 병참기지화·남면북양 정책은 1930년대입니다.", "④ 오답: 1920년대에는 회사령을 '폐지(신고제 전환)'하여 일본 대기업의 진출을 도왔습니다.", "⑤ 오답: 금속류 공출은 1930~40년대 전시 총동원 체제입니다."]}}, {"id": "q8_3", "question": "1930년대 후반~1940년대 일제의 민족 말살 통치 시기에 있었던 사실로 옳은 것은?", "passage": "중일 전쟁(1937)과 태평양 전쟁(1941)을 일으킨 일제는 '내선일체'를 내세우며 한국인의 민족 정체성을 완전히 없애려 하였다.", "options": ["① 황국신민서사 암송, 신사참배, 창씨개명을 강요하고 조선어학회 사건을 일으켰다.", "② 조선총독부에 처음으로 문관 출신 총독을 임명하여 유화책을 펼쳤다.", "③ 3·1 운동의 영향으로 헌병 경찰제를 보통 경찰제로 전환하였다.", "④ 토지조사령을 공포하여 동양척식주식회사의 토지 소유를 확대하였다.", "⑤ 경성제국대학을 설립하여 한국인의 밀립대학 설립 운동을 무마하였다."], "answer": 1, "explanation": {"summary": "1930~40년대 민족 말살 통치: 황국신민서사, 신사참배, 창씨개명, 조선어학회 사건(1942), 국가총동원법(1938), 징용·징병·위안부.", "choices": ["① 정답: 우리말과 역사 교육 금지, 창씨개명 강요, 1942년 조선어학회 사건(한글학자 탄압) 등이 자행되었습니다.", "② 오답: 일제강점기 내내 문관 총독이 실제로 임명된 적은 단 한 번도 없습니다.", "③ 오답: 보통 경찰제 전환은 1920년대 문화 통치입니다.", "④ 오답: 토지조사사업은 1910년대입니다.", "⑤ 오답: 경성제국대학 설립은 1924년(1920년대)입니다."]}}, {"id": "q8_4", "question": "1919년 일어난 3·1 운동의 배경과 역사적 의의로 옳지 않은 것은?", "passage": "민족 대표 33인은 태화관에서 독립 선언서를 낭독하였고, 수많은 학생과 시민들은 탑골 공원에 모여 대한 독립 만세를 외치며 전국으로 시위를 확산시켰다.", "options": ["① 미국 윌슨 대통령의 민족 자결주의와 도쿄 유학생들의 2·8 독립 선언이 영향을 주었다.", "② 고종의 갑작스러운 서거와 독살설이 국민적 분노의 도화선이 되었다.", "③ 일제의 식민 통치 방식이 무단 통치에서 이른바 문화 통치로 바뀌는 계기가 되었다.", "④ 독립운동을 체계적으로 이끌 대한민국 임시정부가 수립되는 직접적 원동력이 되었다.", "⑤ 이 운동의 결과로 미국과 영국이 즉각 한국을 독립 국가로 공식 승인하였다."], "answer": 5, "explanation": {"summary": "3·1 운동은 일제의 통치 방식 변경, 대한민국 임시정부 수립, 중국 5·4 운동 등 아시아 반제국주의 운동에 큰 영향을 주었습니다.", "choices": ["① 옳음: 민족자결주의와 2·8 독립선언이 직접적 배경입니다.", "② 옳음: 고종의 인산일(3월 3일)을 기해 거족적 시위가 계획되었습니다.", "③ 옳음: 무단 통치의 한계를 느낀 일제가 기만적인 문화 통치로 전환했습니다.", "④ 옳음: 1919년 4월 상하이에서 대한민국 임시정부가 수립되었습니다.", "⑤ 정답(옳지 않음): 윌슨의 민족자결주의는 패전국 식민지에만 적용되어 승전국인 일본의 식민지 한국은 열강의 승인을 받지 못했습니다."]}}, {"id": "q8_5", "question": "1919년 상하이에서 수립된 대한민국 임시정부의 초기 활동으로 옳은 것은?", "passage": "국내외의 여러 임시정부를 통합하여 출범한 대한민국 임시정부는 삼권분립에 기초한 우리나라 최초의 민주 공화제 정부였다.", "options": ["① 국내와의 비밀 연락망인 연통제와 정보 수집 기구인 교통국을 운영하였다.", "② 초대 대통령에 김구, 국무총리에 지청천이 선출되었다.", "③ 충칭으로 이동한 직후 파리 강화 회의에 김규식을 파견하였다.", "④ 1923년 국민대표회의에서 개조파와 창조파가 완벽히 합의하여 조직이 강화되었다.", "⑤ 설립 직후인 1919년에 조소앙의 삼균주의에 입각한 건국 강령을 발표하였다."], "answer": 1, "explanation": {"summary": "초기 임시정부는 연통제·교통국 운영, 독립공채 발행, <독립신문> 간행, 구미위원부 설치 및 파리 강화 회의 김규식 파견을 전개했습니다.", "choices": ["① 정답: 연통제(비밀 행정망)와 교통국(통신·자금 조달, 이륭양행 등)을 통해 국내와 긴밀히 연락했습니다.", "② 오답: 초대 대통령은 이승만, 국무총리는 이동휘였습니다.", "③ 오답: 파리 강화 회의 김규식 파견은 1919년 상하이 시기이며, 충칭 정착은 1940년입니다.", "④ 오답: 1923년 국민대표회의는 개조파(안창호)와 창조파(신채호)의 대립으로 결국 결렬되었습니다.", "⑤ 오답: 조소앙의 삼균주의 건국 강령 발표는 1941년 충칭 시기입니다."]}}, {"id": "q8_6", "question": "1920년대 국내에서 전개된 실력 양성 운동에 대한 설명으로 옳은 것은?", "passage": "(가) '내 살림 내 것으로', '조선 사람 조선 것'이라는 구호를 내걸고 토산품 애용과 근검저축을 장려하였다.\n(나) '한민족 1천만이 한 사람이 1원씩' 모금하여 한국인을 위한 고등 교육 기관을 세우고자 하였다.", "options": ["① (가)는 조만식 등이 평양에서 시작한 물산장려운동이다.", "② (가)는 사회주의 진영의 전폭적인 지지를 받으며 전국으로 확산되었다.", "③ (나)는 서재필의 주도로 추진되어 연희전문학교 설립으로 결실을 맺었다.", "④ (나)의 결과 일제는 조선 교육령을 폐지하고 한국인 대학 설립을 공식 허가하였다.", "⑤ (가)와 (나)는 모두 1907년 대구에서 시작된 국채보상운동의 일환이었다."], "answer": 1, "explanation": {"summary": "(가)는 물산장려운동(평양 조만식 시작), (나)는 민립대학 설립 운동(이상재 중심 ➔ 일제의 방해 및 1924년 경성제국대학 설립으로 좌절)입니다.", "choices": ["① 정답: 1920년 평양에서 조만식 등이 조선물산장려회를 조직해 국산품 애용 운동을 벌였습니다.", "② 오답: 사회주의 진영은 물산장려운동이 자본가(부르주아)의 이익만 대변하고 물가 상승을 부추긴다며 비판했습니다.", "③ 오답: 민립대학 설립 운동은 이상재 등이 주도했습니다.", "④ 오답: 일제는 민립대학 설립을 방해하고 무마하기 위해 관립인 '경성제국대학(1924)'을 세웠습니다.", "⑤ 오답: 국채보상운동은 1907년 대한제국 시기입니다."]}}, {"id": "q8_7", "question": "1920년대 일어난 두 학생 독립운동 (가), (나)에 대한 설명으로 옳은 것은?", "passage": "(가) 1926년 순종의 인산일(장례식)을 기해 학생들이 주도하여 만세 시위를 벌였다.\n(나) 1929년 나주역 통학 열차에서 일본인 남학생이 한국인 여학생을 희롱한 사건을 계기로 대규모 시위가 전국으로 번졌다.", "options": ["① (가)는 6·10 만세 운동으로 민족주의와 사회주의 세력이 연대하는 계기가 되었다.", "② (가)의 진상을 규명하기 위해 신간회가 진상 조사단을 파견하였다.", "③ (나)는 3·1 운동 직후 대한민국 임시정부 수립의 직접적 계기가 되었다.", "④ (나)는 6·10 만세 운동보다 앞서 일어난 최초의 학생 만세 시위이다.", "⑤ (가)와 (나)는 모두 일제의 조선태형령 폐지를 이끌어내었다."], "answer": 1, "explanation": {"summary": "(가)는 1926년 6·10 만세 운동(신간회 결성 밑거름), (나)는 1929년 광주 학생 항일 운동(신간회 진상조사단 파견, 3·1운동 이후 최대 규모 민족운동)입니다.", "choices": ["① 정답: 6·10 만세 운동 준비 과정에서 민족주의와 사회주의 진영이 공감대를 형성하여 이듬해 신간회 창립의 밑거름이 되었습니다.", "② 오답: 신간회 진상조사단 파견은 (나) 1929년 광주 학생 항일 운동입니다.", "③ 오답: 임시정부 수립 계기는 1919년 3·1 운동입니다.", "④ 오답: (가) 1926년이 (나) 1929년보다 앞섭니다.", "⑤ 오답: 조선태형령은 1920년 3·1운동 직후 폐지되었습니다."]}}, {"id": "q8_8", "question": "다음 강령을 내걸고 결성된 민족 운동 단체에 대한 설명으로 옳은 것은?", "passage": "1. 우리는 정치적, 경제적 각성을 촉진한다.\n2. 우리는 단결을 공고히 한다.\n3. 우리는 기회주의를 일체 부인한다.\n• 배경: 사회주의 진영의 정우회 선언을 계기로 비타협적 민족주의자와 사회주의자가 연합하였다.", "options": ["① 김원봉을 중심으로 만주 길림에서 결성되어 파괴와 암살 활동을 펼쳤다.", "② 이상재를 회장으로 선출하고 광주 학생 항일 운동에 진상 조사단을 파견하였다.", "③ 물산장려운동을 주도하며 '내 살림 내 것으로'라는 구호를 내걸었다.", "④ 파리 강화 회의에 김규식을 파견하여 독립 청원서를 제출하였다.", "⑤ 자치론을 주장하며 일제와 타협하여 참정권을 얻고자 하였다."], "answer": 2, "explanation": {"summary": "정우회 선언 계기, '기회주의 일체 부인' 강령을 내세운 좌우 합작 민족유일당 단체는 '신간회(1927~1931)'입니다.", "choices": ["① 오답: 의열단입니다.", "② 정답: 신간회는 이상재를 초대 회장으로 추대하고 전국 140여 개 지회를 두었으며 광주 학생 항일 운동을 적극 지원했습니다.", "③ 오답: 조선물산장려회입니다.", "④ 오답: 신한청년당 및 임시정부입니다.", "⑤ 오답: 신간회는 일제와 타협하려는 자치론자(기회주의자)를 철저히 배격했습니다."]}}, {"id": "q8_9", "question": "1920년대 만주 지역에서 전개된 무장 독립 전쟁의 흐름을 순서대로 옳게 나열한 것은?", "passage": "(가) 홍범도의 대한독립군 등 연합 부대가 봉오동 골짜기에서 일본군을 대파하였다.\n(나) 김좌진의 북로군정서와 홍범도 부대가 청산리 일대에서 일본군에 대승을 거두었다.\n(다) 일제의 만주 군벌 장쭤린과의 밀약(미쓰야 협정)으로 독립군 활동이 큰 시련을 겪었다.\n(라) 자유시 참변의 시련을 딛고 만주에 참의부, 정의부, 신민부의 3부가 성립하였다.", "options": ["① (가) - (나) - (라) - (다)", "② (가) - (라) - (나) - (다)", "③ (나) - (가) - (라) - (다)", "④ (가) - (나) - (다) - (라)", "⑤ (라) - (가) - (나) - (다)"], "answer": 1, "explanation": {"summary": "봉오동 전투(1920.6) ➔ 청산리 대첩(1920.10) ➔ 간도 참변 ➔ 자유시 참변(1921) ➔ 3부 성립(1923~25) ➔ 미쓰야 협정(1925.6) 순입니다.", "choices": ["① 정답: (가) 봉오동 ➔ (나) 청산리 ➔ (라) 3부 성립 ➔ (다) 미쓰야 협정 순서가 정확합니다.", "② 오답: 3부 성립은 청산리 대첩·자유시 참변 이후입니다.", "③ 오답: 봉오동 전투가 청산리 대첩보다 앞섭니다.", "④ 오답: 3부가 성립된 뒤 1925년에 미쓰야 협정이 체결되었습니다.", "⑤ 오답: 순서가 틀립니다."]}}, {"id": "q8_10", "question": "1930년대 초 만주에서 전개된 한·중 연합 작전에 대한 설명으로 옳은 것은?", "passage": "1931년 일제가 만주 사변을 일으켜 만주국을 세우자, 한국 독립군과 중국 항일 부대는 공동의 적인 일본에 맞서 연합 작전을 펼쳤다.", "options": ["① 지청천이 이끈 한국독립군은 중국 호로군과 연합하여 쌍성보·사도하자·대전자령 전투에서 승리하였다.", "② 양세봉이 이끈 조선혁명군은 중국 호로군과 연합하여 봉오동 전투에서 대승을 거두었다.", "③ 김원봉이 창설한 조선의용대는 만주에서 일본군을 격파하고 영릉가 전투를 승리로 이끌었다.", "④ 한국광복군은 만주에서 중국 의용군과 합작하여 청산리 대첩을 치렀다.", "⑤ 동북항일연군은 충칭 대한민국 임시정부의 직속 정규군으로 편성되었다."], "answer": 1, "explanation": {"summary": "암기 공식: [한·호·지 ➔ 쌍사대](한국독립군+중국호로군+지청천 = 쌍성보·사도하자·대전자령) / [조·의·양 ➔ 영흥](조선혁명군+중국의용군+양세봉 = 영릉가·흥경성).", "choices": ["① 정답: 북만주에서 지청천의 한국독립군과 중국 호로군이 연합해 쌍성보·사도하자·대전자령 전투에서 대승을 거두었습니다.", "② 오답: 양세봉의 조선혁명군은 '중국 의용군'과 연합해 남만주에서 '영릉가·흥경성 전투'를 승리로 이끌었습니다.", "③ 오답: 조선의용대(1938)는 중국 관내(한커우)에서 창설된 최초의 한인 무장 부대입니다.", "④ 오답: 청산리 대첩은 1920년이며 한국광복군은 1940년 충칭에서 창설되었습니다.", "⑤ 오답: 임시정부 정규군은 한국광복군입니다."]}}, {"id": "q8_11", "question": "다음 두 의열 투쟁 단체 (가), (나)에 대한 설명으로 옳은 것은?", "passage": "(가) 1919년 만주 길림에서 김원봉이 조직하였으며, 신채호가 작성한 <조선혁명선언>을 행동 지침으로 삼았다.\n(나) 1931년 침체에 빠진 대한민국 임시정부에 활력을 불어넣기 위해 김구가 상하이에서 조직하였다.", "options": ["① (가)의 단원 나석주는 동양척식주식회사와 조선식산은행에 폭탄을 투척하였다.", "② (가)의 단원 윤봉길은 상하이 훙커우 공원에서 일본군 수뇌부를 처단하였다.", "③ (나)의 단원 김익상은 조선총독부에 폭탄을 투척하였다.", "④ (나)의 단원 김상옥은 종로경찰서에 폭탄을 던지고 일본 경찰과 시가전을 벌였다.", "⑤ (나)의 의거 이후 중국 국민당 정부는 대한민국 임시정부에 대한 지원을 전면 중단하였다."], "answer": 1, "explanation": {"summary": "(가)는 의열단(김원봉: 김익상·김상옥·나석주), (나)는 한인애국단(김구: 이봉창·윤봉길 ➔ 장제스 임시정부 전폭 지원 계기)입니다.", "choices": ["① 정답: 의열단원 나석주(1926)는 식민지 경제 수탈의 본산인 동양척식주식회사와 식산은행에 폭탄을 투척했습니다.", "② 오답: 윤봉길 의거(1932)는 (나) 한인애국단입니다.", "③ 오답: 김익상(조선총독부 폭탄 투척)은 (가) 의열단입니다.", "④ 오답: 김상옥(종로경찰서 폭탄 투척)은 (가) 의열단입니다.", "⑤ 오답: 윤봉길의 훙커우 공원 의거에 감동한 중국 장제스 국민당 정부는 임시정부를 적극 지원하기 시작했습니다."]}}, {"id": "q8_12", "question": "대한민국 임시정부의 정규 군대인 (가) 군대에 대한 설명으로 옳은 것은?", "passage": "(가) 은/는 1940년 9월 중국 충칭에서 창설되었다. 지청천이 총사령관에 취임하였고, 이후 김원봉이 이끄는 조선의용대의 일부 병력이 합류하였다. 태평양 전쟁 발발 후 일제에 선전포고를 하였으며, 영국군과 연합하여 인도·미얀마 전선에서 활약하였다.", "options": ["① 봉오동 전투에서 일본군 월강추격대를 대파하였다.", "② 북로군정서군과 연합하여 청산리 대첩에서 큰 승리를 거두었다.", "③ 미국 전략정보국(OSS)과 합작하여 국내 진공 작전을 계획하였다.", "④ 중국 호로군과 연합하여 쌍성보와 대전자령 전투를 승리로 이끌었다.", "⑤ 참의부, 정의부, 신민부의 3부를 통합하여 조직되었다."], "answer": 3, "explanation": {"summary": "1940년 충칭에서 창설된 대한민국 임시정부 정규군은 '한국광복군'입니다.", "choices": ["① 오답: 봉오동 전투는 홍범도의 대한독립군 등입니다.", "② 오답: 청산리 대첩은 김좌진·홍범도 연합 부대입니다.", "③ 정답: 한국광복군은 미국 OSS와 합작하여 특수 훈련을 받고 국내 진공 작전(독수리 작전)을 준비하던 중 8·15 광복을 맞았습니다.", "④ 오답: 쌍성보·대전자령 전투는 지청천의 한국독립군(1930년대 초)입니다.", "⑤ 오답: 3부 통합은 국민부·혁신의회입니다."]}}]}, {"id": "era9", "name": "9. 현대사", "tag": "출제 4~5문항", "period": "1945년 광복 ~ 2000년대 (남북 화해)", "summary": "모스크바 3상 회의, 5·10 총선과 대한민국 정부 수립, 농지개혁법과 반민특위, 6·25 전쟁, 4·19 혁명, 박정희 정부(유신체제), 5·18과 6월 민주항쟁, 그리고 역대 정부의 3대 남북 합의(7·4, 기본합의서, 6·15)를 총정리합니다.", "theory": {"tables": [{"title": "광복 후 대한민국 정부 수립 6단계 타임라인", "headers": ["단계", "시기", "핵심 사건", "결정 사항 및 역사적 전개"], "rows": [["1단계", "1945.12", "모스크바 3국 외상 회의", "한국 임시 민주정부 수립, 미·소 공동위원회 설치, 최고 5년간 4개국 신탁통치 결정 ➔ 우익 반탁 vs 좌익 찬탁 대립"], ["2단계", "1946.06", "이승만의 정읍 발언", "남한만이라도 단독 정부를 수립해야 한다고 주장 ➔ 민족 분단 위기 고조"], ["3단계", "1946.07", "좌우 합작 위원회", "김규식(중도우), 여운형(중도좌) 주도, 좌우 합작 7원칙 발표 (토지 유상매수·체감매상·무상분배)"], ["4단계", "1947~48", "UN 소총회 결의 & 남북협상", "선거 가능한 남한만의 단독 총선거 결의 ➔ 김구의 <삼천만 동포에게 읍고함>, 남북 연석회의(김구·김규식 평양 방문)"], ["5단계", "1948.05.10", "5·10 총선거 (제헌국회)", "우리나라 최초의 보통·평등·직접·비밀선거, 제헌 국회의원 선출 (임기 2년), 헌법 제정(대통령 이승만)"], ["6단계", "1948.08.15", "대한민국 정부 수립 선포", "삼권분립에 기초한 민주공화국 출범 (UN 총회에서 한반도 유일 합법 정부 승인)"]]}, {"title": "역대 정부의 3대 핵심 통일 선언 비교 (킬러 1순위)", "headers": ["합의 문서명", "발표 연도 / 정부", "핵심 원칙 및 합의 내용", "설치 기구 및 역사적 의의"], "rows": [["7·4 남북 공동 성명", "1972년 (박정희 정부)", "자주, 평화, 민족 대단결의 통일 3대 원칙 천명", "남북조절위원회 설치 (이후 10월 유신헌법 등 권력 강화에 악용)"], ["남북 기본 합의서", "1991년 (노태우 정부)", "상호 체제 인정 및 존중, 상호 불가침, 교류 협력 확대, 잠정적 특수 관계 규정", "남북한 UN 동시 가입(1991.9) 직후 채택, 한반도 비핵화 공동 선언 발표"], ["6·15 남북 공동 선언", "2000년 (김대중 정부)", "남측의 연합제 안과 북측의 낮은 단계의 연방제 안의 공통성 인정", "분단 후 최초의 남북 정상회담, 개성공단 착공, 경의선 철도 복원, 이산가족 상봉"]]}], "killer_records": [{"title": "사료 1: 7·4 남북 공동 성명 (1972년)", "text": "첫째, 통일은 외세에 의존하거나 외세의 간섭을 받음이 없이 자주적으로 해결하여야 한다.\n둘째, 통일은 서로 상대방을 반대하는 무력 행사에 의거하지 않고 평화적 방법으로 실현하여야 한다.\n셋째, 사상과 이념, 제도의 차이를 초월하여 우선 하나의 민족으로서 민족적 대단결을 도모하여야 한다."}, {"title": "사료 2: 남북 기본 합의서 (1991년 노태우 정부)", "text": "남과 북은 서로 상대방의 체제를 인정하고 존중한다... 남과 북은 상대방을 파괴·전복하려는 일체의 행위를 하지 아니한다... 쌍방 사이의 관계가 나라와 나라 사이의 관계가 아닌 통일을 지향하는 과정에서 잠정적으로 형성되는 특수 관계임을 인정하고..."}], "mnemonics": ["💡 3대 통일선언 매칭: [7·4 성명(박정희 - 자주·평화·민족대단결)] ➔ [기본합의서(노태우 - 체제인정·불가침)] ➔ [6·15 선언(김대중 - 연합제·낮은연방제)]", "💡 민주화 항쟁 순서: [4·19 혁명(1960, 이승만 하야)] ➔ [5·18 민주화운동(1980, 광주 시민군)] ➔ [6월 민주항쟁(1987, 5년 단임 직선제 개헌)]"]}, "questions": [{"id": "q9_1", "question": "1945년 12월 개최된 모스크바 3국 외상 회의의 결정 사항과 국내 반응으로 옳은 것은?", "passage": "광복 직후 미국·영국·소련 3국 외무장관이 모스크바에 모여 한반도 문제 해결 방안을 논의하였다.", "options": ["① 한국 임시 민주 정부 수립, 미·소 공동위원회 설치, 최고 5년간의 신탁통치 실시를 결정하였다.", "② 남한만의 단독 총선거를 실시하여 제헌 국회를 구성하기로 결의하였다.", "③ 우익 진영은 총체적 지지를 선언하며 찬탁 운동을, 좌익 진영은 반탁 운동을 벌였다.", "④ 김구와 이승만은 신탁통치를 수용하고 미·소 공동위원회에 적극 참여하였다.", "⑤ 회의 결과 여운형의 조선건국준비위원회가 한반도 유일의 합법 정부로 승인되었다."], "answer": 1, "explanation": {"summary": "모스크바 3국 외상 회의 결정 3가지: ① 임시 민주 정부 수립, ② 미·소 공동위원회 설치, ③ 최고 5년 4개국 신탁통치. 국내에서는 우익 반탁 vs 좌익 찬탁으로 극심하게 대립했습니다.", "choices": ["① 정답: 3가지 결정 사항이 정확합니다.", "② 오답: 남한만의 단독 총선거 결의는 1948년 2월 UN 소총회입니다.", "③ 오답: 반대로 우익은 반탁, 좌익은 총체적 지지(찬탁)로 돌아섰습니다.", "④ 오답: 김구와 이승만 등 우익은 격렬한 반탁 운동을 전개했습니다.", "⑤ 오답: 미군정은 건국준비위원회(조선인민공화국)를 인정하지 않았습니다."]}}, {"id": "q9_2", "question": "1948년 대한민국 정부 수립 과정에서 일어난 다음 사건들을 순서대로 옳게 나열한 것은?", "passage": "(가) UN 소총회가 선거 가능한 지역(남한)만의 단독 총선거 실시를 결의하였다.\n(나) 이승만이 정읍에서 남한만의 단독 정부 수립 필요성을 시사하는 발언을 하였다.\n(다) 김구와 김규식이 분단을 막기 위해 평양을 방문하여 남북 협상을 추진하였다.\n(라) 5·10 총선거를 통해 제헌 국회가 구성되고 8월 15일 대한민국 정부가 수립되었다.", "options": ["① (나) - (가) - (다) - (라)", "② (가) - (나) - (다) - (라)", "③ (나) - (다) - (가) - (라)", "④ (다) - (나) - (가) - (라)", "⑤ (나) - (가) - (라) - (다)"], "answer": 1, "explanation": {"summary": "정읍 발언(1946.6) ➔ 좌우합작 ➔ UN 소총회 단독선거 결의(1948.2) ➔ 김구·김규식 남북협상(1948.4) ➔ 5·10 총선거(1948.5) ➔ 정부 수립(1948.8.15).", "choices": ["① 정답: (나) 1946.6 ➔ (가) 1948.2 ➔ (다) 1948.4 ➔ (라) 1948.5~8 순서가 정확합니다.", "② 오답: 정읍 발언이 UN 소총회 결의보다 2년 앞섭니다.", "③ 오답: UN 소총회의 단독 선거 결의에 반대해 남북 협상이 추진되었습니다.", "④ 오답: 순서가 맞지 않습니다.", "⑤ 오답: 남북 협상은 5·10 총선거 직전(4월)에 이루어졌습니다."]}}, {"id": "q9_3", "question": "제헌 국회가 제정한 '반민족행위 처벌법'과 '농지개혁법'에 대한 설명으로 옳은 것은?", "passage": "대한민국 정부 수립 직후 제헌 국회는 식민지 잔재 청산과 토지 제도 개혁이라는 역사적 과제를 해결하고자 두 핵심 법률을 제정하였다.", "options": ["① 농지개혁법은 유상 매수, 유상 분배 원칙으로 1가구당 토지 소유 상한을 3정보로 제한하였다.", "② 농지개혁법은 무상 몰수, 무상 분배 방식으로 시행되어 지주들에게 보상이 전혀 없었다.", "③ 반민특위는 이승만 정부의 적극적인 지원 속에 친일파 청산을 완벽히 마무리하였다.", "④ 반민특위는 6·25 전쟁이 끝난 직후인 1954년에야 처음으로 활동을 개시하였다.", "⑤ 농지개혁법은 임야와 과수원까지 모두 포함하여 국가가 전면 국유화하였다."], "answer": 1, "explanation": {"summary": "대한민국 농지개혁법(1949년 제정, 1950년 시행)은 유상 매수·유상 분배(3정보 상한, 지가증권 발급)로 경자유전 원칙을 실현했고, 반민특위는 이승만 정부의 비협조와 특경대 습격·공소시효 단축으로 좌절되었습니다.", "choices": ["① 정답: 유상 매수·유상 분배와 3정보 상한을 통해 지주·소작제가 해체되고 자영농이 육성되었습니다.", "② 오답: 무상 몰수·무상 분배는 1946년 북한의 토지 개혁입니다.", "③ 오답: 이승만 정부의 비협조, 국회 프락치 사건, 친일 경찰의 반민특위 습격 등으로 친일 청산이 좌절되었습니다.", "④ 오답: 반민특위는 1948~1949년에 활동했습니다.", "⑤ 오답: 농지(논·밭)만 대상이었고 임야·과수원은 제외되어 지주들이 사학 재단이나 기업가로 전환할 수 있었습니다."]}}, {"id": "q9_4", "question": "6·25 전쟁(1950~1953)의 전개 과정을 시간순으로 옳게 나열한 것은?", "passage": "(가) 맥아더가 지휘하는 국군과 UN군이 인천 상륙 작전에 성공하고 서울을 수복하였다.\n(나) 중국군의 대규모 개입으로 국군과 UN군이 1·4 후퇴를 단행하였다.\n(다) 북한의 전면 남침으로 낙동강 방어선까지 밀려나며 임시 수도가 부산으로 옮겨졌다.\n(라) 반공 포로 석방 이후 휴전 협정이 체결되고 한·미 상호 방위 조약이 맺어졌다.", "options": ["① (다) - (가) - (나) - (라)", "② (다) - (나) - (가) - (라)", "③ (가) - (다) - (나) - (라)", "④ (다) - (가) - (라) - (나)", "⑤ (가) - (나) - (다) - (라)"], "answer": 1, "explanation": {"summary": "남침·낙동강 방어선(1950.6~8) ➔ 인천 상륙 작전·서울 수복·압록강 진격(1950.9~10) ➔ 중국군 개입·흥남철수·1·4 후퇴(1950.11~1951.1) ➔ 휴전 협정(1953.7) ➔ 한미상호방위조약(1953.10).", "choices": ["① 정답: (다) ➔ (가) ➔ (나) ➔ (라) 순서가 정확합니다.", "② 오답: 인천 상륙 작전 후 북진하자 중국군이 개입했습니다.", "③ 오답: 낙동강 방어선 후퇴가 인천 상륙 작전보다 먼저입니다.", "④ 오답: 휴전 협정이 가장 마지막입니다.", "⑤ 오답: 순서가 틀립니다."]}}, {"id": "q9_5", "question": "1960년 4·19 혁명의 배경과 결과에 대한 설명으로 옳은 것은?", "passage": "이승만 정권은 발췌 개헌(1952)과 사사오입 개헌(1954)을 통해 장기 집권을 꾀하였고, 1960년 정·부통령 선거에서 대규모 부정 선거를 자행하였다.", "options": ["① 3·15 부정 선거에 항거한 마산 의거와 김주열 열사 시신 발견이 결정적 도화선이 되었다.", "② 4·19 혁명의 결과로 대통령 직선제와 단원제 국회를 규정한 개헌이 이루어졌다.", "③ 혁명 직후 박정희가 이끄는 공화당 정부가 즉각 출범하였다.", "④ 4·19 혁명은 전두환 신군부의 비상계엄 확대에 맞서 일어난 민주화 운동이다.", "⑤ 이승만 대통령은 하야하지 않고 비상계엄을 선포하여 4선 연임에 성공하였다."], "answer": 1, "explanation": {"summary": "3·15 부정선거 ➔ 마산 의거(김주열 열사) ➔ 4·19 혁명 ➔ 교수단 시위 ➔ 이승만 하야 ➔ 허정 과도정부 ➔ 제3차 개헌(의원내각제·양원제) ➔ 장면 내각 출범.", "choices": ["① 정답: 마산 앞바다에서 최루탄이 눈에 박힌 김주열 열사의 시신이 발견되면서 전국적 4·19 혁명으로 폭발했습니다.", "② 오답: 4·19 직후 제3차 개헌은 '의원내각제'와 '양원제 국회'를 채택했습니다.", "③ 오답: 4·19 직후에는 윤보선 대통령·장면 국무총리의 제2공화국(장면 내각)이 출범했습니다.", "④ 오답: 신군부 비상계엄 확대 항거는 1980년 5·18 민주화운동입니다.", "⑤ 오답: 이승만 대통령은 4월 26일 하야 성명을 발표하고 하와이로 망명했습니다."]}}, {"id": "q9_6", "question": "박정희 정부 초기(1960년대)에 있었던 주요 사건 및 대외 정책으로 옳지 않은 것은?", "passage": "1961년 5·16 군사 정변으로 정권을 장악한 박정희 세력은 국가재건최고회의를 거쳐 1963년 제3공화국을 출범시켰다.", "options": ["① 경제 개발 자금을 확보하기 위해 국민의 반대(6·3 시위)를 무릅쓰고 한·일 기본 조약을 체결하였다.", "② 미국의 요청에 따라 베트남 전쟁에 국군을 파병하고 브라운 각서를 통해 경제·군사 원조를 받았다.", "③ 제1·2차 경제 개발 5개년 계획을 추진하며 경부 고속 국도를 건설하였다.", "④ 1969년 대통령의 3회 연임을 허용하는 3선 개헌을 강행하였다.", "⑤ 1965년 통일주체국민회의에서 대통령을 간접 선출하는 10월 유신 헌법을 공포하였다."], "answer": 5, "explanation": {"summary": "10월 유신 헌법 선포는 1965년이 아니라 '1972년 10월'입니다.", "choices": ["① 옳음: 1964년 6·3 시위에도 불구하고 1965년 한·일 기본 조약을 체결했습니다.", "② 옳음: 베트남 파병(1964~1973)과 브라운 각서(1966)입니다.", "③ 옳음: 수출 주도형 공업화와 경부고속도로(1970년 개통) 건설입니다.", "④ 옳음: 1969년 3선 개헌으로 박정희의 3선을 가능하게 했습니다.", "⑤ 정답(옳지 않음): 10월 유신 선포는 1972년입니다."]}}, {"id": "q9_7", "question": "1972년 선포된 유신 헌법(제7차 개헌)의 내용과 유신 체제의 종말에 대한 설명으로 옳은 것은?", "passage": "박정희 정부는 7·4 남북 공동 성명 직후인 1972년 10월 비상계엄을 선포하고 국회를 해산한 뒤 유신 헌법을 제정하였다.", "options": ["① 통일주체국민회의에서 대통령을 간접 선출하고 임기 제한을 철폐하여 종신 집권을 가능하게 하였다.", "② 대통령이 국회의원 정원의 1/3을 추천하는 권한이 폐지되어 입법부 권한이 강화되었다.", "③ 대통령의 긴급 조치권이 삭제되고 국민의 기본권이 대폭 확대되었다.", "④ 1979년 6월 민주항쟁으로 유신 체제가 붕괴하고 직선제 개헌이 이루어졌다.", "⑤ 유신 체제는 전태일 분신 사건을 계기로 1970년에 선포되었다."], "answer": 1, "explanation": {"summary": "유신 헌법: 통일주체국민회의 간선제(6년, 중임 제한 없음), 국회의원 1/3 추천(유정회), 국회 해산권, 긴급조치권. 이후 YH 무역 사건 ➔ 부·마 민주항쟁 ➔ 10·26 사태(1979)로 종말.", "choices": ["① 정답: 유신 헌법은 삼권분립을 무너뜨리고 대통령의 종신 집권과 초헌법적 권한을 제도화했습니다.", "② 오답: 대통령이 국회의원 1/3을 추천(유신정우회)하여 입법부를 장악했습니다.", "③ 오답: 헌법 효력까지 정지할 수 있는 '긴급 조치권'이 신설되어 인권이 탄압받았습니다.", "④ 오답: 유신 체제는 1979년 부·마 민주항쟁과 10·26 사태로 끝났습니다. (6월 민주항쟁은 1987년)", "⑤ 오답: 전태일 열사 분신은 1970년이며 유신 선포는 1972년입니다."]}}, {"id": "q9_8", "question": "1980년 5·18 민주화운동에 대한 설명으로 옳은 것은?", "passage": "10·26 사태 이후 12·12 군사 반란으로 군권을 장악한 전두환 등 신군부 세력이 1980년 5월 17일 비상계엄을 전국으로 확대하자, 광주 시민들이 민주화를 요구하며 봉기하였다.", "options": ["① 계엄군의 무자비한 진압에 맞서 광주 시민들이 시민군을 조직하고 전남도청을 중심으로 항전하였다.", "② 이 운동의 결과로 전두환 대통령이 즉각 사임하고 대통령 직선제가 복원되었다.", "③ 3·15 부정 선거 무효를 외치며 마산에서 처음 시작되었다.", "④ 관련 기록물은 역사적 가치를 인정받지 못해 유네스코 등재에서 탈락하였다.", "⑤ 노태우의 6·29 민주화 선언을 직접적으로 이끌어낸 사건이다."], "answer": 1, "explanation": {"summary": "5·18 민주화운동은 신군부 계엄 확대에 맞서 광주 시민군을 조직해 항전한 사건으로, 관련 기록물은 2011년 유네스코 세계기록유산에 등재되었습니다.", "choices": ["① 정답: 계엄군의 발포에 맞서 시민군을 결성하고 끝까지 민주주의를 지키기 위해 항쟁했습니다.", "② 오답: 신군부는 무력으로 진압한 뒤 국보위를 거쳐 전두환이 제11·12대 대통령에 취임했습니다.", "③ 오답: 3·15 부정선거 항거는 1960년 4·19 혁명입니다.", "④ 오답: 5·18 민주화운동 기록물은 2011년 유네스코 세계기록유산으로 공식 등재되었습니다.", "⑤ 오답: 6·29 선언을 이끌어낸 것은 1987년 6월 민주항쟁입니다."]}}, {"id": "q9_9", "question": "다음 성명이 발표된 계기가 된 민주화 운동에 대한 설명으로 옳은 것은?", "passage": "• 구호: '호헌 철폐, 독재 타도!', '직선제로 개헌하라!'\n• 계기: 박종철 고문치사 사건 은폐 의혹, 전두환의 4·13 호헌 조치, 이한열 열사의 최루탄 피격 사망\n• 결과: 노태우가 5년 단임 대통령 직선제를 수용하는 '6·29 민주화 선언'을 발표하였다.", "options": ["① 3·15 부정선거에 항거하여 일어났으며 이승만 대통령의 하야를 이끌어냈다.", "② 신군부의 비상계엄 확대에 맞서 광주에서 시민군을 결성하여 항전하였다.", "③ 한·일 국교 정상화 추진에 반대하여 일어난 6·3 시위이다.", "④ 1987년 6월 민주항쟁으로 현행 5년 단임 대통령 직선제 개헌(제9차 개헌)을 이끌어냈다.", "⑤ 유신 체제 종말의 직접적 계기가 된 부·마 민주항쟁이다."], "answer": 4, "explanation": {"summary": "호헌 철폐·독재 타도를 외치며 6·29 선언과 현행 헌법(5년 단임 직선제)을 쟁취한 사건은 1987년 '6월 민주항쟁'입니다.", "choices": ["① 오답: 1960년 4·19 혁명입니다.", "② 오답: 1980년 5·18 민주화운동입니다.", "③ 오답: 1964년 6·3 시위입니다.", "④ 정답: 6월 민주항쟁의 승리로 여야 합의 하에 제9차 개헌(5년 단임 직선제)이 이루어졌습니다.", "⑤ 오답: 1979년 부·마 민주항쟁입니다."]}}, {"id": "q9_10", "question": "다음 남북 합의문에 대한 설명으로 옳은 것은?", "passage": "첫째, 통일은 외세에 의존하거나 외세의 간섭을 받음이 없이 자주적으로 해결하여야 한다.\n둘째, 통일은 서로 상대방을 반대하는 무력 행사에 의거하지 않고 평화적 방법으로 실현하여야 한다.\n셋째, 사상과 이념, 제도의 차이를 초월하여 우선 하나의 민족으로서 민족적 대단결을 도모하여야 한다.", "options": ["① 박정희 정부 시기인 1972년 발표된 7·4 남북 공동 성명이다.", "② 노태우 정부 시기인 1991년 채택된 남북 기본 합의서이다.", "③ 김대중 정부 시기인 2000년 발표된 6·15 남북 공동 선언이다.", "④ 노무현 정부 시기인 2007년 발표된 10·4 남북 공동 선언이다.", "⑤ 이 성명 발표 직후 개성공단이 착공되고 경의선 철도가 연결되었다."], "answer": 1, "explanation": {"summary": "자주·평화·민족 대단결의 통일 3대 원칙을 최초로 합의한 문서는 1972년 박정희 정부의 '7·4 남북 공동 성명'입니다.", "choices": ["① 정답: 분단 이후 남북 당국이 처음으로 통일 3대 원칙에 합의하고 남북조절위원회를 설치했습니다.", "② 오답: 남북 기본 합의서(1991)는 상호 체제 인정 및 불가침입니다.", "③ 오답: 6·15 공동 선언(2000)은 연합제와 낮은 단계의 연방제 공통성 인정입니다.", "④ 오답: 10·4 공동 선언(2007)은 서해 평화협력특별지대 설치입니다.", "⑤ 오답: 개성공단과 경의선 복원은 2000년 6·15 선언 이후입니다."]}}, {"id": "q9_11", "question": "다음 남북 합의서가 채택된 정부 시기의 통일 노력 및 대외 정책으로 옳은 것은?", "passage": "• 합의서 명칭: 남북 사이의 화해와 불가침 및 교류·협력에 관한 합의서\n• 핵심 내용: 남과 북은 서로 상대방의 체제를 인정하고 존중하며, 상대방을 파괴·전복하려는 일체의 행위를 하지 않는다. 쌍방 사이의 관계는 잠정적 특수 관계임을 인정한다.", "options": ["① 최초로 남북 정상회담을 개최하고 6·15 남북 공동 선언을 발표하였다.", "② 7·4 남북 공동 성명을 발표하고 남북조절위원회를 설치하였다.", "③ 남북한이 UN에 동시 가입하고 한반도 비핵화 공동 선언을 채택하였다.", "④ 금강산 육로 관광을 시작하고 개성공단 사업을 착공하였다.", "⑤ 10·4 남북 공동 선언을 통해 서해 평화협력특별지대 설치를 합의하였다."], "answer": 3, "explanation": {"summary": "1991년 12월 노태우 정부 시기에 채택된 '남북 기본 합의서'입니다.", "choices": ["① 오답: 2000년 김대중 정부입니다.", "② 오답: 1972년 박정희 정부입니다.", "③ 정답: 노태우 정부는 북방 외교(소련·중국 수교), 남북한 UN 동시 가입(1991.9), 남북 기본 합의서 및 한반도 비핵화 공동 선언(1991.12)을 이끌어냈습니다.", "④ 오답: 김대중~노무현 정부입니다.", "⑤ 오답: 2007년 노무현 정부입니다."]}}, {"id": "q9_12", "question": "문민정부(김영삼) 이후 역대 정부의 주요 정책과 업적을 옳게 연결한 것은?", "passage": "1993년 32년 만의 문민정부가 출범한 이후 한국은 민주주의의 공고화와 경제 위기 극복, 남북 화해 협력의 길을 걸었다.", "options": ["① 김영삼 정부 - 금융실명제 전면 실시, 지방자치제 전면 시행, OECD 가입", "② 김대중 정부 - 남북한 UN 동시 가입, 소련·중국과 국교 수립", "③ 노무현 정부 - 분단 이후 최초의 남북 정상회담 개최 및 6·15 공동 선언 발표", "④ 김영삼 정부 - 외환 위기(IMF) 구제 금융을 조기 상환하여 위기를 완전히 졸업함", "⑤ 김대중 정부 - 공직자 재산 공개 및 하나회 해체를 처음으로 단행함"], "answer": 1, "explanation": {"summary": "김영삼 정부(금융실명제, 하나회 해체, 지방자치제 전면 실시, 역사 바로 세우기, OECD 가입, 1997 IMF 발생) / 김대중 정부(IMF 조기 극복, 햇볕정책, 최초 남북정상회담·6·15 선언) / 노무현 정부(제2차 남북정상회담·10·4 선언).", "choices": ["① 정답: 김영삼 정부는 1993년 금융실명제를 전격 단행하고 1995년 지방자치제 전면 시행, 1996년 OECD 가입을 이루었습니다.", "② 오답: UN 동시 가입과 북방 외교(소·중 수교)는 노태우 정부입니다.", "③ 오답: 최초 남북 정상회담과 6·15 선언은 2000년 김대중 정부입니다.", "④ 오답: IMF 조기 상환(2001년)은 금 모으기 운동 등과 함께 김대중 정부에서 달성했습니다.", "⑤ 오답: 하나회 해체와 공직자 재산 공개는 김영삼 정부입니다."]}}]}];

    // State Variables
    let currentEraIndex = 0;
    let activeTab = 'theory';
    let enteredPin = '';
    const CORRECT_PIN = '1353';
    let fontSizes = ['sm', 'base', 'lg', 'xl'];
    let currentFontIndex = 1; // 'base' is default

    // User Quiz Answers State: { qId: selectedOptionIndex }
    let userAnswers = {};
    // Saved Wrong Notes: Array of question IDs
    let savedWrongIds = JSON.parse(localStorage.getItem('korean_history_wrong_ids') || '[]');

    // ------------------------------------------
    // Init on Load
    // ------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      checkAuth();
      renderEraPills();
      loadEra(0);
      renderWrongNotes();

      // Listen for keyboard PIN input
      window.addEventListener('keydown', (e) => {
        const authOverlay = document.getElementById('authOverlay');
        if (authOverlay && !authOverlay.classList.contains('hidden')) {
          if (e.key >= '0' && e.key <= '9') {
            inputPin(e.key);
          } else if (e.key === 'Backspace') {
            backspacePin();
          } else if (e.key === 'Escape') {
            clearPin();
          }
        }
      });
    });

    // ------------------------------------------
    // 1. PIN Security Authentication (1353)
    // ------------------------------------------
    function checkAuth() {
      const savedAuth = localStorage.getItem('korean_history_auth');
      if (savedAuth === CORRECT_PIN) {
        unlockApp();
      }
    }

    function inputPin(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        updatePinDots();
        if (enteredPin.length === 4) {
          setTimeout(verifyPin, 150);
        }
      }
    }

    function backspacePin() {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDots();
        hideAuthError();
      }
    }

    function clearPin() {
      enteredPin = '';
      updatePinDots();
      hideAuthError();
    }

    function updatePinDots() {
      const dots = document.querySelectorAll('.pin-dot');
      dots.forEach((dot, idx) => {
        if (idx < enteredPin.length) {
          dot.classList.add('bg-indigo-600', 'dark:bg-indigo-400', 'border-indigo-600', 'scale-110');
          dot.classList.remove('bg-transparent');
        } else {
          dot.classList.remove('bg-indigo-600', 'dark:bg-indigo-400', 'border-indigo-600', 'scale-110');
          dot.classList.add('bg-transparent');
        }
      });
    }

    function verifyPin() {
      if (enteredPin === CORRECT_PIN) {
        localStorage.setItem('korean_history_auth', CORRECT_PIN);
        unlockApp();
      } else {
        showAuthError();
        const card = document.getElementById('authCard');
        card.classList.add('shake');
        setTimeout(() => {
          card.classList.remove('shake');
          clearPin();
        }, 400);
      }
    }

    function showAuthError() {
      const msg = document.getElementById('authErrorMsg');
      msg.textContent = '비밀번호가 일치하지 않습니다 (힌트: 1353)';
      msg.classList.remove('opacity-0');
    }

    function hideAuthError() {
      const msg = document.getElementById('authErrorMsg');
      msg.classList.add('opacity-0');
    }

    function unlockApp() {
      const overlay = document.getElementById('authOverlay');
      overlay.classList.add('opacity-0', 'pointer-events-none', 'transition-opacity', 'duration-300');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    function lockApp() {
      localStorage.removeItem('korean_history_auth');
      clearPin();
      const overlay = document.getElementById('authOverlay');
      overlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
    }

    // ------------------------------------------
    // 2. Era Navigation & Rendering
    // ------------------------------------------
    function renderEraPills() {
      const container = document.getElementById('eraPillsContainer');
      container.innerHTML = erasData.map((era, index) => {
        const isCurrent = index === currentEraIndex;
        return `
          <button onclick="loadEra(${index})" id="eraPill-${index}" class="px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-bold transition whitespace-nowrap ${
            isCurrent
              ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
              : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'
          }">
            ${era.name}
          </button>
        `;
      }).join('');
    }

    function loadEra(index) {
      currentEraIndex = index;
      renderEraPills();
      const era = erasData[index];

      // Update Banner
      document.getElementById('bannerTag').textContent = era.tag;
      document.getElementById('bannerPeriod').textContent = era.period;
      document.getElementById('bannerTitle').textContent = era.name;
      document.getElementById('bannerSummary').textContent = era.summary;

      // Update Mnemonics
      const mnemonicsContainer = document.getElementById('mnemonicsList');
      mnemonicsContainer.innerHTML = era.theory.mnemonics.map(m => `
        <div class="p-2.5 rounded-xl bg-white/70 dark:bg-slate-900/60 border border-amber-200 dark:border-amber-900/40">${m}</div>
      `).join('');

      // Update Tables
      const tablesContainer = document.getElementById('tablesContainer');
      tablesContainer.innerHTML = era.theory.tables.map(tbl => `
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
          <h4 class="text-base sm:text-lg font-black text-slate-900 dark:text-white mb-3 flex items-center gap-2">
            <i data-lucide="table" class="w-4 h-4 text-indigo-500"></i>
            <span>${tbl.title}</span>
          </h4>
          <div class="overflow-x-auto -mx-4 sm:mx-0">
            <table class="w-full text-left border-collapse min-w-[580px]">
              <thead>
                <tr class="bg-slate-100 dark:bg-slate-800/80 text-xs sm:text-sm text-slate-700 dark:text-slate-300">
                  ${tbl.headers.map(h => `<th class="p-3 border-b border-slate-200 dark:border-slate-700 font-extrabold">${h}</th>`).join('')}
                </tr>
              </thead>
              <tbody class="text-xs sm:text-sm divide-y divide-slate-100 dark:divide-slate-800">
                ${tbl.rows.map(row => `
                  <tr class="hover:bg-indigo-50/40 dark:hover:bg-slate-800/50 transition">
                    ${row.map((cell, cIdx) => `
                      <td class="p-3 font-${cIdx === 0 ? 'bold text-indigo-900 dark:text-indigo-300 whitespace-nowrap' : 'normal text-slate-700 dark:text-slate-300'}">${cell}</td>
                    `).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `).join('');

      // Update Records (사료 원문)
      const recordsContainer = document.getElementById('recordsContainer');
      recordsContainer.innerHTML = era.theory.killer_records.map(rec => `
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center gap-2 text-indigo-600 dark:text-indigo-400 font-bold text-sm mb-2">
              <i data-lucide="scroll" class="w-4 h-4"></i>
              <span>${rec.title}</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 font-serif leading-relaxed bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800">
              "${rec.text}"
            </p>
          </div>
        </div>
      `).join('');

      // Update Questions (5지선다)
      renderQuestions(era.questions);

      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ------------------------------------------
    // 3. 5-Choice Multiple Choice Questions Rendering
    // ------------------------------------------
    function renderQuestions(questions) {
      const container = document.getElementById('questionsContainer');
      const totalAll = erasData.reduce((acc, e) => acc + e.questions.length, 0);
      document.getElementById('quizCounter').textContent = `이 시대 ${questions.length}문항 (전체 ${totalAll}문항)`;

      const jumpBar = document.getElementById('questionJumpBar');
      if (jumpBar) {
        jumpBar.innerHTML = `<span class="text-xs font-bold text-slate-400 self-center mr-1">빠른 이동:</span>` + questions.map((q, idx) => `
          <button onclick="document.getElementById('card-${q.id}').scrollIntoView({ behavior: 'smooth', block: 'start' })" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-indigo-600 hover:text-white text-xs font-bold text-slate-700 dark:text-slate-300 transition border border-slate-200 dark:border-slate-700">${idx + 1}</button>
        `).join('');
      }

      container.innerHTML = questions.map((q, qIndex) => {
        const isSaved = savedWrongIds.includes(q.id);
        const selected = userAnswers[q.id];
        return `
          <div id="card-${q.id}" class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-7 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
            <!-- Header: Number & Bookmark -->
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-xl bg-indigo-600 text-white font-black text-sm flex items-center justify-center">${qIndex + 1}</span>
                <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/60 px-2.5 py-1 rounded-full border border-indigo-200 dark:border-indigo-900">한능검 실전 5지선다</span>
              </div>
              <button onclick="toggleSaveWrong('${q.id}')" class="text-xs font-bold flex items-center gap-1.5 px-3 py-1.5 rounded-xl border transition ${
                isSaved
                  ? 'bg-rose-50 dark:bg-rose-950/60 text-rose-600 border-rose-300 dark:border-rose-800'
                  : 'bg-slate-50 dark:bg-slate-800 text-slate-500 border-slate-200 dark:border-slate-700'
              }">
                <i data-lucide="bookmark" class="w-4 h-4 ${isSaved ? 'fill-rose-500 text-rose-500' : ''}"></i>
                <span>${isSaved ? '오답노트 저장됨' : '오답노트 담기'}</span>
              </button>
            </div>

            <!-- Question Text -->
            <h4 class="text-base sm:text-lg font-black text-slate-900 dark:text-white leading-snug">
              ${q.question}
            </h4>

            <!-- Passage Box (자료/사료) -->
            ${q.passage ? `
              <div class="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/80 text-xs sm:text-sm text-slate-800 dark:text-slate-200 leading-relaxed font-serif whitespace-pre-line">
                ${q.passage}
              </div>
            ` : ''}

            <!-- 5 Options (1 to 5) -->
            <div class="space-y-2.5 pt-2">
              ${q.options.map((opt, optIdx) => {
                const optNum = optIdx + 1;
                const isSelected = selected === optNum;
                return `
                  <button onclick="selectOption('${q.id}', ${optNum})" id="optBtn-${q.id}-${optNum}" class="option-btn w-full text-left p-3.5 sm:p-4 rounded-2xl border text-xs sm:text-sm font-semibold transition flex items-start gap-3 ${
                    isSelected
                      ? 'bg-indigo-50 dark:bg-indigo-950/50 border-indigo-500 text-indigo-900 dark:text-indigo-200 shadow-sm'
                      : 'bg-white dark:bg-slate-800/40 border-slate-200 dark:border-slate-700/80 text-slate-700 dark:text-slate-300 hover:border-slate-300 dark:hover:border-slate-600'
                  }">
                    <span class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold flex items-center justify-center shrink-0 text-xs">${optNum}</span>
                    <span class="flex-1 pt-0.5 leading-relaxed">${opt.replace(/^[①②③④⑤]\s*/, '')}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Submit Check Button -->
            <div class="pt-2">
              <button onclick="submitAnswer('${q.id}')" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm sm:text-base transition shadow-md shadow-indigo-600/20 flex items-center justify-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4"></i>
                <span>정답 확인 및 상세 해설 보기</span>
              </button>
            </div>

            <!-- Detailed Explanation Box (Hidden initially) -->
            <div id="expBox-${q.id}" class="hidden mt-4 pt-4 border-t border-slate-200 dark:border-slate-800 space-y-4">
              <!-- Result Banner -->
              <div id="resultBanner-${q.id}" class="p-3.5 rounded-2xl text-sm font-bold flex items-center gap-2"></div>

              <!-- Summary Reason -->
              <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/60 p-3.5 rounded-2xl">
                <div class="text-xs font-black text-amber-800 dark:text-amber-300 uppercase tracking-wider mb-1">💡 정답 해설 및 핵심 요약</div>
                <div class="text-xs sm:text-sm text-amber-900 dark:text-amber-100 leading-relaxed">${q.explanation.summary}</div>
              </div>

              <!-- 5 Choices 1:1 Breakdown -->
              <div class="space-y-2">
                <div class="text-xs font-black text-slate-500 uppercase tracking-wider">선지별 1:1 정밀 감별</div>
                ${q.explanation.choices.map(c => `
                  <div class="p-2.5 rounded-xl text-xs sm:text-sm ${
                    c.includes('정답')
                      ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 border border-emerald-200 dark:border-emerald-800 font-medium'
                      : 'bg-slate-50 dark:bg-slate-800/40 text-slate-600 dark:text-slate-400 border border-slate-100 dark:border-slate-800'
                  }">
                    ${c}
                  </div>
                `).join('')}
              </div>
            </div>

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function selectOption(qId, optNum) {
      userAnswers[qId] = optNum;
      // Re-highlight options
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`optBtn-${qId}-${i}`);
        if (btn) {
          if (i === optNum) {
            btn.className = 'option-btn w-full text-left p-3.5 sm:p-4 rounded-2xl border text-xs sm:text-sm font-semibold transition flex items-start gap-3 bg-indigo-50 dark:bg-indigo-950/50 border-indigo-500 text-indigo-900 dark:text-indigo-200 shadow-sm';
          } else {
            btn.className = 'option-btn w-full text-left p-3.5 sm:p-4 rounded-2xl border text-xs sm:text-sm font-semibold transition flex items-start gap-3 bg-white dark:bg-slate-800/40 border-slate-200 dark:border-slate-700/80 text-slate-700 dark:text-slate-300 hover:border-slate-300 dark:hover:border-slate-600';
          }
        }
      }
    }

    function submitAnswer(qId) {
      const selected = userAnswers[qId];
      if (!selected) {
        alert('먼저 1번부터 5번 보기 중 하나를 선택해 주세요!');
        return;
      }

      // Find question
      let targetQ = null;
      erasData.forEach(era => {
        const found = era.questions.find(q => q.id === qId);
        if (found) targetQ = found;
      });

      if (!targetQ) return;

      const isCorrect = selected === targetQ.answer;
      const expBox = document.getElementById(`expBox-${qId}`);
      const banner = document.getElementById(`resultBanner-${qId}`);

      expBox.classList.remove('hidden');

      if (isCorrect) {
        banner.className = 'p-3.5 rounded-2xl text-sm font-bold flex items-center gap-2 bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-200 border border-emerald-300 dark:border-emerald-800';
        banner.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5 text-emerald-600"></i><span>정답입니다! 완벽하게 마스터하셨습니다. (정답: ${targetQ.answer}번)</span>`;
      } else {
        banner.className = 'p-3.5 rounded-2xl text-sm font-bold flex items-center gap-2 bg-rose-100 dark:bg-rose-950/60 text-rose-800 dark:text-rose-200 border border-rose-300 dark:border-rose-800';
        banner.innerHTML = `<i data-lucide="x-circle" class="w-5 h-5 text-rose-600"></i><span>아쉽게 틀렸습니다. (선택: ${selected}번 / 정답: ${targetQ.answer}번)</span>`;
        // Automatically add to wrong notes
        if (!savedWrongIds.includes(qId)) {
          savedWrongIds.push(qId);
          localStorage.setItem('korean_history_wrong_ids', JSON.stringify(savedWrongIds));
          renderWrongNotes();
        }
      }
      lucide.createIcons();
    }

    // ------------------------------------------
    // 4. Tab Switching
    // ------------------------------------------
    function switchTab(tab) {
      activeTab = tab;
      const tabs = ['theory', 'quiz', 'notes'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tabBtn-${t}`);
        const sec = document.getElementById(`section-${t}`);
        if (t === tab) {
          btn.className = 'tab-btn pb-3 px-3 sm:px-5 font-black text-sm sm:text-base border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 flex items-center gap-2 transition';
          sec.classList.remove('hidden');
        } else {
          btn.className = 'tab-btn pb-3 px-3 sm:px-5 font-bold text-sm sm:text-base border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-2 transition';
          sec.classList.add('hidden');
        }
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ------------------------------------------
    // 5. Wrong Notes & Search
    // ------------------------------------------
    function toggleSaveWrong(qId) {
      if (savedWrongIds.includes(qId)) {
        savedWrongIds = savedWrongIds.filter(id => id !== qId);
      } else {
        savedWrongIds.push(qId);
      }
      localStorage.setItem('korean_history_wrong_ids', JSON.stringify(savedWrongIds));
      // Re-render
      loadEra(currentEraIndex);
      renderWrongNotes();
    }

    function renderWrongNotes() {
      const container = document.getElementById('wrongNotesContainer');
      if (savedWrongIds.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-sm">
            <i data-lucide="bookmark" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
            저장된 오답 문제가 없습니다. 문제 풀이 중 헷갈리는 문제를 오답노트에 담아보세요!
          </div>
        `;
        lucide.createIcons();
        return;
      }

      let html = '';
      erasData.forEach(era => {
        era.questions.forEach(q => {
          if (savedWrongIds.includes(q.id)) {
            html += `
              <div class="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">[${era.name}]</span>
                  <button onclick="toggleSaveWrong('${q.id}')" class="text-xs text-rose-500 hover:underline">삭제</button>
                </div>
                <div class="text-sm font-bold text-slate-800 dark:text-slate-200">${q.question}</div>
                <div class="text-xs text-emerald-600 dark:text-emerald-400 font-bold">정답: ${q.answer}번</div>
                <div class="text-xs text-slate-500 dark:text-slate-400">${q.explanation.summary}</div>
              </div>
            `;
          }
        });
      });
      container.innerHTML = html;
      lucide.createIcons();
    }

    function clearAllWrongNotes() {
      if (confirm('모든 오답노트를 비우시겠습니까?')) {
        savedWrongIds = [];
        localStorage.removeItem('korean_history_wrong_ids');
        renderWrongNotes();
        loadEra(currentEraIndex);
      }
    }

    function handleGlobalSearch() {
      const query = document.getElementById('globalSearchInput').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('searchResultsList');
      const countSpan = document.getElementById('searchResultsCount');

      if (!query) {
        resultsDiv.innerHTML = '';
        countSpan.textContent = '검색어를 입력하면 전체 9개 시대의 이론과 문제를 즉시 찾아냅니다.';
        return;
      }

      let matchedTheories = [];
      let matchedQuestions = [];

      erasData.forEach((era, eIdx) => {
        // Search in summary & tables
        era.theory.tables.forEach(tbl => {
          tbl.rows.forEach(row => {
            if (row.some(cell => cell.toLowerCase().includes(query))) {
              matchedTheories.push({ era: era.name, eIdx, topic: tbl.title, snippet: row.join(' | ') });
            }
          });
        });
        // Search in questions
        era.questions.forEach(q => {
          if (q.question.toLowerCase().includes(query) || (q.passage && q.passage.toLowerCase().includes(query)) || q.options.some(o => o.toLowerCase().includes(query))) {
            matchedQuestions.push({ era: era.name, eIdx, question: q });
          }
        });
      });

      countSpan.textContent = `검색 결과: 이론 ${matchedTheories.length}건, 문제 ${matchedQuestions.length}건 발견`;

      let html = '';
      if (matchedTheories.length > 0) {
        html += `<h4 class="text-sm font-black text-indigo-600 dark:text-indigo-400 mt-4 mb-2">관련 이론 내용 (${matchedTheories.length}건)</h4>`;
        html += matchedTheories.map(t => `
          <div onclick="loadEra(${t.eIdx}); switchTab('theory');" class="cursor-pointer p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-indigo-500 transition text-xs sm:text-sm">
            <div class="font-bold text-slate-800 dark:text-slate-200">[${t.era}] ${t.topic}</div>
            <div class="text-slate-500 dark:text-slate-400 mt-1">${t.snippet}</div>
          </div>
        `).join('');
      }

      if (matchedQuestions.length > 0) {
        html += `<h4 class="text-sm font-black text-indigo-600 dark:text-indigo-400 mt-4 mb-2">관련 기출 문제 (${matchedQuestions.length}건)</h4>`;
        html += matchedQuestions.map(mq => `
          <div onclick="loadEra(${mq.eIdx}); switchTab('quiz');" class="cursor-pointer p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-indigo-500 transition text-xs sm:text-sm">
            <div class="font-bold text-indigo-600 dark:text-indigo-400">[${mq.era}]</div>
            <div class="text-slate-800 dark:text-slate-200 mt-1">${mq.question.question}</div>
          </div>
        `).join('');
      }

      resultsDiv.innerHTML = html;
    }

    // ------------------------------------------
    // 6. Font Scaler (Samsung Galaxy Support)
    // ------------------------------------------
    function changeFontSize(direction) {
      const body = document.body;
      const label = document.getElementById('fontScaleLabel');
      body.classList.remove(`font-scale-${fontSizes[currentFontIndex]}`);

      if (direction === 'up' && currentFontIndex < fontSizes.length - 1) {
        currentFontIndex++;
      } else if (direction === 'down' && currentFontIndex > 0) {
        currentFontIndex--;
      }

      body.classList.add(`font-scale-${fontSizes[currentFontIndex]}`);

      const labels = ['축소', '기본', '확대', '특대'];
      label.textContent = labels[currentFontIndex];
    }

    // ------------------------------------------
    // 7. Dark Mode Toggle
    // ------------------------------------------
    function toggleDarkMode() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('korean_history_theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('korean_history_theme', 'dark');
      }
    }

    // Initialize theme from preference
    if (localStorage.getItem('korean_history_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</body>
</html>
