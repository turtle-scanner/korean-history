<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>한국사능력검정시험 심화 올인원 마스터</title>
  <!-- Google Fonts: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif'],
            serif: ['Nanum Myeongjo', 'serif']
          },
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#4f46e5',
              600: '#4338ca',
              700: '#3730a3',
              800: '#312e81',
              900: '#1e1b4b'
            },
            history: {
              amber: '#d97706',
              gold: '#b45309',
              dark: '#0f172a'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Mobile-first readability for Samsung Galaxy & Android */
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    .font-scale-sm { font-size: 15px; }
    .font-scale-base { font-size: 17px; }
    .font-scale-lg { font-size: 19px; }
    .font-scale-xl { font-size: 21px; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: #a5b4fc;
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }

    /* Passcode Keypad Button Animation */
    .key-btn:active {
      transform: scale(0.92);
    }
    
    /* Shake animation for wrong password */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    /* Pulse animation */
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .pulse-soft {
      animation: pulse-soft 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-scale-base transition-colors duration-200">

  <!-- ========================================== -->
  <!-- 1. 보안 암호 잠금 화면 (PIN GATE: 1353) -->
  <!-- ========================================== -->
  <div id="authOverlay" class="fixed inset-0 z-50 bg-slate-900/95 backdrop-blur-md flex items-center justify-center p-4">
    <div id="authCard" class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-indigo-100 dark:border-slate-800 p-6 sm:p-8 max-w-sm w-full text-center relative overflow-hidden">
      <!-- Decor Top Bar -->
      <div class="h-2 w-full bg-gradient-to-r from-amber-500 via-indigo-600 to-purple-600 absolute top-0 left-0"></div>
      
      <!-- Lock Icon -->
      <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
        <i data-lucide="shield-check" class="w-9 h-9"></i>
      </div>
      
      <h2 class="text-xl sm:text-2xl font-black text-slate-800 dark:text-white tracking-tight">한국사능력검정시험 마스터</h2>
      <p class="text-sm sm:text-base text-slate-500 dark:text-slate-400 mt-1 mb-4">접속 암호 <span class="font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/40 px-2 py-0.5 rounded-md">4자리</span>를 눌러주세요</p>

      <!-- PIN Display Dots -->
      <div id="pinDots" class="flex justify-center items-center gap-4 my-4 py-2">
        <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 dark:border-slate-600 bg-transparent transition-all"></div>
        <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 dark:border-slate-600 bg-transparent transition-all"></div>
        <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 dark:border-slate-600 bg-transparent transition-all"></div>
        <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 dark:border-slate-600 bg-transparent transition-all"></div>
      </div>

      <!-- Error Message -->
      <div id="authErrorMsg" class="h-6 text-sm font-semibold text-rose-500 dark:text-rose-400 opacity-0 transition-opacity">암호가 일치하지 않습니다.</div>

      <!-- Numeric Touch Keypad (Samsung Galaxy optimized) -->
      <div class="grid grid-cols-3 gap-2.5 sm:gap-3 mt-3 max-w-[280px] mx-auto">
        <button onclick="inputPin('1')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">1</button>
        <button onclick="inputPin('2')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">2</button>
        <button onclick="inputPin('3')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">3</button>
        
        <button onclick="inputPin('4')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">4</button>
        <button onclick="inputPin('5')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">5</button>
        <button onclick="inputPin('6')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">6</button>
        
        <button onclick="inputPin('7')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">7</button>
        <button onclick="inputPin('8')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">8</button>
        <button onclick="inputPin('9')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">9</button>
        
        <button onclick="clearPin()" class="key-btn h-14 sm:h-16 rounded-2xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-900/60 text-sm font-bold text-rose-600 dark:text-rose-400 transition shadow-sm border border-rose-200 dark:border-rose-900/50 flex items-center justify-center">전체삭제</button>
        <button onclick="inputPin('0')" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-2xl font-bold text-slate-800 dark:text-white transition shadow-sm border border-slate-200 dark:border-slate-700/60 active:scale-95">0</button>
        <button onclick="backspacePin()" class="key-btn h-14 sm:h-16 rounded-2xl bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 transition shadow-sm border border-slate-300 dark:border-slate-600 flex items-center justify-center">
          <i data-lucide="delete" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Quick Hint -->
      <div class="mt-4 text-xs text-slate-400 dark:text-slate-500">
        키보드로 1353을 직접 입력하셔도 됩니다
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. 상단 고정 네비게이션 헤더 -->
  <!-- ========================================== -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
    <div class="max-w-6xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-2">
      <!-- Title & Emblem -->
      <div class="flex items-center gap-2 sm:gap-3 cursor-pointer" onclick="switchTab('theory')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-indigo-600 text-white flex items-center justify-center font-black shadow-md shadow-indigo-500/20">
          <span class="text-lg">史</span>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black text-slate-900 dark:text-white leading-tight flex items-center gap-1.5">
            한능검 심화 마스터
            <span class="text-[11px] font-bold text-amber-700 dark:text-amber-400 bg-amber-100 dark:bg-amber-950/60 px-1.5 py-0.5 rounded border border-amber-300 dark:border-amber-800 hidden sm:inline-block">기출 108문항</span>
          </h1>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">이론 ➔ 5지선다 문제풀이 ➔ 상세해설</p>
        </div>
      </div>

      <!-- Top Tools: Font Resizer, Dark Mode, Lock -->
      <div class="flex items-center gap-1 sm:gap-2">
        <!-- Font Size Scaler (Samsung Galaxy Reading Support) -->
        <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-lg p-0.5 border border-slate-200 dark:border-slate-700">
          <button onclick="changeFontSize('down')" title="글자 축소" class="px-2 py-1 text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-indigo-600">가-</button>
          <span id="fontScaleLabel" class="text-xs font-bold text-indigo-600 dark:text-indigo-400 px-1">기본</span>
          <button onclick="changeFontSize('up')" title="글자 확대" class="px-2 py-1 text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-indigo-600">가+</button>
        </div>

        <!-- Dark Mode Toggle -->
        <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-amber-500 flex items-center justify-center transition border border-slate-200 dark:border-slate-700" title="다크/라이트 모드">
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
        </button>

        <!-- Lock Button -->
        <button onclick="lockApp()" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-rose-500 flex items-center justify-center transition border border-slate-200 dark:border-slate-700" title="화면 잠금">
          <i data-lucide="lock" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Era Selection Horizontal Scroller -->
    <div class="bg-slate-100/80 dark:bg-slate-900/80 border-t border-slate-200 dark:border-slate-800 px-2 sm:px-6 py-2 overflow-x-auto no-scrollbar">
      <div id="eraPillsContainer" class="flex gap-2 min-w-max">
        <!-- Rendered by JS -->
      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- 3. 메인 콘텐츠 컨테이너 -->
  <!-- ========================================== -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-6 pb-24">

    <!-- Active Era Banner -->
    <div id="eraBanner" class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 text-white rounded-2xl p-4 sm:p-6 mb-6 shadow-md relative overflow-hidden">
      <div class="relative z-10">
        <div class="flex items-center gap-2 mb-1.5">
          <span id="bannerTag" class="text-xs font-extrabold bg-amber-500 text-slate-950 px-2 py-0.5 rounded-full"></span>
          <span id="bannerPeriod" class="text-xs text-indigo-200 font-medium"></span>
        </div>
        <h2 id="bannerTitle" class="text-xl sm:text-2xl font-black tracking-tight"></h2>
        <p id="bannerSummary" class="text-sm sm:text-base text-indigo-100/90 mt-2 leading-relaxed max-w-3xl"></p>
      </div>
      <!-- Background pattern -->
      <div class="absolute -right-8 -bottom-8 text-white/5 font-serif text-9xl select-none pointer-events-none">韓國史</div>
    </div>

    <!-- Mode Selector Navigation Tabs (1. 이론, 2. 5지선다 문제풀이, 3. 오답노트 & 검색) -->
    <div class="flex border-b border-slate-200 dark:border-slate-800 mb-6 gap-2">
      <button onclick="switchTab('theory')" id="tabBtn-theory" class="tab-btn pb-3 px-3 sm:px-5 font-black text-sm sm:text-base border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 flex items-center gap-2 transition">
        <i data-lucide="book-open" class="w-4 h-4"></i>
        <span>1단계: 핵심 이론 마스터</span>
      </button>
      <button onclick="switchTab('quiz')" id="tabBtn-quiz" class="tab-btn pb-3 px-3 sm:px-5 font-bold text-sm sm:text-base border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-2 transition">
        <i data-lucide="check-square" class="w-4 h-4"></i>
        <span>2·3단계: 5지선다 문제풀이 & 해설</span>
      </button>
      <button onclick="switchTab('notes')" id="tabBtn-notes" class="tab-btn pb-3 px-3 sm:px-5 font-bold text-sm sm:text-base border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-2 transition">
        <i data-lucide="bookmark" class="w-4 h-4"></i>
        <span>오답노트 & 검색</span>
      </button>
    </div>

    <!-- TAB 1: 핵심 이론 마스터 -->
    <section id="section-theory" class="space-y-6">
      <!-- Mnemonic Cards -->
      <div class="bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/60 rounded-2xl p-4 sm:p-5">
        <div class="flex items-center gap-2 text-amber-800 dark:text-amber-300 font-extrabold text-base sm:text-lg mb-3">
          <i data-lucide="zap" class="w-5 h-5 text-amber-500 fill-amber-500"></i>
          <span>한능검 1초 킬러 암기 공식</span>
        </div>
        <div id="mnemonicsList" class="space-y-2 text-sm sm:text-base text-amber-900 dark:text-amber-200/90 font-medium leading-relaxed">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Comparison Tables -->
      <div id="tablesContainer" class="space-y-6">
        <!-- Rendered by JS -->
      </div>

      <!-- Killer Historical Records (사료 원문 박스) -->
      <div class="mt-6">
        <h3 class="text-lg sm:text-xl font-black text-slate-800 dark:text-white mb-4 flex items-center gap-2">
          <i data-lucide="file-text" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
          <span>시험에 100% 나오는 빈출 사료 원문 분석</span>
        </h3>
        <div id="recordsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Bottom Next Action Button -->
      <div class="pt-6 flex justify-center">
        <button onclick="switchTab('quiz')" class="w-full sm:w-auto px-8 py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-base sm:text-lg shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-3 transition">
          <span>이 시대 실전 5지선다 문제 풀러 가기</span>
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </div>
    </section>

    <!-- TAB 2: 5지선다형 문제풀이 & 상세 해설 -->
    <section id="section-quiz" class="hidden space-y-6">
      <div class="bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900/50 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wide">PRACTICE EXAM · TOTAL 108 QUESTIONS</span>
          <h3 class="text-base sm:text-lg font-black text-slate-900 dark:text-white">실전 기출 유형 5지선다형 모의평가</h3>
        </div>
        <div id="quizCounter" class="text-xs sm:text-sm font-bold text-indigo-700 dark:text-indigo-300 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-xl border border-indigo-200 dark:border-slate-700 shadow-sm w-fit">
          총 108문항
        </div>
      </div>

      <!-- Quick Jump Number Bar (1~12) -->
      <div id="questionJumpBar" class="flex flex-wrap gap-1.5 bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
        <!-- Rendered by JS -->
      </div>

      <!-- Questions List Container -->
      <div id="questionsContainer" class="space-y-8">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- TAB 3: 오답노트 & 통합 검색 -->
    <section id="section-notes" class="hidden space-y-6">
      <!-- Search Input -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="relative">
          <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="globalSearchInput" oninput="handleGlobalSearch()" placeholder="인물, 사건, 조약, 제도 검색 (예: 신문왕, 대동법, 헌의6조)" class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm sm:text-base">
        </div>
        <div id="searchResultsCount" class="text-xs text-slate-500 mt-2 ml-1">검색어를 입력하면 전체 9개 시대의 이론과 문제를 즉시 찾아냅니다.</div>
      </div>

      <!-- Search Results Area -->
      <div id="searchResultsList" class="space-y-4"></div>

      <!-- Saved Wrong Notes (오답노트) -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-6 border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 dark:border-slate-800">
          <div class="flex items-center gap-2">
            <i data-lucide="bookmark-check" class="w-5 h-5 text-rose-500"></i>
            <h3 class="text-base sm:text-lg font-black text-slate-900 dark:text-white">나만의 한능검 오답노트</h3>
          </div>
          <button onclick="clearAllWrongNotes()" class="text-xs text-rose-500 hover:underline">전체 비우기</button>
        </div>
        <div id="wrongNotesContainer" class="space-y-4">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>

  </main>

  <!-- ========================================== -->
  <!-- 4. 모바일 하단 네비게이션 툴바 (스마트폰 최적화) -->
  <!-- ========================================== -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 py-2 px-4 flex justify-around items-center sm:hidden shadow-lg">
    <button onclick="switchTab('theory')" class="flex flex-col items-center gap-1 text-indigo-600 dark:text-indigo-400">
      <i data-lucide="book-open" class="w-5 h-5"></i>
      <span class="text-[11px] font-bold">이론정리</span>
    </button>
    <button onclick="switchTab('quiz')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">
      <i data-lucide="check-square" class="w-5 h-5"></i>
      <span class="text-[11px] font-bold">5지선다</span>
    </button>
    <button onclick="switchTab('notes')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">
      <i data-lucide="bookmark" class="w-5 h-5"></i>
      <span class="text-[11px] font-bold">오답/검색</span>

'삼로'가 지배함", "💡 동예의 3대 특산물: [단과반] ➔ 단궁(활), 과하마(조랑말), 반어피(바다표범 가죽)"]}, "questions": [{"id": "q1_1", "question": "다음 유물이 주로 제작·사용된 시대에 대한 설명으로 옳은 것은?", "passage": "• 유물 특징: 바닥이 뾰족하거나 둥글며 겉면에 빗살 같은 무늬가 새겨져 있다.\n• 함께 출토된 도구: 가락바퀴, 뼈바늘, 갈판과 갈돌", "options": ["① 고인돌과 돌널무덤이 지배자의 무덤으로 만들어졌다.", "② 반달 돌칼을 이용하여 벼 이삭을 수확하였다.", "③ 슴베찌르개를 자루에 연결하여 창으로 사용하였다.", "④ 가락바퀴와 뼈바늘을 활용하여 옷이나 그물을 제작하였다.", "⑤ 세형 동검과 거푸집을 사용하여 독자적인 청동기를 생산하였다."], "answer": 4, "explanation": {"summary": "제시된 자료는 신석기 시대의 대표 유물인 빗살무늬 토기, 가락바퀴, 뼈바늘입니다.", "choices": ["① 오답: 고인돌과 돌널무덤은 청동기 시대의 무덤입니다.", "② 오답: 반달 돌칼로 벼를 수확한 것은 청동기 시대입니다.", "③ 오답: 슴베찌르개는 후기 구석기 시대의 뗀석기입니다.", "④ 정답: 신석기 시대에는 가락바퀴와 뼈바늘을 이용해 실을 뽑고 옷을 만드는 원시 수공업이 시작되었습니다.", "⑤ 오답: 세형 동검과 거푸집을 이용한 독자 청동기 제작은 철기 시대입니다."]}}, {"id": "q1_2", "question": "(가) 시대의 생활 모습으로 가장 적절한 것은?", "passage": "경기도 연천 전곡리 유적에서는 동아시아 최초로 아슐리안형 주먹도끼가 발견되었다. 이 유물은 (가) 시대에 인류가 돌을 깨뜨려 만든 대표적인 도구이다.", "options": ["① 동굴이나 강가의 막집에서 살며 이동 생활을 하였다.", "② 빗살무늬 토기에 곡식을 저장하고 정착 생활을 하였다.", "③ 배산임수 지형에 환호와 목책을 두른 취락을 형성하였다.", "④ 철제 농기구를 사용하여 농업 생산력을 크게 높였다.", "⑤ 비파형 동검과 거친무늬 거울을 지배층의 상징으로 삼았다."], "answer": 1, "explanation": {"summary": "연천 전곡리 아슐리안형 주먹도끼는 '구석기 시대'의 대표 유물입니다.", "choices": ["① 정답: 구석기인들은 사냥과 채집을 위해 무리를 지어 이동하며 동굴, 바위그늘, 막집에서 살았습니다.", "② 오답: 빗살무늬 토기와 정착 생활은 신석기 시대입니다.", "③ 오답: 환호와 목책은 청동기 시대입니다.", "④ 오답: 철제 농기구 사용은 철기 시대입니다.", "⑤ 오답: 비파형 동검과 거친무늬 거울은 청동기 시대입니다."]}}, {"id": "q1_3", "question": "다음 유물들이 출토된 시대의 사회 모습으로 옳은 것은?", "passage": "• 무기 및 의기: 비파형 동검, 거친무늬 거울\n• 농기구: 반달 돌칼, 홈자귀\n• 토기: 민무늬 토기, 미송리식 토기, 붉은 간토기", "options": ["① 명도전과 오수전 등 중국 화폐가 유통되었다.", "② 사유 재산과 계급이 발생하여 군장이 출현하였다.", "③ 주로 동굴이나 바위그늘에서 거주하며 이동하였다.", "④ 조·피·수수 등의 밭농사가 처음으로 시작되었다.", "⑤ 창원 다호리 유적에서 붓이 출토되어 한자 사용을 알 수 있다."], "answer": 2, "explanation": {"summary": "비파형 동검, 거친무늬 거울, 반달 돌칼, 민무늬·미송리식 토기는 '청동기 시대' 유물입니다.", "choices": ["① 오답: 중국 화폐(명도전·오수전) 출토는 철기 시대입니다.", "② 정답: 청동기 시대에는 잉여 생산물이 늘어나면서 사유 재산과 계급이 발생하고 군장(족장)이 등장했습니다.", "③ 오답: 동굴 거주는 구석기 시대입니다.", "④ 오답: 농경의 최초 시작(조·피·수수)은 신석기 시대입니다.", "⑤ 오답: 창원 다호리 붓 출토는 철기 시대입니다."]}}, {"id": "q1_4", "question": "다음 유물이 제작·사용된 시대에 대한 설명으로 옳은 것은?", "passage": "• 한반도에서 독자적으로 발전한 청동기인 세형 동검과 잔무늬 거울이 제작되었다.\n• 동검과 거울을 주조할 때 사용한 거푸집이 발견되었다.\n• 경남 창원 다호리 유적에서는 붓과 칠기 등이 출토되었다.", "options": ["① 무리 사회를 이루며 주먹도끼로 사냥을 하였다.", "② 처음으로 간석기와 빗살무늬 토기를 사용하였다.", "③ 중국과 활발히 교류하며 한자를 사용하기 시작하였다.", "④ 고인돌을 축조하여 군장의 권위를 과시하였다.", "⑤ 벼농사를 처음으로 시작하고 반달 돌칼을 썼다."], "answer": 3, "explanation": {"summary": "세형 동검, 잔무늬 거울, 거푸집, 창원 다호리 붓은 '철기 시대'의 대표적 특징입니다.", "choices": ["① 오답: 구석기 시대입니다.", "② 오답: 신석기 시대입니다.", "③ 정답: 철기 시대에는 명도전·반량전·오수전 등 중국 화폐와 창원 다호리의 붓이 출토되어 중국과 교류 및 한자 사용을 보여줍니다.", "④ 오답: 고인돌 축조는 청동기 시대입니다.", "⑤ 오답: 벼농사 시작과 반달 돌칼은 청동기 시대입니다."]}}, {"id": "q1_5", "question": "다음 자료와 관련된 국가에 대한 설명으로 옳은 것은?", "passage": "• 사람을 죽인 자는 즉시 죽인다.\n• 남에게 상처를 입힌 자는 곡식으로 갚는다.\n• 도둑질한 자는 노비로 삼는다. 용서를 받으려면 한 사람마다 50만 전을 내야 한다.", "options": ["① 마가·우가·저가·구가 등이 사출도를 다스렸다.", "② 천군이 다스리는 신성 구역인 소도가 존재하였다.", "③ 단군왕검이 건국하였으며 제정일치 사회였다.", "④ 읍군과 삼로라는 군장이 각 읍락을 지배하였다.", "⑤ 제가 회의를 열어 국가의 중대사를 결정하였다."], "answer": 3, "explanation": {"summary": "제시된 법 조항은 고조선의 '8조법(범금 8조)' 중 현재 전해지는 3개 조항입니다.", "choices": ["① 오답: 사출도는 부여입니다.", "② 오답: 천군과 소도는 삼한입니다.", "③ 정답: 고조선은 단군왕검(제사장+정치 지배자)이 건국한 제정일치 사회였습니다.", "④ 오답: 읍군·삼로는 옥저와 동예입니다.", "⑤ 오답: 제가 회의는 고구려입니다."]}}, {"id": "q1_6", "question": "(가) 인물이 집권한 이후 고조선의 변화로 옳은 것은?", "passage": "(가) 은/는 연나라 사람이다. 천여 명의 무리를 모아 상투를 틀고 조선인의 옷을 입고 동쪽으로 달아나 패수를 건넜다. 준왕의 신임을 얻어 서쪽 변방을 지키다가 세력을 키워 준왕을 몰아내고 스스로 왕이 되었다.", "options": ["① 철기 문화를 본격 수용하고 중계 무역으로 번영하였다.", "② 비파형 동검을 최초로 제작하여 요령 지방에 퍼뜨렸다.", "③ 율령을 반포하고 태학을 설립하여 인재를 양성하였다.", "④ 진흥왕의 공격을 받아 대가야가 멸망하였다.", "⑤ 한 무제의 침략을 물리치고 낙랑군을 축출하였다."], "answer": 1, "explanation": {"summary": "(가) 인물은 준왕을 몰아내고 위만 조선을 세운 '위만'입니다.", "choices": ["① 정답: 위만 조선은 철기 문화를 본격적으로 수용하고 한나라와 남쪽의 진국 사이에서 중계 무역의 이익을 독점하며 크게 발전했습니다.", "② 오답: 비파형 동검은 청동기 시대 단군조선 초기부터 사용되었습니다.", "③ 오답: 율령 반포와 태학 설립은 고구려 소수림왕입니다.", "④ 오답: 대가야 정복은 신라 진흥왕입니다.", "⑤ 오답: 위만 조선은 한 무제의 침략으로 멸망(기원전 108년)하였고, 낙랑군 축출은 고구려 미천왕(313년)입니다."]}}, {"id": "q1_7", "question": "다음 자료에 나타난 초기 국가에 대한 설명으로 옳은 것은?", "passage": "나라에 군왕이 있고, 가축의 이름을 딴 마가, 우가, 저가, 구가 등의 관리가 있어서 각기 사출도를 나누어 다스렸다. 가뭄이나 장마가 들어 오곡이 익지 않으면 그 허물을 왕에게 돌려 왕을 바꾸거나 죽이기도 하였다. 매년 12월이면 하늘에 제사를 지내는 영고라는 행사를 열었다.", "options": ["① 민며느리제라는 독특한 혼인 풍습이 있었다.", "② 다른 부족의 영역을 침범하면 소나 말로 변상하는 책화가 있었다.", "③ 1책 12법이 있었으며 지배층이 죽으면 순장을 시행하였다.", "④ 신지와 읍차라는 군장이 있었고 신성 지역인 소도가 존재하였다.", "⑤ 10월에 동맹이라는 제천 행사를 열고 서옥제를 행하였다."], "answer": 3, "explanation": {"summary": "사출도(마가·우가·저가·구가), 왕권 미약, 12월 제천행사 '영고'를 통해 '부여'임을 알 수 있습니다.", "choices": ["① 오답: 민며느리제는 옥저의 풍습입니다.", "② 오답: 책화는 동예의 풍습입니다.", "③ 정답: 부여는 1책 12법, 순장, 우제점법, 형사취수제 등의 풍습이 있었습니다.", "④ 오답: 신지·읍차와 소도는 삼한에 해당합니다.", "⑤ 오답: 10월 동맹과 서옥제는 고구려의 풍습입니다."]}}, {"id": "q1_8", "question": "다음 풍습이 있었던 초기 국가에 대한 설명으로 옳은 것은?", "passage": "혼인을 정한 뒤에 신부 집 뒤꼍에 작은 집을 짓는데 이를 서옥(壻屋)이라 부른다. 신랑이 저녁에 신부 집 문 밖에 이르러 절하고 들어가 함께 살다가 자식을 낳아 장성하면 아내를 데리고 자기 집으로 돌아간다.", "options": ["① 10월에 동맹이라는 제천 행사를 열었다.", "② 읍군과 삼로가 각 읍락을 다스렸다.", "③ 가족 공동 무덤인 골장제 풍습이 있었다.", "④ 단궁, 과하마, 반어피가 특산물로 유명하였다.", "⑤ 철을 많이 생산하여 낙랑과 왜에 수출하였다."], "answer": 1, "explanation": {"summary": "제시된 자료는 데릴사위제인 '서옥제'로, '고구려'의 대표적 혼인 풍습입니다.", "choices": ["① 정답: 고구려는 10월에 추수 감사제 성격의 제천 행사인 '동맹'을 열어 주몽과 유화 부인에게 제사 지냈습니다.", "② 오답: 읍군·삼로는 옥저와 동예입니다.", "③ 오답: 가족 공동 무덤(골장제)은 옥저입니다.", "④ 오답: 단궁·과하마·반어피는 동예의 특산물입니다.", "⑤ 오답: 철 생산 및 수출은 삼한 중 변한입니다."]}}, {"id": "q1_9", "question": "다음 장례 풍습이 있었던 국가에 대한 설명으로 옳은 것은?", "passage": "사람이 죽으면 우선 가매장하였다가 살이 다 썩으면 뼈만 추려 큰 목곽 안에 안치한다. 온 집안 식구를 모두 하나의 곽 속에 넣으며, 살아 있을 때의 모습을 닮은 나무 인형을 새겨 넣는다. 또 쌀을 담은 항아리를 곽 입구에 매달아 놓는다.", "options": ["① 5부족 연맹체로 제가 회의를 운영하였다.", "② 어린 여자를 신랑 집에 미리 데려다 키우는 민며느리제가 있었다.", "③ 매년 10월 하늘에 제사 지내는 무천을 열었다.", "④ 왕이 존재하며 사출도를 나누어 다스렸다.", "⑤ 제사장인 천군이 별읍인 소도를 다스렸다."], "answer": 2, "explanation": {"summary": "가족 공동 무덤인 '골장제(세골장)' 풍습이 있었던 나라는 '옥저'입니다.", "choices": ["① 오답: 제가 회의는 고구려입니다.", "② 정답: 옥저는 골장제와 함께 신부를 어릴 때 데려다 키우는 '민며느리제' 풍습이 있었으며, 소금과 해산물이 풍부해 고구려에 공납을 바쳤습니다.", "③ 오답: 10월 무천은 동예입니다.", "④ 오답: 사출도는 부여입니다.", "⑤ 오답: 천군과 소도는 삼한입니다."]}}, {"id": "q1_10", "question": "(가) 국가에 대한 설명으로 옳은 것은?", "passage": "(가) 은/는 산과 내를 중시하여 각기 구분이 있어 함부로 다른 부족의 영역에 들어가지 못한다. 만약 이를 어기면 책화(責禍)라 하여 노비나 소·말로 변상하게 하였다. 또한 같은 성씨끼리는 혼인하지 않는 족외혼을 지켰다.", "options": ["① 12월에 영고라는 제천 행사를 거행하였다.", "② 단궁, 과하마, 반어피 등의 특산물이 유명하였다.", "③ 부경이라는 약탈물 저장 창고를 집집마다 두었다.", "④ 마한, 진한, 변한의 세 연맹체로 구성되었다.", "⑤ 위만에게 쫓겨난 준왕이 내려와 세력을 형성하였다."], "answer": 2, "explanation": {"summary": "책화와 족외혼 풍습이 있었던 (가) 국가는 '동예'입니다.", "choices": ["① 오답: 12월 영고는 부여입니다.", "② 정답: 동예는 활인 단궁, 작은 말인 과하마, 바다표범 가죽인 반어피가 유명했으며 10월 제천 행사인 '무천'을 열었습니다.", "③ 오답: 부경 창고는 고구려입니다.", "④ 오답: 마한·진한·변한은 삼한입니다.", "⑤ 오답: 준왕이 남하한 곳은 진국(삼한) 지역입니다."]}}, {"id": "q1_11", "question": "다음 자료에 나타난 사회에 대한 설명으로 옳은 것은?", "passage": "각 읍락에는 한 사람을 세워 천신에 대한 제사를 주관하게 하였는데 이를 천군이라 부른다. 또 여러 나라에는 각각 별읍이 있으니 이를 소도라 한다. 큰 나무를 세우고 방울과 북을 매달아 귀신을 섬기며, 도적이 그곳으로 도망쳐 와도 잡아가지 못한다.", "options": ["① 제정일치의 강력한 왕권 국가였다.", "② 변한 지역에서는 철이 많이 생산되어 덩이쇠가 화폐처럼 쓰였다.", "③ 고구려의 압박을 받아 왕이 성장하지 못하였다.", "④ 상가, 고추가 등의 대가들이 사자·조의·선인을 거느렸다.", "⑤ 가뭄이 들면 왕에게 책임을 물어 교체하였다."], "answer": 2, "explanation": {"summary": "천군과 소도가 존재하는 제정분리 사회는 '삼한(마한·진한·변한)'입니다.", "choices": ["① 오답: 삼한은 정치 지배자(신지·읍차)와 제사장(천군)이 나뉜 '제정분리' 사회입니다.", "② 정답: 삼한 중 변한은 철이 풍부해 덩이쇠를 화폐처럼 쓰고 낙랑군과 왜에 수출했습니다.", "③ 오답: 고구려 압박으로 왕이 못 나온 곳은 옥저·동예입니다.", "④ 오답: 상가·고추가 및 사자·조의·선인은 고구려입니다.", "⑤ 오답: 흉년 시 왕 책임 추궁은 부여입니다."]}}, {"id": "q1_12", "question": "초기 여러 국가의 제천 행사를 시기 및 국가와 옳게 연결한 것은?", "passage": "초기 국가들은 농경과 목축의 풍요를 기원하고 부족의 결속을 다지기 위해 매년 하늘에 제사를 지내는 제천 행사를 거행하였다.", "options": ["① 부여 - 동맹 (10월)", "② 고구려 - 영고 (12월)", "③ 동예 - 무천 (10월)", "④ 옥저 - 수릿날 (5월)", "⑤ 삼한 - 책화 (12월)"], "answer": 3, "explanation": {"summary": "제천 행사 암기 공식 '부영(12)-고동(10)-동무(10)-삼5/10'을 적용합니다.", "choices": ["① 오답: 부여는 12월 영고입니다.", "② 오답: 고구려는 10월 동맹입니다.", "③ 정답: 동예는 매년 10월 추수 감사제 성격의 '무천'을 열었습니다.", "④ 오답: 옥저는 제천 행사 기록이 없으며, 5월 수릿날은 삼한입니다.", "⑤ 오답: 책화는 동예의 풍습이며, 삼한은 5월 수릿날과 10월 계절제입니다."]}}]}, {"id": "era2", "name": "2. 삼국 시대 & 가야", "tag": "출제 3~4문항", "period": "기원전 1세기 ~ 기원후 7세기 후반 (삼국 통일까지)", "summary": "한강 유역 쟁탈전을 중심으로 4세기 백제(근초고왕), 5세기 고구려(광개토대왕·장수왕), 6세기 신라(지증왕·법흥왕·진흥왕)의 전성기 왕 업적과 가야의 변천, 그리고 삼국통일 6단계 과정을 마스터해야 합니다.", "theory": {"tables": [{"title": "삼국 전성기 국왕 및 핵심 업적 총정리", "headers": ["국가", "전성기 세기", "대표 국왕", "핵심 정치·영토 업적", "문화 및 비석/사료"], "rows": [["백제", "4세기", "근초고왕", "마한 전 지역 병합, 고구려 고국원왕 전사(평양성), 요서·산둥·규슈 진출", "칠지도 하사(왜왕), 고흥의 <서기> 편찬"], ["백제", "6세기", "무령왕 / 성왕", "무령왕: 22담로 왕족 파견 / 성왕: 사비(부여) 천도, 남부여 개칭, 22부 관제", "무령왕릉(중국 양나라 양식 벽돌무덤, 지석), 관산성 전투(성왕 전사)"], ["고구려", "4세기", "소수림왕", "국가 체제 정비 (전성기 디딤돌): 율령 반포, 불교 공인, 태학 설립", "전진의 순도를 통해 불교 수용"], ["고구려", "5세기", "광개토대왕 / 장수왕", "광개토: 영락 연호, 만주 요동 정벌, 신라(내물왕) 구원(왜 격퇴) / 장수: 평양 천도(남진 정책), 한성 함락", "광개토대왕릉비, 호우명 그릇(신라 교류 증명), 충주(중원) 고구려비"], ["신라", "6세기", "지증왕 / 법흥왕", "지증왕: '신라' 국호, '왕' 칭호, 우산국 복속(이사부), 우경 / 법흥왕: 병부 설치, 율령 반포, 공복 제정, 금관가야 병합", "이차돈의 순교로 불교 공인, 건원 독자 연호"], ["신라", "6세기", "진흥왕", "화랑도 국가 조직 개편, 한강 유역 독점 장악, 대가야 정복(562), 영토 확장", "단양 적성비, 4대 순수비(북한산·창녕·황초령·마운령비), 거칠부 <국사>"]]}, {"title": "삼국 통일의 6단계 결정적 타임라인", "headers": ["단계", "연도", "사건명", "주요 인물 및 격전지", "결과 및 역사적 의의"], "rows": [["1단계", "612 / 645", "살수대첩 / 안시성 전투", "을지문덕(살수에서 수 양제 격파), 양만춘(당 태종 격퇴)", "수·당의 대규모 침략을 고구려가 단독 격퇴"], ["2단계", "648", "나·당 동맹 체결", "김춘추(신라 태종 무열왕)와 당 태종", "고구려·백제 협공을 위한 신라와 당의 외교적 결연"], ["3단계", "660", "백제 멸망 및 부흥운동", "황산벌 전투(계백 결사대 vs 김유신) / 흑치상지, 복신, 도침, 백강전투", "사비성 함락으로 백제 멸망 ➔ 왜 수군 지원한 백강 전투 패배로 부흥 실패"], ["4단계", "668", "고구려 멸망 및 부흥운동", "평양성 함락(연개소문 사후 내분) / 검모잠, 안승, 고연무", "고구려 멸망 ➔ 신라 문무왕이 안승을 보덕국왕에 봉하여 포섭"], ["5단계", "675", "매소성 전투 (육군 격파)", "신라 육군 vs 이근행의 당 20만 대군 (경기도 연천)", "당의 주력 육군을 궤멸시켜 전세를 신라로 역전시킴"], ["6단계", "676", "기벌포 전투 (해군 격파)", "신라 수군(사찬 시득) vs 설인귀의 당 수군 (금강 하구)", "당 수군을 최종 격파하고 도호부를 몰아내어 삼국 통일 완결"]]}], "killer_records": [{"title": "사료 1: 광개토대왕릉비 신묘년조와 신라 구원", "text": "영락 10년(400년) 경자에 왕이 보병과 기병 5만을 보내 신라를 구원하게 하였다. 남거성을 거쳐 신라성에 이르니 왜적이 가득하였다. 관군이 도착하자 왜적이 퇴각하였다... 뒤를 쫓아 임나가라의 종발성에 이르러 항복을 받았다."}, {"title": "사료 2: 신라 단양 적성비와 순수비", "text": "진흥왕이 국경을 순수(巡狩)하며 사방으로 영토를 개척하고 국경을 안정시킨 공을 기리고자 비석을 세웠다. 북한산비, 창녕비, 황초령비, 마운령비를 세워 강역을 분명히 표시하였다."}], "mnemonics": ["💡 신라 6세기 3대 왕: [지 ➔ 법 ➔ 진] ➔ 지증왕(기반정비) ➔ 법흥왕(제도완비) ➔ 진흥왕(영토확장)", "💡 백제 수도 변천: [한성(한성백제) ➔ 웅진(문주왕, 공주) ➔ 사비(성왕, 부여)]", "💡 나당전쟁 승리 암기: [매기] ➔ 매소성 전투(육군) + 기벌포 전투(해군) = 당군 완전 축출"]}, "questions": [{"id": "q2_1", "question": "다음 업적을 남긴 백제 국왕에 대한 설명으로 옳은 것은?", "passage": "• 마한의 남은 세력을 모두 병합하여 남해안까지 영토를 넓혔다.\n• 평양성을 공격하여 고구려의 고국원왕을 전사시켰다.\n• 박사 고흥에게 명하여 역사서인 <서기>를 편찬하게 하였다.", "options": ["① 웅진으로 도읍을 옮기고 왕권을 안정시켰다.", "② 22담로에 왕족을 파견하여 지방 통제를 강화하였다.", "③ 왜왕에게 칠지도를 하사하고 요서·산둥·규슈로 진출하였다.", "④ 국호를 남부여로 고치고 사비로 천도하였다.", "⑤ 6좌평과 16관등제를 정비하여 중앙 집권의 기틀을 다졌다."], "answer": 3, "explanation": {"summary": "4세기 백제 전성기를 이끈 '근초고왕'의 업적입니다.", "choices": ["① 오답: 웅진 천도는 문주왕(475년)입니다.", "② 오답: 22담로 왕족 파견은 무령왕입니다.", "③ 정답: 근초고왕은 부자 상속을 확립하고 요서·산둥·일본 규슈까지 활발히 진출했으며 왜왕에게 칠지도를 하사했습니다.", "④ 오답: 사비 천도와 남부여 개칭은 성왕입니다.", "⑤ 오답: 6좌평·16관등제는 3세기 고이왕입니다."]}}, {"id": "q2_2", "question": "다음 무덤의 주인인 백제 국왕의 업적으로 옳은 것은?", "passage": "• 충남 공주시(웅진)에서 도굴되지 않은 완전한 형태로 발굴되었다.\n• 중국 남조(양나라)의 영향을 받은 벽돌무덤 양식으로 축조되었다.\n• 무덤 입구에서 발견된 지석(묘지석)을 통해 피장자와 축조 연대가 정확히 밝혀졌다.", "options": ["① 지방의 22담로에 왕족을 파견하여 지방 통제를 강화하였다.", "② 관산성 전투에서 신라군과 싸우다 전사하였다.", "③ 고구려 장수왕의 공격으로 한성이 함락되고 전사하였다.", "④ 익산에 미륵사를 창건하여 왕실의 권위를 높였다.", "⑤ 진흥왕과 연합하여 고구려로부터 한강 유역을 일시 수복하였다."], "answer": 1, "explanation": {"summary": "공주 송산리 고분군의 벽돌무덤과 지석은 백제 '무령왕(사마왕)'의 무덤입니다.", "choices": ["① 정답: 무령왕은 지방 통제를 강화하기 위해 22담로에 왕족을 파견하고, 중국 양나라와 활발히 교류하며 백제 중흥의 발판을 마련했습니다.", "② 오답: 관산성 전투 전사는 성왕입니다.", "③ 오답: 한성 함락 및 전사는 개로왕입니다.", "④ 오답: 익산 미륵사 창건은 무왕입니다.", "⑤ 오답: 한강 일시 수복은 성왕입니다."]}}, {"id": "q2_3", "question": "(가) 왕의 재위 기간에 있었던 사실로 옳은 것은?", "passage": "백제의 (가) 은/는 중흥을 도모하기 위해 수도를 웅진에서 사비(부여)로 천도하고 국호를 남부여로 고쳤다. 또한 중앙 관청을 22부로 확대 정비하고 수도를 5부, 지방을 5방으로 개편하였다.", "options": ["① 고흥에게 명하여 <서기>를 편찬하였다.", "② 노리사치계를 일본에 보내 불교를 전파하였다.", "③ 율령을 반포하고 관리의 공복을 제정하였다.", "④ 평양성을 공격하여 고국원왕을 전사시켰다.", "⑤ 동진의 마라난타를 통해 불교를 공인하였다."], "answer": 2, "explanation": {"summary": "사비 천도, 남부여 개칭, 22부 5부 5방 정비는 백제 '성왕'입니다.", "choices": ["① 오답: <서기> 편찬은 근초고왕입니다.", "② 정답: 성왕은 일본에 노리사치계를 파견하여 불경과 불상을 전하며 일본 아스카 문화 형성에 큰 영향을 주었습니다.", "③ 오답: 율령 반포와 공복 제정은 고이왕입니다.", "④ 오답: 고국원왕 전사는 근초고왕입니다.", "⑤ 오답: 마라난타 불교 공인은 침류왕입니다."]}}, {"id": "q2_4", "question": "다음 정책을 추진하여 고구려 5세기 전성기의 기틀을 마련한 국왕은?", "passage": "• 전진의 승려 순도를 통해 불교를 공인하여 사상을 통합하였다.\n• 국가 최고 교육 기관인 태학을 설립하여 유교 경전과 무술을 가르쳤다.\n• 국가의 기본 법전인 율령을 반포하여 통치 체제를 확립하였다.", "options": ["① 태조왕", "② 고국천왕", "③ 미천왕", "④ 소수림왕", "⑤ 영류왕"], "answer": 4, "explanation": {"summary": "불교 공인, 태학 설립, 율령 반포로 국가 위기(고국원왕 전사)를 극복한 왕은 '소수림왕'입니다.", "choices": ["① 오답: 태조왕은 옥저 정복 및 계루부 고씨 왕위 세습입니다.", "② 오답: 고국천왕은 진대법 실시 및 행정적 5부 개편입니다.", "③ 오답: 미천왕은 낙랑군·대방군 축출입니다.", "④ 정답: 소수림왕(4세기 후반)의 체제 정비 덕분에 5세기 광개토대왕과 장수왕의 대정복이 가능했습니다.", "⑤ 오답: 영류왕은 천리장성 축조를 시작했으나 연개소문 정변으로 피살되었습니다."]}}, {"id": "q2_5", "question": "다음 유물이 제작된 배경이 된 고구려 국왕의 업적으로 옳은 것은?", "passage": "경주 호우총에서 출토된 청동 그릇 바닥에 '을묘년 국강상광개토지호태왕 호우십'이라는 명문이 새겨져 있다. 이는 고구려가 신라 내물마립간의 구원 요청을 받아들여 왜구를 격퇴한 이후 신라에 영향력을 행사했음을 보여준다.", "options": ["① 영락이라는 독자적 연호를 사용하고 요동과 만주를 정복하였다.", "② 수도를 국내성에서 평양으로 천도하여 남진 정책을 추진하였다.", "③ 낙랑군을 축출하고 대동강 유역을 완전히 차지하였다.", "④ 을파소를 등용하여 춘대추납의 진대법을 시행하였다.", "⑤ 살수에서 수나라의 30만 별동대를 격멸하였다."], "answer": 1, "explanation": {"summary": "호우명 그릇은 '광개토대왕'의 신라 구원(400년)과 신라 내정 간섭을 증명하는 유물입니다.", "choices": ["① 정답: 광개토대왕은 우리나라 최초의 연호인 '영락'을 사용하고 요동·만주 일대를 정복하며 동북아의 패자로 군림했습니다.", "② 오답: 평양 천도는 장수왕(427년)입니다.", "③ 오답: 낙랑군 축출은 미천왕(313년)입니다.", "④ 오답: 진대법 실시는 고국천왕입니다.", "⑤ 오답: 살수대첩은 영양왕 때 을지문덕입니다."]}}, {"id": "q2_6", "question": "다음 비석을 건립한 왕의 재위 기간에 있었던 사실로 옳은 것은?", "passage": "• 충북 충주시에서 발견된 고구려 유일의 한반도 내 석비이다.\n• 내용: 고구려 대왕이 신라 매금(왕)에게 의복을 하사하고, 신라 영토에 고구려 당주가 주둔하였다는 내용이 기록되어 있다.", "options": ["① 영락이라는 독자적인 연호를 사용하였다.", "② 평양으로 수도를 천도하고 백제의 한성을 함락하였다.", "③ 율령을 반포하고 불교를 공인하여 체제를 정비하였다.", "④ 을파소의 건의를 받아들여 진대법을 처음 실시하였다.", "⑤ 살수에서 수나라 군대를 크게 물리쳤다."], "answer": 2, "explanation": {"summary": "제시된 비석은 '충주(중원) 고구려비'이며, 이를 건립한 왕은 남진 정책을 추진한 '장수왕'입니다.", "choices": ["① 오답: 영락 연호 사용은 광개토대왕입니다.", "② 정답: 장수왕은 427년 평양 천도 후 475년 백제 한성을 함락(개로왕 전사)시키고 남한강 유역까지 진출했습니다.", "③ 오답: 율령 반포와 불교 공인은 소수림왕입니다.", "④ 오답: 진대법 실시는 고국천왕입니다.", "⑤ 오답: 살수대첩은 영양왕 때입니다."]}}, {"id": "q2_7", "question": "(가) 국왕의 업적으로 옳은 것은?", "passage": "신라의 (가) 은/는 6세기 초에 국호를 '신라'로 확정하고, '마립간' 대신 중국식 칭호인 '왕'을 처음 사용하였다. 또한 순장을 금지하고 소를 이용한 밭갈이(우경)를 장려하여 농업 생산력을 높였다.", "options": ["① 이사부를 파견하여 우산국(울릉도)을 복속시켰다.", "② 병부를 설치하고 17관등과 4색 공복을 제정하였다.", "③ 화랑도를 국가적 조직으로 개편하고 대가야를 정복하였다.", "④ 김씨에 의한 왕위 세습권을 확립하고 마립간 칭호를 썼다.", "⑤ 문무 관료전을 지급하고 녹읍을 폐지하였다."], "answer": 1, "explanation": {"summary": "국호 '신라', 칭호 '왕', 순장 금지, 우경 장려는 6세기 초 '지증왕'입니다.", "choices": ["① 정답: 지증왕은 이사부를 보내 우산국을 복속시키고, 경주에 동시 및 시장을 감독하는 '동시전'을 설치했습니다.", "② 오답: 병부 설치와 17관등·공복 제정은 법흥왕입니다.", "③ 오답: 화랑도 개편과 대가야 정복은 진흥왕입니다.", "④ 오답: 김씨 왕위 세습 및 마립간 최초 사용은 내물마립간입니다.", "⑤ 오답: 관료전 지급과 녹읍 폐지는 통일신라 신문왕입니다."]}}, {"id": "q2_8", "question": "다음 업적을 남긴 신라 국왕에 대한 설명으로 옳은 것은?", "passage": "• 율령을 반포하고 17관등제와 4색 공복을 제정하였다.\n• 이차돈의 순교를 계기로 불교를 공식적으로 인정하였다.\n• '건원'이라는 신라 최초의 독자적 연호를 사용하였다.", "options": ["① 금관가야를 병합하고 병부를 설치하였다.", "② 한강 유역을 장악하고 북한산 순수비를 세웠다.", "③ 이사부를 보내 우산국을 복속시켰다.", "④ 당나라와 동맹을 맺고 백제를 멸망시켰다.", "⑤ 국학을 설립하여 유학을 장려하였다."], "answer": 1, "explanation": {"summary": "율령 반포, 이차돈 순교 불교 공인, 건원 연호는 신라 '법흥왕'입니다.", "choices": ["① 정답: 법흥왕은 군사 기구인 병부를 설치하고 상대등 제도를 두었으며 532년 금관가야(김해)를 병합했습니다.", "② 오답: 한강 장악과 북한산 순수비는 진흥왕입니다.", "③ 오답: 우산국 복속은 지증왕입니다.", "④ 오답: 백제 멸망(660년)은 태종 무열왕(김춘추)입니다.", "⑤ 오답: 국학 설립은 신문왕입니다."]}}, {"id": "q2_9", "question": "(가) 왕의 재위 시기에 신라에서 일어난 사실로 옳은 것은?", "passage": "백제 성왕은 (가) 과/와 연합하여 고구려를 공격하고 한강 상류 지역을 차지하였다. 그러나 곧이어 (가) 이/가 동맹을 깨고 백제가 되찾았던 한강 하류 지역까지 빼앗아 버렸다. 이에 분노한 성왕이 군사를 일으켜 공격하였으나 관산성에서 전사하고 말았다.", "options": ["① 건원이라는 독자적인 연호를 최초로 제정하였다.", "② 이차돈의 순교를 계기로 불교를 공인하였다.", "③ 화랑도를 국가적 조직으로 개편하고 대가야를 정복하였다.", "④ 우산국을 복속시키고 시장을 감독하는 동시전을 설치하였다.", "⑤ 국학을 설립하여 유교 경전을 교육하였다."], "answer": 3, "explanation": {"summary": "(가) 왕은 한강 전 유역을 독점 장악하고 관산성 전투에서 성왕을 전사시킨 신라 '진흥왕'입니다.", "choices": ["① 오답: 건원 연호는 법흥왕입니다.", "② 오답: 불교 공인은 법흥왕입니다.", "③ 정답: 진흥왕은 화랑도를 국가 조직화하고 대가야를 정복(562)하였으며 단양 적성비와 4대 순수비를 건립했습니다.", "④ 오답: 우산국 복속과 동시전 설치는 지증왕입니다.", "⑤ 오답: 국학 설립은 신문왕입니다."]}}, {"id": "q2_10", "question": "가야 연맹의 발전과 변천에 대한 설명으로 옳은 것은?", "passage": "낙동강 하류 변한 지역에서 성장한 가야는 풍부한 철과 해상 교통을 바탕으로 독자적인 문화를 꽃피웠으나 중앙 집권 국가로 발전하지 못하고 신라에 병합되었다.", "options": ["① 전기 가야 연맹은 고령의 대가야가 주도하였다.", "② 광개토대왕의 신라 구원 이후 김해 금관가야가 쇠퇴하였다.", "③ 후기 가야 연맹은 신라 법흥왕의 공격으로 완전히 멸망하였다.", "④ 가야의 철제 갑옷과 토기는 고구려 벽화에 큰 영향을 주었다.", "⑤ 가야는 6세기 중반 백제와 연합하여 한강 유역을 차지하였다."], "answer": 2, "explanation": {"summary": "전기 가야 연맹(김해 금관가야) ➔ 5세기 광개토대왕 남정으로 쇠퇴 ➔ 후기 가야 연맹(고령 대가야)으로 중심이 이동했습니다.", "choices": ["① 오답: 전기 가야 연맹은 김해 금관가야가 주도했습니다.", "② 정답: 400년 광개토대왕이 왜를 격퇴하며 금관가야까지 타격을 입히자, 연맹의 중심이 내륙의 고령 대가야로 이동했습니다.", "③ 오답: 후기 가야(대가야)를 정복한 왕은 진흥왕(562년)입니다. 법흥왕은 금관가야(532년)를 병합했습니다.", "④ 오답: 가야 토기는 일본의 '스에키' 토기 발전에 큰 영향을 주었습니다.", "⑤ 오답: 가야는 한강 유역을 차지한 적이 없습니다."]}}, {"id": "q2_11", "question": "다음 전투가 전개된 시기의 대외 항쟁에 대한 설명으로 옳은 것은?", "passage": "수나라 양제가 113만 대군을 이끌고 요동성을 공격하였으나 함락시키지 못하자, 우중문이 이끄는 30만 별동대를 평양성으로 직접 보냈다. 이에 고구려 장군이 거짓 항복으로 유인한 뒤 철수하는 수나라 군대를 강에서 크게 무찔렀다.", "options": ["① 을지문덕이 이끈 살수 대첩(612년)이다.", "② 양만춘과 성민들이 합심하여 당 태종을 물리친 안시성 전투이다.", "③ 김유신이 황산벌에서 계백의 결사대를 격파한 전투이다.", "④ 신라가 당의 육군을 궤멸시킨 매소성 전투이다.", "⑤ 연개소문이 정변을 일으킨 직후 발생한 전투이다."], "answer": 1, "explanation": {"summary": "수나라 우중문의 30만 별동대를 격파한 전투는 612년 을지문덕의 '살수 대첩'입니다.", "choices": ["① 정답: 을지문덕은 청야 전술과 유인 전술을 구사해 살수(청천강)에서 수나라 별동대를 거의 전멸시켰습니다.", "② 오답: 안시성 전투는 645년 당 태종의 침략을 막아낸 전투입니다.", "③ 오답: 황산벌 전투는 660년 백제 멸망 직전 전투입니다.", "④ 오답: 매소성 전투는 675년 나당 전쟁입니다.", "⑤ 오답: 연개소문 정변(642년)은 당과의 전쟁(안시성 전투) 배경입니다."]}}, {"id": "q2_12", "question": "삼국 통일 과정에서 일어난 다음 사건들을 시기순으로 옳게 나열한 것은?", "passage": "(가) 나·당 연합군의 공격으로 백제 사비성이 함락되었다.\n(나) 신라군이 매소성과 기벌포에서 당군을 격파하고 삼국 통일을 완수하였다.\n(다) 백제 부흥군이 왜의 지원을 받아 백강 전투에서 나·당 연합군과 싸웠다.\n(라) 연개소문 사후 내분이 일어난 고구려 평양성이 함락되었다.", "options": ["① (가) - (다) - (라) - (나)", "② (가) - (라) - (다) - (나)", "③ (다) - (가) - (라) - (나)", "④ (라) - (가) - (다) - (나)", "⑤ (가) - (다) - (나) - (라)"], "answer": 1, "explanation": {"summary": "백제 멸망(660) ➔ 백제 부흥운동·백강전투(663) ➔ 고구려 멸망(668) ➔ 나당전쟁 매소성(675)·기벌포(676) 순입니다.", "choices": ["① 정답: (가) 660년 ➔ (다) 663년 ➔ (라) 668년 ➔ (나) 675~676년 순서가 정확합니다.", "② 오답: 백강 전투가 고구려 멸망보다 앞섭니다.", "③ 오답: 백제 멸망이 부흥운동보다 먼저입니다.", "④ 오답: 백제가 고구려보다 먼저 멸망했습니다.", "⑤ 오답: 나당전쟁이 가장 마지막입니다."]}}]}, {"id": "era3", "name": "3. 남북국 시대 (통일신라 & 발해)", "tag": "출제 3문항", "period": "7세기 후반 ~ 10세기 초", "summary": "신문왕의 전제 왕권 강화책(녹읍 폐지, 관료전, 9주5소경)과 신라 하대의 혼란 및 사상(선종, 풍수지리설), 그리고 발해 대조영·무왕·문왕·선왕의 업적과 대외 관계를 체계적으로 정리해야 합니다.", "theory": {"tables": [{"title": "통일신라 중대(전성기) vs 하대(혼란기) 핵심 대조표", "headers": ["구분", "통일신라 중대 (무열왕~혜공왕)", "통일신라 하대 (선덕왕~경순왕)"], "rows": [["정치 상황", "왕권 전제화, 진골 귀족 억압, 집사부 시중 권한 강화", "진골 귀족의 왕위 쟁탈전(김헌창의 난), 화백회의 귀족 권한 강화"], ["핵심 국왕", "신문왕: 김흠돌 숙청, 관료전 지급, 녹읍 폐지, 9주 5소경, 국학", "원성왕(독서삼품과), 진성여왕(원종·애노의 난, 적고적의 난)"], ["지배/반발 세력", "6두품 세력이 국왕의 학문적·정치적 조언자로 활약", "호족 세력 대두(성주, 장군 자칭), 6두품 반신라화(최치원 시무 10조 좌절)"], ["불교 및 사상", "교종 발달 (원효의 화쟁/아미타, 의상의 화엄/관음)", "선종 9산선문 유행(개인 참선 깨달음), 풍수지리설(도선, 지방 호족 뒷받침)"]]}, {"title": "해동성국 발해의 4대 핵심 국왕과 체제", "headers": ["국왕", "연호", "주요 업적 및 대외 관계", "역사적 의미"], "rows": [["고왕 (대조영)", "-", "고구려 유민과 말갈족을 이끌고 동모산 기슭에 건국(698)", "고구려 계승 선언 (정혜공주묘 모줄임 천장 구조)"], ["무왕 (대무예)", "인안", "당과 대립: 장문휴 수군을 보내 당의 산둥반도 등주 선제 공격, 북만주 장악", "일본에 보낸 국서에 '고려국왕' 자칭"], ["문왕 (대흠무)", "대흥", "당과 친선: 3성 6부제 수용, 상경 천도, 주자감 설치, 신라도 개설", "문물 제도 완성, 불교 장려(정효공주묘 벽화)"], ["선왕 (대인수)", "건흥", "최대 영토 확보(5경 15부 62주 완비), 대부분의 말갈족 복속", "당으로부터 '바다 동쪽의 번성한 나라(해동성국)' 칭호 획득"]]}], "killer_records": [{"title": "사료 1: 신라 촌락문서 (민정문서, 일본 정창원 발견)", "text": "서원경 관내 4개 촌락 조사... 호(戶)는 인정(人丁)의 다소에 따라 상상호에서 하하호까지 9등급으로 나누고, 인구는 남녀 연령별로 6등급으로 파악하였다. 토지의 면적과 뽕나무·잣나무·호두나무 수, 소와 말의 수를 낱낱이 파악하여 3년마다 다시 작성한다."}, {"title": "사료 2: 원효의 일심 사상과 화쟁 (대승기신론소)", "text": "열면 헤아릴 수 없이 많은 뜻이 종(宗)이 되고, 합하면 온갖 이치가 하나의 마음에 돌아간다... 모든 종파의 서로 다른 이론을 조화시켜 하나로 융합하니 이를 화쟁(和諍)이라 한다."}], "mnemonics": ["💡 신문왕의 귀족 제압 4종: [흠·문·녹·국] ➔ 김흠돌 숙청 ➔ 문무관료전 지급 ➔ 녹읍 폐지 ➔ 국학 설치", "💡 발해 왕 연호 3인방: [무인 - 문대 - 선건] ➔ 무왕(인안), 문왕(대흥), 선왕(건흥)"]}, "questions": [{"id": "q3_1", "question": "다음 업적을 남긴 통일신라 국왕의 정책으로 옳은 것은?", "passage": "• 김흠돌의 모반 사건을 계기로 진골 귀족들을 대대적으로 숙청하였다.\n• 문무 관료들에게 관료전을 지급하고, 귀족들의 경제적 기반이었던 녹읍을 혁파하였다.\n• 전국을 9주로 나누고 군사·행정상 요충지에 5소경을 두었다.", "options": ["① 독서삼품과를 시행하여 인재를 등용하고자 하였다.", "② 최고 교육 기관으로 국학을 설립하여 유교 경전을 교육하였다.", "③ 시장을 감독하는 관청인 동시전을 처음 설치하였다.", "④ 최치원의 시무 10조를 수용하여 개혁을 단행하였다.", "⑤ 이차돈의 순교를 계기로 불교를 공인하였다."], "answer": 2, "explanation": {"summary": "제시된 자료는 신라 중대 전제 왕권을 확립한 '신문왕'의 업적입니다.", "choices": ["① 오답: 독서삼품과 시행은 신라 하대 원성왕입니다.", "② 정답: 신문왕은 유학 교육을 위해 국학을 설치하고 9서당 10정의 군사 조직을 정비했습니다.", "③ 오답: 동시전 설치는 지증왕입니다.", "④ 오답: 최치원 시무 10조는 진성여왕에게 건의되었습니다.", "⑤ 오답: 불교 공인은 법흥왕입니다."]}}, {"id": "q3_2", "question": "다음 문서에 대한 설명으로 옳은 것은?", "passage": "일본 도다이사 정창원에서 발견된 이 문서는 서원경(청주) 부근 4개 촌락의 실태를 기록한 것이다. 호(戶)는 인정의 다소에 따라 9등급, 인구는 남녀 연령별로 6등급으로 나누었으며, 토지 면적과 뽕나무·잣나무·호두나무, 소와 말의 수까지 자세히 적혀 있다.", "options": ["① 중앙에서 파견된 지방관이 매년 조사하여 작성하였다.", "② 조세 수취와 노동력 징발을 목적으로 촌주가 3년마다 작성하였다.", "③ 고려 시대 양안과 호적 제도의 직접적인 시초가 되었다.", "④ 귀족들에게 지급된 녹읍의 세금 징수 내역을 기록한 문서이다.", "⑤ 조선 시대 세종이 전분 6등법을 실시하기 위해 만든 장부이다."], "answer": 2, "explanation": {"summary": "일본 정창원에서 발견된 통일신라의 '신라 촌락문서(민정문서)'입니다.", "choices": ["① 오답: 지방관이 매년 작성한 것이 아니라 촌주가 3년마다 작성했습니다.", "② 정답: 촌주가 3년마다 촌락의 경제력과 인적 자원을 꼼꼼히 조사하여 국가의 조세 수취와 역역(노동력) 징발의 근거로 삼았습니다.", "③ 오답: 고려가 아니라 통일신라의 문서입니다.", "④ 오답: 녹읍 세금 내역이 아니라 국가의 촌락 지배 문서입니다.", "⑤ 오답: 조선 세종 공법과 무관합니다."]}}, {"id": "q3_3", "question": "통일신라의 지방 행정 제도인 '5소경'을 설치한 주요 목적은?", "passage": "신문왕은 전국을 9주로 개편하는 한편, 금관경·남원경·서원경·중원경·북원경의 5소경을 지방 요충지에 설치하였다.", "options": ["① 수도인 경주가 동남쪽에 치우친 지리적 편재성을 보완하기 위함이다.", "② 발해의 남진을 막기 위해 압록강 유역에 군사 기지를 세우기 위함이다.", "③ 6두품 세력에게 지방 장관직을 독점적으로 부여하기 위함이다.", "④ 일본과의 해상 무역을 전담하는 왜관을 설치하기 위함이다.", "⑤ 지방 호족들의 독립적인 군사력을 공식적으로 인정하기 위함이다."], "answer": 1, "explanation": {"summary": "5소경은 수도 경주의 치우침을 보완하고 옛 고구려·백제 귀족을 이주시켜 지방 세력을 견제하려는 목적입니다.", "choices": ["① 정답: 수도 경주가 한반도 동남쪽에 치우친 한계를 보완하고 지방 문화를 균형 있게 발전시키며 지방 세력을 감시하기 위해 5소경을 두었습니다.", "② 오답: 압록강 유역이 아니라 남부·중부 요충지에 설치했습니다.", "③ 오답: 지방 장관은 진골 귀족이 독점했습니다.", "④ 오답: 왜관 설치는 조선 시대입니다.", "⑤ 오답: 호족 인정이 아니라 중앙 집권 강화 목적입니다."]}}, {"id": "q3_4", "question": "다음 제도를 시행한 신라 국왕 시기의 사회 모습으로 옳은 것은?", "passage": "국학의 학생들을 대상으로 유교 경전의 이해 수준을 평가하여 상·중·하 3등급으로 나누어 관리를 등용하는 '독서삼품과'를 시행하였다. 그러나 진골 귀족의 반발과 골품제의 벽으로 인해 큰 실효를 거두지 못하였다.", "options": ["① 진골 귀족 간의 왕위 쟁탈전이 치열해지던 신라 하대였다.", "② 신문왕이 김흠돌의 난을 진압하고 전제 왕권을 확립하였다.", "③ 장보고가 완도에 청해진을 설치하고 남해 해상권을 장악하였다.", "④ 성덕왕이 백성들에게 정전을 처음으로 지급하였다.", "⑤ 경덕왕이 불국사와 석굴암 창건을 시작하였다."], "answer": 1, "explanation": {"summary": "독서삼품과는 신라 하대 '원성왕(788년)'이 시행한 인재 등용 제도입니다.", "choices": ["① 정답: 원성왕은 혜공왕 피살(780년) 이후 진골 귀족 간의 왕위 쟁탈전이 본격화된 신라 하대 초기 국왕입니다.", "② 오답: 신문왕은 신라 중대입니다.", "③ 오답: 청해진 설치는 흥덕왕(828년)입니다.", "④ 오답: 정전 지급은 중대 성덕왕입니다.", "⑤ 오답: 불국사·석굴암 창건은 중대 경덕왕입니다."]}}, {"id": "q3_5", "question": "신라 하대 사회의 동요와 새로운 세력의 성장에 대한 설명으로 옳지 않은 것은?", "passage": "혜공왕 피살 이후 150여 년 동안 20명의 왕이 교체될 정도로 극심한 혼란이 이어졌고, 진성여왕 때에는 전국 각지에서 농민 봉기가 일어났다.", "options": ["① 진성여왕 때 사벌주에서 원종과 애노의 난이 일어났다.", "② 지방에서 스스로 성주나 장군을 칭하는 호족 세력이 성장하였다.", "③ 골품제에 불만을 품은 6두품 세력이 호족과 손잡고 새 사회를 모색하였다.", "④ 개인의 참선과 깨달음을 중시하는 선종 불교가 지방 호족의 후원으로 유행하였다.", "⑤ 도선이 전파한 풍수지리설은 경주 중심의 지리관을 더욱 공고히 하였다."], "answer": 5, "explanation": {"summary": "신라 하대에는 호족, 6두품, 선종, 풍수지리설이 결합하여 신라 골품 체제를 해체하고 고려 건국의 사상적 토대가 되었습니다.", "choices": ["① 옳음: 진성여왕 때 조세 독촉에 반발해 원종·애노의 난과 적고적의 난이 발생했습니다.", "② 옳음: 지방 호족은 성주·장군을 자칭하며 독자적 군사·행정력을 행사했습니다.", "③ 옳음: 최치원 등 6두품은 신라 개혁이 좌절되자 호족과 결합했습니다.", "④ 옳음: 선종은 교종과 달리 형식보다 개인의 깨달음을 중시해 호족의 사상적 기반이 되었습니다.", "⑤ 정답(옳지 않음): 풍수지리설은 경주의 지덕이 쇠퇴하고 송악(개성) 등 지방이 명당이라는 논리로 '경주 중심 지리관을 타파'하고 지방 호족의 성장을 뒷받침했습니다."]}}, {"id": "q3_6", "question": "다음 사상을 주장한 통일신라 승려에 대한 설명으로 옳은 것은?", "passage": "모든 것이 오직 한마음에서 비롯된다는 일심(一心) 사상을 바탕으로, 서로 다른 종파 간의 대립을 조화시키려는 화쟁(和諍) 사상을 제창하였다. 또한 '나무아미타불'만 외워도 극락에 갈 수 있다고 설파하였다.", "options": ["① 당나라에 유학하여 화엄학을 배우고 부석사를 창건하였다.", "② <십문화쟁론>과 <대승기신론소>를 저술하고 불교 대중화에 기여하였다.", "③ 인도와 중앙아시아를 순례하고 <왕오천축국전>을 남겼다.", "④ 교종 중심으로 선종을 통합하여 해동 천태종을 개창하였다.", "⑤ 수선사 결사를 주도하며 돈오점수와 정혜쌍수를 주장하였다."], "answer": 2, "explanation": {"summary": "일심 사상, 화쟁 사상, 아미타 신앙(정토종)을 전파한 승려는 '원효'입니다.", "choices": ["① 오답: 화엄종과 부석사 창건은 의상입니다.", "② 정답: 원효는 당 유학길에 해골물을 마시고 깨달음을 얻어 돌아온 뒤, 저술 활동과 무애가를 통해 불교 대중화를 이끌었습니다.", "③ 오답: <왕오천축국전>은 혜초입니다.", "④ 오답: 천태종 개창은 고려 의천입니다.", "⑤ 오답: 수선사 결사와 돈오점수는 고려 지눌입니다."]}}, {"id": "q3_7", "question": "(가) 승려에 대한 설명으로 옳은 것은?", "passage": "(가) 은/는 당나라에서 지엄에게 화엄학을 배우고 귀국하여 영주에 부석사를 창건하였다. 그는 '하나가 곧 전체요, 전체가 곧 하나(일즉다 다즉일)'라는 조화의 논리를 담은 <화엄일승법계도>를 저술하였다.", "options": ["① 아미타 신앙을 전파하며 무애가를 불렀다.", "② 현세의 고난을 구제해 주는 관음 신앙을 이끌었다.", "③ 6두품 출신으로 진성여왕에게 시무 10조를 올렸다.", "④ 인도의 5천축국을 여행하고 기행문을 작성하였다.", "⑤ <삼국유사>를 저술하여 단군 신화를 수록하였다."], "answer": 2, "explanation": {"summary": "부석사 창건과 <화엄일승법계도>, 일즉다 다즉일은 화엄종을 개창한 '의상'입니다.", "choices": ["① 오답: 아미타 신앙과 무애가는 원효입니다.", "② 정답: 의상은 관세음보살의 자비로 현세의 어려움을 구원받는 '관음 신앙'을 전파하고 낙산사를 창건했습니다.", "③ 오답: 시무 10조는 최치원입니다.", "④ 오답: <왕오천축국전>은 혜초입니다.", "⑤ 오답: <삼국유사>는 고려 일연입니다."]}}, {"id": "q3_8", "question": "다음 인물에 대한 설명으로 옳은 것은?", "passage": "신라 6두품 출신으로 12세에 당에 유학하여 빈공과에 급제하였다. 당에서 '황소의 난'이 일어나자 <토황소격문>을 지어 문장가로 명성을 떨쳤으며, 귀국 후 진성여왕에게 개혁안인 시무 10조를 건의하였으나 진골 귀족의 반대로 좌절되었다.", "options": ["① 설총", "② 강수", "③ 김대문", "④ 최치원", "⑤ 최승로"], "answer": 4, "explanation": {"summary": "당 빈공과 급제, <토황소격문>, 진성여왕 시무 10조는 신라 하대 대표적 6두품 학자 '최치원'입니다.", "choices": ["① 오답: 설총은 이두 정리와 <화왕계>입니다.", "② 오답: 강수는 외교 문서 작성의 달인입니다.", "③ 오답: 김대문은 <화랑세기>, <계림잡전> 저술입니다.", "④ 정답: 최치원은 개혁 좌절 후 가야산 해인사에 은거하며 신라 사회를 비판했습니다.", "⑤ 오답: 최승로는 고려 성종에게 시무 28조를 올린 학자입니다."]}}, {"id": "q3_9", "question": "다음 가상 인터뷰에 등장하는 발해 국왕의 재위 시기에 있었던 사실로 옳은 것은?", "passage": "기자: 전하께서 장문휴 장군에게 명하여 바다 건너 당의 등주를 공격하게 하신 이유는 무엇입니까?\n국왕: 당이 흑수말갈과 내통하여 우리를 압박하려 하였소. 또한 우리는 독자적으로 '인안'이라는 연호를 제정하여 대등한 자주 국가임을 만천하에 선포하였소.", "options": ["① 3성 6부의 중앙 관제를 완비하고 상경으로 도읍을 옮겼다.", "② 거란의 침략을 받아 홀한성이 함락되고 멸망하였다.", "③ 5경 15부 62주의 지방 제도를 완비하고 해동성국이라 불렸다.", "④ 장문휴를 파견하여 산둥반도의 등주를 기습 공격하였다.", "⑤ 동모산 기슭에 도읍을 정하고 국호를 진국이라 하였다."], "answer": 4, "explanation": {"summary": "장문휴의 등주 공격과 독자 연호 '인안'을 사용한 발해 국왕은 '무왕(대무예)'입니다.", "choices": ["① 오답: 3성 6부제 완비와 상경 천도는 문왕입니다.", "② 오답: 거란 침략 멸망은 926년 애왕 때입니다.", "③ 오답: 5경 15부 62주와 해동성국은 선왕입니다.", "④ 정답: 무왕은 당과 대립하며 장문휴 수군을 보내 당의 산둥반도 등주를 선제 공격했습니다.", "⑤ 오답: 동모산 건국은 고왕 대조영입니다."]}}, {"id": "q3_10", "question": "발해 (가) 국왕의 업적으로 옳은 것은?", "passage": "발해의 (가) 은/는 '대흥'이라는 연호를 사용하며 당나라와 친선 관계를 맺고 선진 문물을 적극 수용하였다. 중앙 관제를 3성 6부제로 정비하고, 수도를 중경에서 상경 용천부로 옮겼으며, 신라와의 교통로인 신라도를 개설하였다.", "options": ["① 최고 교육 기관인 주자감을 설치하여 유학을 장려하였다.", "② 일본에 보낸 국서에 '고려국왕'이라 자칭하며 당을 견제하였다.", "③ 대부분의 말갈족을 복속시키고 최대 영토를 확보하였다.", "④ 동모산에 도읍을 정하고 진국을 건국하였다.", "⑤ 거란의 침략으로 멸망하여 세자 대광현이 고려로 망명하였다."], "answer": 1, "explanation": {"summary": "연호 '대흥', 당과의 친선, 3성 6부제 정비, 상경 천도, 신라도 개설은 발해 '문왕(대흠무)'입니다.", "choices": ["① 정답: 문왕은 당의 문물을 수용하여 최고 교육 기관인 '주자감'을 설치하고 통치 체제를 완비했습니다.", "② 오답: 당을 견제하며 등주를 공격한 왕은 무왕입니다.", "③ 오답: 최대 영토 확보와 해동성국은 선왕입니다.", "④ 오답: 진국 건국은 고왕 대조영입니다.", "⑤ 오답: 발해 멸망은 926년 애왕 때입니다."]}}, {"id": "q3_11", "question": "다음 설명에 해당하는 발해의 국왕은?", "passage": "• 연호로 '건흥'을 사용하였다.\n• 북쪽의 흑수말갈을 비롯한 대부분의 말갈족을 복속시켜 최대 영토를 확보하였다.\n• 지방 행정 구역을 5경 15부 62주로 완비하였으며, 당나라로부터 '해동성국(바다 동쪽의 번성한 나라)'이라 불렸다.", "options": ["① 고왕 (대조영)", "② 무왕 (대무예)", "③ 문왕 (대흠무)", "④ 선왕 (대인수)", "⑤ 애왕 (대인선)"], "answer": 4, "explanation": {"summary": "연호 건흥, 5경 15부 62주 완비, 최대 영토, 해동성국 칭호는 발해 전성기 '선왕(대인수)'입니다.", "choices": ["① 오답: 고왕은 건국자입니다.", "② 오답: 무왕은 인안 연호, 등주 공격입니다.", "③ 오답: 문왕은 대흥 연호, 상경 천도입니다.", "④ 정답: 선왕 때 발해는 전성기를 구가하며 중국으로부터 해동성국이라 칭송받았습니다.", "⑤ 오답: 애왕은 발해의 마지막 왕입니다."]}}, {"id": "q3_12", "question": "발해가 고구려를 계승한 국가임을 보여 주는 근거로 옳지 않은 것은?", "passage": "발해는 고구려 유민인 대조영이 지배층을 형성하고 말갈족을 아울러 건국한 국가로, 정치·외교·문화 전반에 걸쳐 고구려 계승 의식을 뚜렷이 드러내었다.", "options": ["① 일본에 보낸 국서에 스스로 '고려(고구려) 국왕'이라 칭하였다.", "② 정혜공주 묘가 고구려 양식인 굴식 돌방무덤과 모줄임 천장 구조로 되어 있다.", "③ 상경성 궁궐 터에서 고구려의 전통 난방 시설인 온돌 장치가 발견되었다.", "④ 연꽃무늬 수막새 기와와 이불병좌상 등 불교 미술이 고구려 양식을 계승하였다.", "⑤ 3성 6부제 중 정당성이 행정의 중심을 맡고 6부를 좌사정과 우사정으로 이원화하였다."], "answer": 5, "explanation": {"summary": "정당성 중심의 3성 6부제와 6부의 이원적 운영은 '당나라 제도를 발해 실정에 맞게 독자적으로 변용'한 것이지, 고구려 계승의 직접적 근거는 아닙니다.", "choices": ["① 옳음: 외교 문서에서 고구려 계승을 공식 천명했습니다.", "② 옳음: 정혜공주 묘의 굴식 돌방무덤·모줄임 천장은 고구려 무덤 양식입니다.", "③ 옳음: 온돌 난방과 치미 등은 고구려 건축 문화의 계승입니다.", "④ 옳음: 연꽃무늬 기와와 이불병좌상 역시 고구려 양식입니다.", "⑤ 정답(옳지 않음): 3성 6부제의 독자적 운영은 당의 관제를 수용·변형한 발해 정치 체제의 독자성을 보여줍니다."]}}]}, {"id": "era4", "name": "4. 고려 시대", "tag": "출제 4~5문항", "period": "918년 ~ 1392년 (조선 건국 전까지)", "summary": "태조·광종·성종의 기틀 정비, 도병마사와 식목도감 등 통치체제, 거란·여진·몽골의 대외 항쟁사, 무신정권(최씨 정권), 공민왕의 반원 개혁, 그리고 의천과 지눌의 불교 사상을 완벽 정리해야 합니다.", "theory": {"tables": [{"title": "고려 대외 항쟁사 4단계 (침략과 격퇴)", "headers": ["외세", "시기", "원인 및 발단", "주요 격전지와 영웅", "결과 및 영향"], "rows": [["거란 (1차)", "10세기 말 (성종)", "고려의 친송북진 정책", "서희의 외교 담판 (소손녕과 담판)", "피 한 방울 안 묻히고 '강동 6주' 획득"], ["거란 (2·3차)", "11세기 초 (현종)", "강조의 정변 구실", "양규의 선전(2차) / 강감찬의 귀주 대첩(3차)", "개경에 나성 축조, 압록강~도련포에 천리장성 축조"], ["여진", "12세기 초 (예종)", "여진족 성장과 국경 침략", "윤관의 별무반(신기·신보·항마군)", "여진을 몰아내고 동북 9성 축조 (이후 환부)"], ["몽골", "13세기 (고종)", "저고여 피살 사건 구실", "처인성 전투(김윤후-살리타 사살), 충주성 전투", "강화도 천도 장기 항전, 팔만대장경 조판, 황룡사 9층 목탑 소실, 개경 환도 반발 삼별초 항쟁"]]}, {"title": "공민왕의 반원 개혁 정치 핵심 정리", "headers": ["분야", "개혁 정책 내용", "목적 및 의의"], "rows": [["반원 자주책", "기철 등 친원 세력 숙청, 정동행성 이문소 폐지, 몽골풍(변발·호복) 폐지, 관제 복구", "원나라의 간섭을 완전히 벗어나 고려의 자주권 회복"], ["영토 회복", "유인우, 이자춘 등을 파견하여 쌍성총관부 무력 수복", "철령 이북의 영토를 되찾고 압록강 너머까지 진출"], ["왕권 강화 및 민생", "신돈 등용 ➔ 전민변정도감 설치", "권문세족이 불법으로 빼앗은 토지를 본래 주인에게 돌려주고 억울하게 노비가 된 백성을 양인으로 해방"]]}], "killer_records": [{"title": "사료 1: 서희의 소손녕 외교 담판 (고려사)", "text": "소손녕이 이르기를 '너희 나라는 신라 땅에서 일어났고 고구려 땅은 우리 영토인데 너희가 침식하였다.' 하니 서희가 대답하기를 '그렇지 않다. 우리는 고구려를 계승하여 국호를 고려라 하였고 평양을 서경으로 삼았다... 만약 여진을 몰아내고 우리의 옛 땅을 되찾아 도로를 통하게 해 준다면 어찌 국교를 맺지 않겠는가?'"}, {"title": "사료 2: 지눌의 권수정혜결사문 (수선사 결사)", "text": "땅에서 넘어진 자는 땅을 짚고 일어나야 하듯이, 마음을 어지럽힌 자는 마음을 닦아 깨달아야 한다. 마땅히 명예와 이익을 버리고 산림에 은둔하여 결사를 맺고, 함께 정혜(定慧)를 닦고 경전을 읽으며 참선에 힘쓰자."}], "mnemonics": ["💡 고려 침략 외세 순서: [거 ➔ 여 ➔ 몽 ➔ 홍·왜] ➔ 거란 ➔ 여진 ➔ 몽골 ➔ 홍건적·왜구", "💡 고려 불교 승려 비교: [의천 - 교관겸수 / 천태종] vs [지눌 - 정혜쌍수, 돈오점수 / 조계종, 수선사결사]"]}, "questions": [{"id": "q4_1", "question": "다음 정책을 추진한 고려 국왕에 대한 설명으로 옳은 것은?", "passage": "• 지방 호족을 포섭하기 위해 정략결혼과 왕씨 성을 내리는 사성 정책을 펼쳤다.\n• 호족을 견제하기 위해 사심관 제도와 기인 제도를 처음 시행하였다.\n• 흉년에 백성을 구제하기 위해 흑창을 설치하고 조세를 1/10로 낮추었다.", "options": ["① 후대 왕들이 지켜야 할 훈요 10조와 정계·계백료서를 남겼다.", "② 쌍기의 건의를 받아들여 과거제를 처음 실시하였다.", "③ 최승로의 시무 28조를 수용하여 12목에 지방관을 파견하였다.", "④ 신돈을 등용하여 전민변정도감을 설치하였다.", "⑤ 윤관에게 별무반을 편성하게 하여 여진을 정벌하였다."], "answer": 1, "explanation": {"summary": "호족 통합(혼인·사성), 사심관·기인 제도, 흑창 설치는 고려 건국자 '태조 왕건'입니다.", "choices": ["① 정답: 태조 왕건은 후대 왕들의 통치 지침인 훈요 10조와 관리의 규범인 정계·계백료서를 남겼습니다.", "② 오답: 과거제 도입은 광종입니다.", "③ 오답: 최승로 시무 28조와 12목 설치는 성종입니다.", "④ 오답: 전민변정도감 설치는 공민왕입니다.", "⑤ 오답: 별무반과 여진 정벌은 숙종~예종입니다."]}}, {"id": "q4_2", "question": "다음 정책을 추진한 고려 국왕에 대한 설명으로 옳은 것은?", "passage": "• 쌍기의 건의를 받아들여 시험을 통해 관리를 선발하는 과거제를 처음 도입하였다.\n• 불법으로 노비가 된 자를 양인으로 해방하는 노비안검법을 실시하였다.\n• 백관의 공복을 제정하고 '광덕', '준풍'이라는 독자 연호를 사용하였다.", "options": ["① 최승로의 시무 28조를 수용하여 12목에 지방관을 파견하였다.", "② 훈요 10조를 남겨 후대 왕들이 지켜야 할 정책 지침을 제시하였다.", "③ 과감한 개혁을 단행하여 왕권을 강화하고 호족 세력을 숙청한 광종이다.", "④ 신돈을 등용하고 전민변정도감을 설치하여 권문세족을 억압하였다.", "⑤ 전시과 제도를 처음 제정하여 관리들에게 토지를 지급하였다."], "answer": 3, "explanation": {"summary": "과거제 최초 도입, 노비안검법 실시, 백관 공복 제정, 광덕·준풍 연호는 '광종'입니다.", "choices": ["① 오답: 성종입니다.", "② 오답: 태조 왕건입니다.", "③ 정답: 광종은 노비안검법으로 호족의 경제·군사력을 약화시키고 과거제로 신진 관료를 등용해 왕권을 확립했습니다.", "④ 오답: 공민왕입니다.", "⑤ 오답: 시정 전시과 최초 제정은 경종(976년)입니다."]}}, {"id": "q4_3", "question": "다음 건의문을 수용한 고려 국왕의 업적으로 옳은 것은?", "passage": "제7조, 청컨대 외관(지방관)을 두소서... 제13조, 우리나라에서는 봄에는 연등회를 열고 겨울에는 팔관회를 열어 백성의 노고가 크니 이를 줄이소서... 불교는 수신의 근본이요 유교는 치국의 근원이니 유교 정치를 힘써 행하소서.", "options": ["① 전국 12목에 처음으로 지방관을 파견하고 2성 6부제를 확립하였다.", "② 노비안검법을 실시하여 국가 재정 기반을 확충하였다.", "③ 강화도로 수도를 천도하여 몽골에 장기 항전하였다.", "④ 쌍성총관부를 무력으로 수복하여 철령 이북을 되찾았다.", "⑤ 서경을 중시하며 북진 정책을 적극 추진하였다."], "answer": 1, "explanation": {"summary": "제시된 사료는 최승로의 '시무 28조'이며 이를 수용한 왕은 고려 '성종'입니다.", "choices": ["① 정답: 성종은 최승로의 건의를 받아들여 유교 정치 이념을 확립하고, 12목에 지방관을 처음 파견했으며 국자감과 의창·상평창을 정비했습니다.", "② 오답: 노비안검법은 광종입니다.", "③ 오답: 강화도 천도는 고종(최우 무신정권기)입니다.", "④ 오답: 쌍성총관부 수복은 공민왕입니다.", "⑤ 오답: 서경 중시 북진 정책의 시초는 태조 왕건입니다."]}}, {"id": "q4_4", "question": "고려 중앙 정치 기구의 기능과 특징에 대한 설명으로 옳은 것은?", "passage": "고려는 당나라의 3성 6부제를 수용하되 실정에 맞게 2성 6부제로 변용하고, 중추원·어사대·삼사 및 독자적인 합좌 기구를 운영하였다.", "options": ["① 삼사는 언론 기능을 담당하며 왕의 잘못을 간쟁하였다.", "② 도병마사와 식목도감은 고려의 독자적인 귀족 회의 기구였다.", "③ 상서성은 국정을 총괄하고 재신과 낭사로 구성되었다.", "④ 중추원은 관리의 비리를 감찰하고 풍속을 교정하였다.", "⑤ 어사대는 왕명의 출납과 군사 기밀을 전담하였다."], "answer": 2, "explanation": {"summary": "고려의 도병마사(국방·군사)와 식목도감(법제·격식)은 중서문하성의 재신과 중추원의 추밀이 모여 회의하는 고려 독자 기구입니다.", "choices": ["① 오답: 고려의 삼사는 화폐·곡식의 출납 회계 기구입니다. (언론 3사는 조선 시대!)", "② 정답: 도병마사와 식목도감은 당의 제도가 아닌 고려만의 독자적 귀족 합좌 기구입니다.", "③ 오답: 국정 총괄과 재신·낭사는 '중서문하성'입니다. 상서성은 6부를 거느린 집행 기구입니다.", "④ 오답: 관리 감찰은 '어사대'입니다.", "⑤ 오답: 왕명 출납과 군사 기밀은 '중추원'입니다."]}}, {"id": "q4_5", "question": "다음 외교 담판의 결과로 고려가 얻은 성과는?", "passage": "소손녕이 이르기를 '너희 나라는 신라 땅에서 일어났고 고구려 땅은 우리 영토인데 너희가 침식하였다.' 하니 고려 사신이 답하기를 '그렇지 않다. 우리는 고구려를 계승하여 국호를 고려라 하였고 평양을 서경으로 삼았다. 여진이 길을 막아 송과만 통했을 뿐이니 여진을 몰아내면 교류하겠다.' 하였다.", "options": ["① 압록강 동쪽의 강동 6주를 확보하였다.", "② 윤관이 여진을 몰아내고 동북 9성을 축조하였다.", "③ 거란군을 귀주에서 크게 무찔렀다.", "④ 몽골과 화의를 맺고 개경으로 환도하였다.", "⑤ 원나라로부터 쌍성총관부를 돌려받았다."], "answer": 1, "explanation": {"summary": "거란 1차 침입(993년) 당시 서희와 소손녕의 외교 담판 사료입니다.", "choices": ["① 정답: 서희는 외교 담판으로 거란군을 철수시키고 압록강 동쪽의 전략 요충지인 '강동 6주'를 확보했습니다.", "② 오답: 동북 9성 축조는 12세기 예종 때 윤관입니다.", "③ 오답: 귀주 대첩은 3차 침입(1019년) 강감찬입니다.", "④ 오답: 개경 환도는 1270년 원종 때입니다.", "⑤ 오답: 쌍성총관부 수복은 14세기 공민왕입니다."]}}, {"id": "q4_6", "question": "다음 부대의 활약과 관련된 대외 항쟁으로 옳은 것은?", "passage": "고려 숙종 때 여진족의 기병에 대항하기 위해 윤관의 건의로 창설된 특수 부대로, 기병인 신기군, 보병인 신보군, 승려 부대인 항마군으로 편성되었다.", "options": ["① 거란의 3차 침입을 귀주에서 격퇴하였다.", "② 여진을 정벌하고 동북 9성을 축조하였다.", "③ 몽골군에 맞서 처인성에서 살리타를 사살하였다.", "④ 진도와 제주도로 옮겨 가며 대몽 항쟁을 이어갔다.", "⑤ 왜구의 소굴인 쓰시마섬을 토벌하였다."], "answer": 2, "explanation": {"summary": "신기군·신보군·항마군으로 구성된 부대는 윤관의 '별무반'입니다.", "choices": ["① 오답: 귀주 대첩은 강감찬입니다.", "② 정답: 예종 때 윤관은 별무반을 이끌고 여진을 정벌한 뒤 동북 9성을 쌓았습니다(이후 방어 곤란 및 여진 간청으로 환부).", "③ 오답: 처인성 살리타 사살은 김윤후입니다.", "④ 오답: 진도·제주 대몽 항쟁은 삼별초입니다.", "⑤ 오답: 쓰시마섬 토벌은 고려 말 박위(창왕) 및 조선 세종 이종무입니다."]}}, {"id": "q4_7", "question": "다음 주장을 내세우며 일어난 운동에 대한 설명으로 옳은 것은?", "passage": "개경의 지덕은 이미 쇠하였으니 서경(평양)의 임원역으로 수도를 옮겨야 합니다. 또한 스스로 황제라 칭하고 독자 연호를 세우며(칭제건원), 금나라를 정벌해야 천하가 복종할 것입니다.", "options": ["① 김부식이 이끄는 개경파 관군에 의해 진압되었다.", "② 이자겸이 척준경과 함께 궁궐을 불태우며 일으킨 난이다.", "③ 최충헌의 독재에 반발하여 노비 만적이 일으킨 봉기이다.", "④ 정중부와 이의방 등 무신들이 문신들을 제거한 정변이다.", "⑤ 공주 명학소의 백성들이 차별에 항거해 일으킨 봉기이다."], "answer": 1, "explanation": {"summary": "서경 천도, 칭제건원, 금국 정벌을 주장한 사건은 인종 때 '묘청의 서경 천도 운동(1135년)'입니다.", "choices": ["① 정답: 묘청 등이 국호를 '대위', 연호를 '천개'라 하며 반란을 일으켰으나 김부식이 이끄는 관군에 의해 진압되었습니다.", "② 오답: 이자겸의 난(1126년)은 문벌귀족 외척의 난입니다.", "③ 오답: 만적의 난(1198년)은 무신정권기 신분 해방 운동입니다.", "④ 오답: 무신정변(1170년)입니다.", "⑤ 오답: 망이·망소이의 난(1176년)입니다."]}}, {"id": "q4_8", "question": "고려 무신 집권기 최씨 정권(최충헌·최우)이 설치한 권력 기구를 옳게 연결한 것은?", "passage": "최충헌은 정권을 장악한 뒤 기존의 중방 대신 새로운 최고 권력 기구를 세웠고, 그의 아들 최우는 자신의 집에 인사 행정 기구와 문신 숙위 기구를 설치하였다.", "options": ["① 교정도감 - 정방 - 서방", "② 도병마사 - 식목도감 - 삼사", "③ 비변사 - 훈련도감 - 규장각", "④ 정동행성 - 전민변정도감 - 사심관", "⑤ 중서문하성 - 중추원 - 어사대"], "answer": 1, "explanation": {"summary": "최충헌은 '교정도감(최고 권력 기구)', 최우는 '정방(인사권 장악)'과 '서방(문신 등용·숙위)' 및 '삼별초'를 설치했습니다.", "choices": ["① 정답: 교정도감(최충헌), 정방·서방(최우)이 최씨 무신 정권의 핵심 통치 기구입니다.", "② 오답: 고려 초기 중앙 관제입니다.", "③ 오답: 조선 후기 기구입니다.", "④ 오답: 원 간섭기·공민왕·태조 시기 기구입니다.", "⑤ 오답: 고려의 기본 중앙 관제입니다."]}}, {"id": "q4_9", "question": "몽골의 침략에 맞선 고려의 대몽 항쟁에 대한 설명으로 옳지 않은 것은?", "passage": "고려 최우 정권은 1232년 수도를 강화도로 옮기고 약 40년간 몽골에 항전하였다.", "options": ["① 김윤후와 처인 부곡민들은 처인성에서 몽골 장수 살리타를 사살하였다.", "② 부처의 힘으로 몽골군을 물리치고자 팔만대장경을 조판하였다.", "③ 몽골의 침입 과정에서 경주 황룡사 9층 목탑과 초조대장경이 불타 소실되었다.", "④ 정부가 몽골과 강화하고 개경으로 환도하자 삼별초가 진도와 제주도에서 끝까지 항전하였다.", "⑤ 삼별초의 항쟁은 김윤후의 지휘 아래 충주성에서 최종 승리를 거두며 막을 내렸다."], "answer": 5, "explanation": {"summary": "삼별초는 배중손(진도)과 김통정(제주 항파두리)의 지휘 아래 항전하다 여·몽 연합군에 의해 진압되었습니다.", "choices": ["① 옳음: 김윤후의 처인성 전투(1232년) 승리입니다.", "② 옳음: 강화도에서 재조대장경(팔만대장경)을 완성했습니다.", "③ 옳음: 대구 부인사의 초조대장경과 경주 황룡사 9층 목탑이 몽골 침략 때 소실되었습니다.", "④ 옳음: 개경 환도(1270년)에 반발해 삼별초가 강화도 ➔ 진도 ➔ 제주도로 이동하며 항전했습니다.", "⑤ 정답(옳지 않음): 삼별초는 배중손·김통정이 이끌었으며 최종적으로 제주도에서 여·몽 연합군에게 진압되었습니다."]}}, {"id": "q4_10", "question": "다음 자료의 상황이 나타난 시기의 고려 사회 모습으로 가장 적절한 것은?", "passage": "공민왕이 신돈을 기용하여 권세가들이 빼앗은 토지와 노비를 본래대로 바로잡고자 전민변정도감을 두었다. 신돈이 방을 붙이기를 '권세가가 빼앗은 토지는 주인에게 돌려주고 억울하게 노비가 된 자는 양인으로 풀어주겠다'고 하니 기뻐 날뛰는 백성들이 많았다.", "options": ["① 권문세족이 도평의사사를 장악하고 대농장을 경영하였다.", "② 성종의 명으로 전국 12목에 처음으로 목사가 파견되었다.", "③ 묘청이 서경 천도를 주장하며 반란을 일으켰다.", "④ 윤관이 신기군, 신보군, 항마군으로 구성된 별무반을 이끌었다.", "⑤ 강화도에서 몽골에 대항하여 팔만대장경판을 조판하였다."], "answer": 1, "explanation": {"summary": "원 간섭기 권문세족의 폐단을 혁파하기 위해 공민왕과 신돈이 설치한 '전민변정도감'입니다.", "choices": ["① 정답: 원 간섭기 친원파 권문세족은 도평의사사를 독점하고 불법으로 토지와 노비를 겸병해 대농장을 경영했습니다.", "② 오답: 10세기 말 성종 시기입니다.", "③ 오답: 12세기 인종 시기입니다.", "④ 오답: 12세기 예종 시기입니다.", "⑤ 오답: 13세기 고종 대몽항쟁기입니다."]}}, {"id": "q4_11", "question": "다음 두 승려 (가), (나)의 불교 사상을 옳게 연결한 것은?", "passage": "(가) 문종의 왕자로, 교종을 중심으로 선종을 통합하고자 해동 천태종을 개창하고 이론과 실천을 함께 강조하는 '교관겸수'를 주장하였다.\n(나) 무신 집권기에 불교계의 타락을 비판하며 송광사에서 수선사 결사를 주도하고, 선종 중심으로 교종을 통합하는 '정혜쌍수'와 '돈오점수'를 주장하였다.", "options": ["① (가) 원효 - (나) 의상", "② (가) 의천 - (나) 지눌", "③ (가) 지눌 - (나) 의천", "④ (가) 의천 - (나) 혜심", "⑤ (가) 일연 - (나) 지눌"], "answer": 2, "explanation": {"summary": "(가)는 대각국사 의천(교관겸수, 천태종), (나)는 보조국사 지눌(정혜쌍수, 돈오점수, 수선사 결사, 조계종)입니다.", "choices": ["① 오답: 원효와 의상은 통일신라 승려입니다.", "② 정답: 고려 중기 의천(교종 중심 통합)과 무신정권기 지눌(선종 중심 통합)은 한능검 단골 비교 출제 포인트입니다.", "③ 오답: 순서가 반대로 되어 있습니다.", "④ 오답: 혜심은 지눌의 제자로 유불일치설을 주장했습니다.", "⑤ 오답: 일연은 <삼국유사> 저자입니다."]}}, {"id": "q4_12", "question": "고려 시대의 문화유산과 역사서에 대한 설명으로 옳은 것은?", "passage": "고려는 귀족 문화와 불교 문화가 융합되어 독창적인 인쇄술, 청자, 그리고 다양한 역사서가 편찬되었다.", "options": ["① 김부식은 <삼국유사>를 편찬하여 단군 신화를 최초로 기록하였다.", "② 현존하는 세계 최고의 금속 활자본은 청주 흥덕사에서 간행된 <직지심체요절>이다.", "③ 일연이 편찬한 <삼국사기>는 현존하는 우리나라 가장 오래된 관찬 역사서이다.", "④ 이규보는 <제왕운기>를 지어 발해사를 우리 역사에 처음으로 포함시켰다.", "⑤ 고려 말기에는 흙으로 빚어 흰 유약을 바른 백자가 귀족들 사이에서 유행하였다."], "answer": 2, "explanation": {"summary": "1377년 청주 흥덕사에서 인쇄된 <직지심체요절>은 유네스코 세계기록유산이자 현존 세계 최고(最古)의 금속 활자본입니다.", "choices": ["① 오답: <삼국유사>와 단군 신화 수록은 일연입니다. 김부식은 <삼국사기>입니다.", "② 정답: <직지심체요절>은 구텐베르크 성경보다 78년 앞선 세계 최고의 금속 활자 인쇄물입니다.", "③ 오답: <삼국사기>는 김부식이 인종의 명으로 편찬한 기전체 정사입니다.", "④ 오답: <제왕운기>는 이승휴입니다. 이규보는 <동명왕편>을 지었습니다.", "⑤ 오답: 고려를 대표하는 도자기는 '비색 청자'와 '상감 청자'입니다. 백자는 조선 시대입니다."]}}]}, {"id": "era5", "name": "5. 조선 전기", "tag": "출제 4문항", "period": "1392년 ~ 1637년 (조선 건국 ~ 병자호란)", "summary": "태종·세종·세조·성종의 통치 체제 정비, 3사의 언론 기능, 4대 사화(무오·갑자·기묘·을사), 붕당의 발생과 임진왜란·병자호란의 격전지와 전개 과정을 체계적으로 학습해야 합니다.", "theory": {"tables": [{"title": "조선 초기 4대 국왕의 정치 및 제도 완비", "headers": ["국왕", "권력 구조", "핵심 제도 및 국방", "문화 및 편찬 사업"], "rows": [["태종 (이방원)", "6조 직계제 단행 (왕권 강화)", "사병 혁파, 호패법 실시(조세·군역 확보), 신문고 설치", "주자소 설치, 계미자 주조"], ["세종대왕", "의정부 서사제 (왕권과 신권 조화)", "집현전 설치, 4군 6진 개척(최윤덕·김종서), 공법(전분6등·연분9등)", "훈민정음 창제, 칠정산, 농사직설, 자격루, 측우기, 갑인자"], ["세조 (수양대군)", "6조 직계제 부활", "집현전·경연 폐지, 직전법 실시(현직 관리에게만 과전 지급)", "경국대전 편찬 시작"], ["성종", "홍문관(옥당) 설치, 경연 활성화", "사림파(김종직 등) 대거 등용하여 훈구 견제", "경국대전 완성 및 반포, 국조오례의, 동국여지승람, 악학궤범"]]}, {"title": "4대 사화 (훈구 vs 사림의 대립)", "headers": ["사화명", "시기(왕)", "발단 및 직접적 원인", "결과 및 영향"], "rows": [["무오사화 (1498)", "연산군", "김일손의 사초에 실린 김종직의 <조의제문>(세조의 단종 찬탈 비판)", "김일손 처형, 김종직 부관참시 등 영남 사림 대거 피화"], ["갑자사화 (1504)", "연산군", "폐비 윤씨 사사 사건의 전말 폭로", "사림뿐만 아니라 훈구 대신들까지 대대적으로 숙청됨"], ["기묘사화 (1519)", "중종", "조광조의 도학 개혁(현량과, 소격서 폐지, 공납 개혁, 위훈삭제)에 훈구 반발", "'주초위왕(走肖爲王)' 모함으로 조광조 사사, 개혁 좌절"], ["을사사화 (1545)", "명종", "외척 간의 권력 다툼(대윤 윤임 vs 소윤 윤원형)", "윤임 일파와 이에 연루된 사림 세력이 대거 화를 입음"]]}], "killer_records": [{"title": "사료 1: 김종직의 조의제문 (무오사화)", "text": "정축년 10월 어느 날... 꿈에 칠척이나 되는 거인이 헌걸찬 모습으로 와서 말하기를 '나는 초나라 회왕 손심인데 항우에게 살해당하여 침강에 던져졌다' 하고는 사라졌다... 내가 가만히 생각해보니 회왕은 억울하게 죽은 것이로다. 내 붓을 들어 조문하는 글을 짓노라."}, {"title": "사료 2: 조광조의 개혁 상소 (기묘사화)", "text": "현량과를 설치하여 널리 어진 인재를 뽑아 쓰소서... 소격서는 도교의 제사를 지내는 곳으로 이단에 해당하니 속히 혁파하여 유학의 바른 도리를 바로잡으소서... 중종반정 공신 중 공이 없으면서 훈록을 받은 자의 거짓 훈작(위훈)을 삭제하소서."}], "mnemonics": ["💡 4대 사화 순서: [무 ➔ 갑 ➔ 기 ➔ 을] (무오 ➔ 갑자 ➔ 기묘 ➔ 을사)", "💡 조선의 3사: [사헌부(감찰) + 사간원(간쟁) + 홍문관(경연/서적)] ➔ 언론 3사로 권력 독점 방지"]}, "questions": [{"id": "q5_1", "question": "조선 건국의 설계자 역할을 수행한 (가) 인물에 대한 설명으로 옳은 것은?", "passage": "(가) 은/는 이성계를 도와 조선을 건국하고 한양 도성의 궁궐과 사대문 이름을 지었다. 그는 <조선경국전>을 저술하여 재상 중심의 정치 체제를 구상하였고, <불씨잡변>을 지어 불교를 비판하고 성리학을 통치 이념으로 확립하였다.", "options": ["① 정몽주", "② 정도전", "③ 조준", "④ 하륜", "⑤ 황희"], "answer": 2, "explanation": {"summary": "<조선경국전>, <불씨잡변>, 재상 중심 정치론은 조선 건국의 설계자 삼봉 '정도전'입니다.", "choices": ["① 오답: 정몽주는 고려를 지키려 한 온건파 사대부입니다.", "② 정답: 정도전은 재상 중심의 정치를 추구하다가 왕권 강화를 노린 이방원(태종)에 의해 제1차 왕자의 난 때 제거되었습니다.", "③ 오답: 조준은 과전법 제정을 주도했습니다.", "④ 오답: 하륜은 태종 이방원의 최측근입니다.", "⑤ 오답: 황희는 세종 때 영의정입니다."]}}, {"id": "q5_2", "question": "다음 정책을 시행한 조선의 국왕에 대한 설명으로 옳은 것은?", "passage": "• 의정부의 권한을 줄이고 6조 판서가 국왕에게 직접 보고하는 6조 직계제를 처음 실시하였다.\n• 백성들의 억울함을 직접 호소할 수 있도록 신문고를 설치하였다.\n• 16세 이상 모든 남성에게 호패를 발급하는 호패법을 시행하였다.", "options": ["① 경국대전을 완성하여 반포하였다.", "② 집현전을 확대 개편하고 훈민정음을 창제하였다.", "③ 과전의 부족을 해결하고자 직전법을 단행하였다.", "④ 사병을 혁파하고 왕권을 강화한 태종이다.", "⑤ 금난전권을 철폐하는 신해통공을 단행하였다."], "answer": 4, "explanation": {"summary": "6조 직계제 최초 시행, 신문고 설치, 호패법 실시는 조선 3대 국왕 '태종(이방원)'입니다.", "choices": ["① 오답: 경국대전 완성은 성종입니다.", "② 오답: 집현전과 훈민정음은 세종입니다.", "③ 오답: 직전법은 세조입니다.", "④ 정답: 태종은 사병을 혁파하고 양전 사업과 호패법을 실시해 국가 재정과 왕권을 탄탄히 다졌습니다.", "⑤ 오답: 신해통공은 정조입니다."]}}, {"id": "q5_3", "question": "조선 세종 대왕 시기의 업적으로 옳지 않은 것은?", "passage": "세종은 의정부 서사제를 실시하여 왕권과 신권의 조화를 이루었으며, 집현전을 중심으로 민족 문화의 황금기를 열었다.", "options": ["① 최윤덕과 김종서를 보내 압록강·두만강 유역에 4군 6진을 개척하였다.", "② 풍흉에 따라 연분 9등, 토지 비옥도에 따라 전분 6등으로 세금을 걷는 공법을 제정하였다.", "③ 우리 풍토에 맞는 농법을 정리한 <농사직설>과 역법서 <칠정산>을 편찬하였다.", "④ 장영실을 등용하여 자격루, 혼천의, 앙부일구 등 과학 기구를 제작하였다.", "⑤ 현직 관리에게만 수조권을 지급하고 수신전과 휼양전을 폐지하는 직전법을 실시하였다."], "answer": 5, "explanation": {"summary": "직전법 실시는 세종이 아니라 '세조'의 업적입니다.", "choices": ["① 옳음: 4군 6진 개척으로 오늘날 한반도 국경선이 확정되었습니다.", "② 옳음: 공법(전분6등·연분9등법)은 세종이 여론조사를 거쳐 제정했습니다.", "③ 옳음: <농사직설>과 한양 기준 역법서 <칠정산>은 세종 때 편찬되었습니다.", "④ 옳음: 장영실의 자격루, 앙부일구, 측우기 등이 제작되었습니다.", "⑤ 정답(옳지 않음): 직전법 실시는 세조(1466년)입니다."]}}, {"id": "q5_4", "question": "다음 업적을 남긴 조선 국왕은?", "passage": "• 집현전과 경연을 폐지하고 6조 직계제를 부활시켜 왕권을 강화하였다.\n• 토지 부족 문제를 해결하기 위해 현직 관리에게만 수조권을 주는 직전법을 실시하였다.\n• 조선의 기본 법전인 <경국대전> 편찬을 시작하였다.", "options": ["① 태종", "② 문종", "③ 세조", "④ 성종", "⑤ 중종"], "answer": 3, "explanation": {"summary": "집현전·경연 폐지, 6조 직계제 부활, 직전법 실시, 경국대전 편찬 시작은 '세조(수양대군)'입니다.", "choices": ["① 오답: 태종은 사병 혁파, 호패법, 6조 직계제 최초 시행입니다.", "② 오답: 문종은 세종의 장남입니다.", "③ 정답: 세조는 계유정난으로 집권한 뒤 강력한 왕권 중심 정치를 펼쳤습니다.", "④ 오답: 성종은 홍문관 설치 및 경국대전 완성·반포입니다.", "⑤ 오답: 중종은 조광조 등용과 기묘사화입니다."]}}, {"id": "q5_5", "question": "조선 성종 대에 완성된 통치 체제와 문화 사업에 대한 설명으로 옳은 것은?", "passage": "성종은 훈구 세력을 견제하기 위해 김종직 등 지방 사림을 대거 중앙 정계에 등용하고, 유교적 법치 국가의 기틀을 마무리하였다.", "options": ["① 집현전을 계승한 홍문관을 설치하고 <경국대전>을 완성·반포하였다.", "② 호패법을 처음 실시하여 인구를 파악하였다.", "③ 사림의 근거지인 서원을 대대적으로 철폐하였다.", "④ <속대전>과 <동국문헌비고>를 편찬하였다.", "⑤ <대전통편>과 <무예도보통지>를 간행하였다."], "answer": 1, "explanation": {"summary": "성종은 홍문관(옥당) 설치, <경국대전> 완성·반포(1485), <동국여지승람>, <악학궤범> 편찬으로 조선의 유교적 통치 체제를 완성했습니다.", "choices": ["① 정답: 성종 때 <경국대전>이 최종 반포되어 조선의 영구 법전이 되었고 홍문관이 설치되어 3사 체제가 완성되었습니다.", "② 오답: 호패법 최초 실시는 태종입니다.", "③ 오답: 서원 정리는 영조·흥선대원군입니다.", "④ 오답: <속대전> 편찬은 영조입니다.", "⑤ 오답: <대전통편> 편찬은 정조입니다."]}}, {"id": "q5_6", "question": "조선 중앙 정치 기구 중 권력의 독점과 부정을 막기 위해 언론 기능을 담당한 '3사'에 해당하는 기구로만 옳게 묶인 것은?", "passage": "조선의 3사는 왕과 대신들의 잘못을 비판하고 관리의 임명 동의권(서경권), 간쟁권, 봉박권을 행사하여 권력의 균형을 유지하였다.", "options": ["① 의정부 - 승정원 - 의금부", "② 사헌부 - 사간원 - 홍문관", "③ 승정원 - 춘추관 - 한성부", "④ 사헌부 - 의금부 - 성균관", "⑤ 중서문하성 - 중추원 - 어사대"], "answer": 2, "explanation": {"summary": "조선의 언론 3사는 '사헌부(감찰), 사간원(간쟁), 홍문관(경연·자문)'입니다.", "choices": ["① 오답: 승정원은 왕명 출납(비서실), 의금부는 국왕 직속 사법 기구입니다.", "② 정답: 사헌부, 사간원, 홍문관이 조선의 언론 3사입니다.", "③ 오답: 춘추관은 역사 편찬, 한성부는 수도 행정·치안입니다.", "④ 오답: 성균관은 최고 국립 교육 기관입니다.", "⑤ 오답: 고려의 중앙 관제입니다."]}}, {"id": "q5_7", "question": "다음 글이 발단이 되어 일어난 사화에 대한 설명으로 옳은 것은?", "passage": "꿈에 초나라 회왕이 나타나 항우에게 억울하게 살해당한 원한을 토로하였다. 내 붓을 들어 그 억울함을 조문하는 <조의제문>을 짓노라.", "options": ["① 연산군 때 김일손이 스승 김종직의 글을 사초에 실어 일어난 무오사화이다.", "② 연산군의 생모 폐비 윤씨 사사 사건으로 일어난 갑자사화이다.", "③ 조광조의 급진적 도학 개혁에 반발해 일어난 기묘사화이다.", "④ 명종 때 외척 대윤과 소윤의 대립으로 일어난 을사사화이다.", "⑤ 이조전랑 임명 문제를 두고 동인과 서인이 나뉜 사건이다."], "answer": 1, "explanation": {"summary": "김종직의 <조의제문>(세조의 단종 찬탈을 항우의 의제 살해에 빗댐)이 발단이 된 사화는 1498년 '무오사화'입니다.", "choices": ["① 정답: 김종직의 제자 김일손이 <조의제문>을 사초에 실은 것을 훈구파(유자광·이극돈)가 문제 삼아 무오사화가 일어났습니다.", "② 오답: 갑자사화(1504년)는 폐비 윤씨 사건입니다.", "③ 오답: 기묘사화(1519년)는 조광조의 개혁입니다.", "④ 오답: 을사사화(1545년)는 외척 윤임 vs 윤원형 대립입니다.", "⑤ 오답: 선조 때 붕당의 형성(1575년)입니다."]}}, {"id": "q5_8", "question": "다음 인물이 추진한 개혁 정치에 대한 설명으로 옳은 것은?", "passage": "중종의 신임을 얻은 이 인물은 과거제의 폐단을 보완하기 위해 천거제인 '현량과'를 설치하였다. 또한 도교 사당인 소격서를 폐지하고, 중종반정 공신 중 공이 없는 자의 거짓 훈작을 취소하는 '위훈 삭제'를 추진하다가 숙청되었다.", "options": ["① 성학십도를 저술하여 군주의 덕성을 강조하였다.", "② 기묘사화로 화를 입은 조광조이다.", "③ 만언봉사를 올려 10만 양병설을 주장하였다.", "④ 붕당정치의 폐해를 비판하며 탕평비를 건립하였다.", "⑤ 최초의 서원인 백운동 서원을 건립하였다."], "answer": 2, "explanation": {"summary": "현량과, 소격서 폐지, 위훈 삭제를 추진하다 '주초위왕' 모함으로 숙청된 인물은 '조광조'입니다.", "choices": ["① 오답: <성학십도>는 이황입니다.", "② 정답: 조광조의 급진적 도학 정치는 훈구파의 반격으로 기묘사화(1519년)를 불러왔습니다.", "③ 오답: 10만 양병설은 이이입니다.", "④ 오답: 탕평비 건립은 영조입니다.", "⑤ 오답: 백운동 서원 건립은 주세붕입니다."]}}, {"id": "q5_9", "question": "16세기 조선 성리학을 대표하는 두 거두 이황과 이이에 대한 설명으로 옳은 것은?", "passage": "사림이 정국을 주도하면서 성리학에 대한 철학적 탐구가 깊어져 영남 학파(이황)와 기호 학파(이이)로 발전하였다.", "options": ["① 이황은 <성학집요>를 지어 신하가 왕을 이끌어야 한다고 주장하였다.", "② 이이는 <성학십도>를 지어 군주 스스로 성학을 실천할 것을 강조하였다.", "③ 이황은 이(理)의 근원성을 중시하는 주리론을 발전시켰고 도산 서원에서 제자를 길렀다.", "④ 이이는 <주자서절요>를 저술하고 일본 성리학 발전에 결정적 영향을 주었다.", "⑤ 이황은 수미법과 대동법의 전신인 공납 개혁안 및 10만 양병설을 건의하였다."], "answer": 3, "explanation": {"summary": "이황(주리론, <성학십도>, 도산서원, 일본 성리학 영향) vs 이이(주기론, <성학집요>, <동호문답>, 10만 양병설, 수미법)를 정확히 구별해야 합니다.", "choices": ["① 오답: <성학집요>는 이이입니다.", "② 오답: <성학십도>는 이황입니다.", "③ 정답: 퇴계 이황은 이(理)를 중시하는 주리론을 확립하고 안동 도산 서원에서 영남 학파를 형성했습니다.", "④ 오답: <주자서절요>와 일본 성리학(후지와라 세이카) 영향은 이황입니다.", "⑤ 오답: 수미법과 10만 양병설은 율곡 이이입니다."]}}, {"id": "q5_10", "question": "임진왜란(1592~1598) 중 전개된 주요 전투와 의병 활동에 대한 설명으로 옳지 않은 것은?", "passage": "도요토미 히데요시의 침략으로 시작된 임진왜란에서 조선은 관군과 수군, 의병, 그리고 명나라 지원군의 활약으로 국난을 극복하였다.", "options": ["① 이순신은 한산도 대첩에서 학익진 전법으로 왜 수군을 대파하고 남해 제해권을 장악하였다.", "② 김시민은 진주성 전투에서 왜군을 격퇴하여 전라도 곡창 지대를 지켜내었다.", "③ 권율은 행주산성에서 부녀자들까지 합심한 항전으로 왜군을 크게 물리쳤다.", "④ 곽재우, 조헌, 고경명, 사명대사(유정) 등이 전국 각지에서 의병을 일으켜 활약하였다.", "⑤ 이순신은 명량 대첩에서 전사하며 7년간의 왜란이 완전히 종결되었다."], "answer": 5, "explanation": {"summary": "이순신 장군이 전사하며 왜란이 종결된 마지막 해전은 1598년 '노량 대첩'입니다.", "choices": ["① 옳음: 한산도 대첩(1592)은 학익진으로 제해권을 확보한 대승입니다.", "② 옳음: 김시민의 제1차 진주 대첩(1592)입니다.", "③ 옳음: 권율의 행주 대첩(1593)입니다.", "④ 옳음: 의병장과 승병(서산대사 휴정·사명대사 유정)이 큰 공을 세웠습니다.", "⑤ 정답(옳지 않음): 명량 대첩(1597)은 13척으로 133척을 물리친 승리이며, 이순신 장군이 전사한 마지막 해전은 '노량 대첩(1598)'입니다."]}}, {"id": "q5_11", "question": "광해군의 재위 기간에 추진된 정책으로 옳은 것은?", "passage": "임진왜란 직후 즉위한 광해군은 전후 복구와 민생 안정, 그리고 명과 후금 사이의 실리 외교에 힘썼다.", "options": ["① 친명 배금 정책을 강경하게 추진하여 청의 침략을 초래하였다.", "② 경기도에 대동법을 처음 실시하고 허준의 <동의보감>을 간행하였다.", "③ 효종과 함께 송시열을 등용하여 북벌 운동을 추진하였다.", "④ 병자호란 때 남한산성으로 피란하여 항전하다 삼전도에서 항복하였다.", "⑤ 탕평책을 실시하여 붕당 간의 극심한 대립을 완화하였다."], "answer": 2, "explanation": {"summary": "광해군은 전후 복구(토지대장·호적 정비, 경기도 대동법 최초 시행, <동의보감> 간행)와 명·후금 사이 중립 외교(강홍립 파견)를 펼쳤습니다.", "choices": ["① 오답: 친명 배금 정책은 인조반정 이후 인조와 서인 정권입니다.", "② 정답: 광해군은 1608년 경기도에 대동법을 처음 실시하고, 허준의 <동의보감>을 완성했으며 실리적 중립 외교를 전개했습니다.", "③ 오답: 북벌 운동은 효종과 송시열·이완입니다.", "④ 오답: 남한산성 항전과 삼전도 굴욕은 인조입니다.", "⑤ 오답: 탕평책은 영조·정조입니다."]}}, {"id": "q5_12", "question": "다음 전쟁에 대한 설명으로 옳은 것은?", "passage": "국호를 청(淸)으로 고친 후금이 조선에 군신 관계를 요구해 오자, 조정에서는 주화론(최명길)과 척화론(김상헌)이 격렬히 대립하였다. 결국 척화론이 우세해지자 청 태종이 직접 대군을 이끌고 침략하였고, 인조는 남한산성으로 피란하여 47일간 항전하였다.", "options": ["① 1627년에 일어난 정묘호란으로 형제 관계를 맺고 끝났다.", "② 1636년에 일어난 병자호란으로 삼전도의 굴욕을 겪었다.", "③ 정봉수와 이립이 용골산성과 의주에서 의병을 일으켜 크게 활약하였다.", "④ 전쟁 직후 광해군이 폐위되는 인조반정이 일어났다.", "⑤ 전쟁 결과 조선은 왜관의 무역을 중단하고 기유약조를 폐기하였다."], "answer": 2, "explanation": {"summary": "청의 군신 관계 요구, 주화론 vs 척화론, 남한산성 47일 항전은 1636년 '병자호란'입니다.", "choices": ["① 오답: 정묘호란(1627년)은 후금의 침략으로 인조가 강화도로 피란하고 형제 관계를 맺었습니다.", "② 정답: 병자호란 결과 인조가 삼전도에서 청 태종에게 항복(군신 관계)하고 소현세자와 봉림대군(훗날 효종)이 인질로 끌려갔습니다.", "③ 오답: 정봉수·이립의 의병 활약은 정묘호란입니다.", "④ 오답: 인조반정은 1623년으로 호란 이전입니다.", "⑤ 오답: 기유약조(1609년)는 광해군 때 일본과의 국교 재개 조약입니다."]}}]}, {"id": "era6", "name": "6. 조선 후기", "tag": "출제 4~5문항", "period": "17세기 중반 ~ 19세기 중반 (세도정치까지)", "summary": "비변사의 비대화와 5군영, 3대 수취제도(영정법·대동법·균역법), 영조와 정조의 탕평책, 실학자 8인(중농학파 vs 중상학파), 그리고 세도정치와 농민 봉기(홍경래의 난, 임술 농민 봉기)를 총정리합니다.", "theory": {"tables": [{"title": "조선 후기 3대 수취 제도 개혁 비교", "headers": ["제도명", "시행 국왕", "개혁 배경", "핵심 개혁 내용", "결과 및 영향"], "rows": [["영정법 (1635)", "인조", "전세 제도의 문란 (연분9등법의 복잡성)", "풍흉에 관계없이 토지 1결당 쌀 4두로 고정", "지주 부담은 줄었으나 각종 부가세가 소작농에게 전가됨"], ["대동법 (1608~숙종)", "광해군(경기) ➔ 숙종(전국)", "공납(방납의 폐단)으로 인한 백성 파탄", "가호(집집마다) 기준 특산물 부과 ➔ 토지 결수(1결당 쌀 12두) 부과", "공인(어용 상인) 등장 ➔ 상품 화폐 경제 급속 발전"], ["균역법 (1750)", "영조", "군역(백골징포, 황구첨정)의 극심한 폐단", "1년에 군포 2필을 1필로 감면", "결작(1결당 2두), 선무군관포(부유한 상민 1필), 어염선세 징수로 보충"]]}, {"title": "실학의 두 흐름: 중농학파 vs 중상학파", "headers": ["구분", "대표 학자", "대표 저서", "핵심 주장 및 개혁안"], "rows": [["중농학파 (경세치용)", "유형원", "<반계수록>", "균전론: 신분에 따른 차등 토지 재분배 주장"], ["중농학파 (경세치용)", "이익", "<성호사설>", "한전론: 생계 보장용 '영업전' 설정하여 매매 금지(하한선 보장), 6좀 비판"], ["중농학파 (경세치용)", "정약용", "<경세유표>, <목민심서>", "여전론: 1여 단위 공동 소유·공동 노동·노동량에 따른 분배 ➔ 정전론, 거중기 설계"], ["중상학파 (이용후생)", "유수원", "<우서>", "사농공상의 직업적 평등화, 상공업 진흥"], ["중상학파 (이용후생)", "홍대용", "<임하필기>, <의산문답>", "혼천의 제작, 지전설과 무한 우주론 주장, 성리학적 중국 중심 세계관 비판"], ["중상학파 (이용후생)", "박지원", "<열하일기>, <양반전>", "수레와 선박의 이용, 화폐 유통 필요성 강조, 양반의 무위도식 비판"], ["중상학파 (이용후생)", "박제가", "<북학의>", "청과의 통상 확대, 소비 촉진론 (재물은 우물물과 같아서 퍼내야 채워짐)"]]}], "killer_records": [{"title": "사료 1: 대동법의 본질 (이원익 상소)", "text": "각 고을의 공물은 특산물이 나오지 않아 방납하는 무리에게 높은 값을 주고 사서 바치느라 백성의 뼈가 깎입니다. 청컨대 경기 지역에 시험하여 토지 결수를 기준으로 1결마다 쌀 12두를 거두어 공물을 대신하게 하소서."}, {"title": "사료 2: 박제가의 우물물 비유 (북학의)", "text": "재물은 대체로 우물과 같다. 퍼내면 차고 버려두면 말라 버린다. 비단 옷을 입지 않으므로 나라에 비단 짜는 사람이 없고, 그릇이 일그러져도 고치지 않으므로 기예가 발전하지 못한다. 절약만 숭상하고 소비를 권장하지 않으니 나라가 가난해진다."}], "mnemonics": ["💡 대동법 핵심 요점: [토지 결수 기준 / 1결당 12두 / 공인 등장 / 장시와 화폐 발달]", "💡 정조 4대 업적: [규장각 / 초계문신제 / 장용영 / 신해통공(금난전권 철폐)]"]}, "questions": [{"id": "q6_1", "question": "조선 후기 중앙 통치 기구와 군사 제도의 변화에 대한 설명으로 옳은 것은?", "passage": "양란(임진왜란·병자호란)을 거치면서 조선의 정치 기구와 군사 제도는 큰 변화를 겪었다.", "options": ["① 비변사가 군사·외교·인사·재정을 총괄하는 최고 권력 기구로 비대화되었다.", "② 중앙군으로 5위가 설치되고 지방군으로 진관 체제가 처음 확립되었다.", "③ 의정부와 6조의 권한이 양란 이전보다 더욱 막강해졌다.", "④ 훈련도감은 양반만으로 구성된 의무병 제도로 운영되었다.", "⑤ 지방군인 속오군은 양반을 제외하고 상민과 천민만으로 편성되었다."], "answer": 1, "explanation": {"summary": "비변사는 삼포왜란(임시) ➔ 을묘왜변(상설) ➔ 임진왜란 이후 최고 국정 기구로 확대되어 의정부와 6조가 유명무실해졌습니다.", "choices": ["① 정답: 비변사의 기능 확대로 왕권이 약화되고 붕당과 세도 가문이 비변사를 장악했습니다.", "② 오답: 5위와 진관 체제는 조선 전기(세조)입니다. 조선 후기는 중앙 5군영, 지방 속오군입니다.", "③ 오답: 비변사 때문에 의정부와 6조의 기능이 크게 축소되었습니다.", "④ 오답: 훈련도감은 급료를 받는 직업 군인(모병제, 포수·사수·살수 삼수미병)입니다.", "⑤ 오답: 속오군은 양반부터 노비까지 모두 편성된 양천 혼성군입니다."]}}, {"id": "q6_2", "question": "다음 제도의 시행으로 나타난 사회 경제적 변화로 옳은 것은?", "passage": "공물을 집집마다 거두지 않고 토지의 결수에 따라 1결당 쌀 12말, 또는 삼베나 무명, 동전 등으로 거두게 하였다. 이 법이 전국적으로 확대되자 관청에서 필요한 물품을 대량으로 사들이는 어용 상인들이 등장하였다.", "options": ["① 지주에게 결작이라 하여 1결당 쌀 2두를 추가로 징수하였다.", "② 풍흉에 따라 연분 9등으로 전세를 책정하였다.", "③ 공인이 등장하여 상품 화폐 경제와 장시 발달을 촉진하였다.", "④ 양반에게도 군포를 징수하는 호포제가 전국에 실시되었다.", "⑤ 수신전과 휼양전을 폐지하고 현직 관리에게만 수조권을 지급하였다."], "answer": 3, "explanation": {"summary": "가호 기준 특산물 징수를 토지 결수 기준(1결당 12두)으로 바꾼 공납 개혁은 '대동법'입니다.", "choices": ["① 오답: 결작 징수는 영조의 균역법입니다.", "② 오답: 연분 9등법은 세종의 공법입니다.", "③ 정답: 대동법 시행으로 관청에 물품을 조달하는 '공인'이 등장하여 수공업, 장시, 화폐 유통 등 상품 화폐 경제가 급속히 발달했습니다.", "④ 오답: 호포제는 흥선대원군입니다.", "⑤ 오답: 직전법은 세조입니다."]}}, {"id": "q6_3", "question": "다음 세금 제도를 시행한 국왕의 보충 재정 마련 대책으로 옳은 것은?", "passage": "백성들이 1년에 군포 2필을 바치는 고통을 덜어주기 위해 1750년에 군포 부담을 1필로 줄여주는 균역법을 제정하였다.", "options": ["① 지주에게 결작(1결당 쌀 2두)을 부과하고 선무군관포와 어염선세를 거두었다.", "② 풍흉에 관계없이 전세를 1결당 쌀 4두로 고정하는 영정법을 실시하였다.", "③ 양반 가구에도 군포를 부과하는 호포제를 전면 시행하였다.", "④ 상평통보를 전국적으로 처음 발행하여 재정을 충당하였다.", "⑤ 당백전을 발행하고 원납전을 강제로 징수하였다."], "answer": 1, "explanation": {"summary": "영조의 균역법(군포 2필 ➔ 1필)으로 줄어든 재정을 메우기 위해 결작, 선무군관포, 어장세·염세·선박세를 거두었습니다.", "choices": ["① 정답: 지주에게 1결당 쌀 2두(결작), 부유한 상민에게 선무군관포(1필), 왕실·관청이 갖던 어장세·염세·선박세를 국가 재정으로 돌렸습니다.", "② 오답: 영정법은 인조(1635년)입니다.", "③ 오답: 호포제는 흥선대원군입니다.", "④ 오답: 상평통보 전국 유통은 숙종입니다.", "⑤ 오답: 당백전·원납전은 흥선대원군의 경복궁 중건입니다."]}}, {"id": "q6_4", "question": "조선 후기 붕당 정치의 변질 과정(예송과 환국)에 대한 설명으로 옳은 것은?", "passage": "현종 대에는 효종과 효종비의 상복 입는 기간을 두고 서인과 남인이 대립하였고, 숙종 대에는 정권을 잡은 붕당이 상대 붕당을 대거 숙청하는 환국이 세 차례나 발생하였다.", "options": ["① 현종 대의 두 차례 예송 논쟁 이후 서인은 노론과 소론으로 분화되었다.", "② 숙종 대의 경신·기사·갑술 환국을 거치며 일당 전제화 경향이 심화되었다.", "③ 환국 정치를 통해 왕권이 극도로 약화되고 신하들의 합의 정치가 정착되었다.", "④ 기해예송에서는 남인의 주장인 3년설이 채택되어 남인이 정권을 장악하였다.", "⑤ 예송 논쟁은 이조전랑의 임명 권한을 둘러싼 동인과 서인의 갈등에서 비롯되었다."], "answer": 2, "explanation": {"summary": "숙종 대의 잦은 환국(경신·기사·갑술)은 붕당 간의 상호 견제와 공존 원칙을 무너뜨리고 일당 전제화(독재)를 초래했습니다.", "choices": ["① 오답: 서인의 노론·소론 분화는 숙종 대 경신환국 이후 남인 처벌 수위를 둘러싼 갈등(회니시비) 때문입니다.", "② 정답: 환국을 거치며 정권을 잡은 붕당이 상대방을 역적으로 몰아 완전히 제거하는 극단적 일당 전제화가 심화되었습니다.", "③ 오답: 숙종은 환국을 통해 국왕의 정치적 주도권(왕권)을 오히려 강화하려 했습니다.", "④ 오답: 1차 기해예송에서는 서인의 1년설이 채택되었고, 2차 갑인예송에서 남인의 1년설이 채택되었습니다.", "⑤ 오답: 이조전랑 갈등은 선조 때(1575년) 동인·서인 최초 분당입니다."]}}, {"id": "q6_5", "question": "다음 업적을 남긴 조선 국왕의 정책으로 옳은 것은?", "passage": "• 붕당의 폐해를 없애기 위해 성균관 입구에 탕평비를 건립하였다.\n• 붕당의 근거지 역할을 하던 전국의 서원을 300여 개소나 대폭 정리하였다.\n• 붕당 대립의 원인이 되었던 이조전랑의 자천권과 통청권을 약화시켰다.", "options": ["① 규장각을 설치하고 초계문신제를 시행하였다.", "② 균역법을 실시하고 <속대전>과 <동국문헌비고>를 편찬하였다.", "③ 장용영을 창설하고 수원 화성을 축조하였다.", "④ 육의전을 제외한 시전의 금난전권을 폐지하는 신해통공을 단행하였다.", "⑤ 비변사를 폐지하고 의정부와 삼군부의 기능을 부활시켰다."], "answer": 2, "explanation": {"summary": "탕평비 건립, 서원 300여 개 정리, 이조전랑 권한 약화는 완론 탕평을 펼친 '영조'입니다.", "choices": ["① 오답: 규장각과 초계문신제는 정조입니다.", "② 정답: 영조는 균역법 시행, 신문고 부활, 가혹한 형벌 폐지, <속대전>·<동국문헌비고> 편찬 등의 업적을 남겼습니다.", "③ 오답: 장용영과 수원 화성은 정조입니다.", "④ 오답: 신해통공(1791)은 정조입니다.", "⑤ 오답: 비변사 폐지는 흥선대원군입니다."]}}, {"id": "q6_6", "question": "다음 정책을 단행한 조선 후기 국왕의 업적으로 옳은 것은?", "passage": "• 학술 연구 기관으로 규장각을 설치하고 유득공·이덕무·박제가 등 서얼 출신을 검서관으로 기용하였다.\n• 능력 있는 젊은 문신을 재교육하는 초계문신제를 실시하였다.\n• 육의전을 제외한 시전 상인의 금난전권을 철폐하는 '신해통공'을 단행하였다.", "options": ["① 서원을 300여 개소 정리하고 성균관에 탕평비를 건립하였다.", "② 군역의 부담을 줄이기 위해 균역법을 제정하였다.", "③ 국왕의 친위 부대로 장용영을 설치하고 수원 화성을 축조하였다.", "④ 삼정의 문란을 수습하기 위해 삼정이정청을 설치하였다.", "⑤ 훈련도감을 설치하여 삼수미병을 양성하였다."], "answer": 3, "explanation": {"summary": "규장각, 서얼 검서관 기용, 초계문신제, 신해통공(1791)은 준론 탕평의 '정조'입니다.", "choices": ["① 오답: 영조입니다.", "② 오답: 영조입니다.", "③ 정답: 정조는 친위 부대 장용영을 설치하고 정약용의 거중기를 이용해 수원 화성을 축조했으며 <대전통편>을 편찬했습니다.", "④ 오답: 철종 때(1862년 임술 농민 봉기)입니다.", "⑤ 오답: 선조 때(임진왜란 중)입니다."]}}, {"id": "q6_7", "question": "조선 후기 중농학파(경세치용파) 실학자들과 그들의 토지 개혁론을 옳게 연결한 것은?", "passage": "농촌 사회의 안정을 중시한 중농학파 실학자들은 자영농 육성을 목표로 다양한 토지 제도 개혁안을 제시하였다.", "options": ["① 유형원 - 영업전을 설정하여 매매를 금지하는 한전론", "② 이익 - 신분에 따라 토지를 차등 분배하는 균전론", "③ 정약용 - 마을(여) 단위로 공동 소유·공동 경작하고 노동량에 따라 분배하는 여전론", "④ 박지원 - 청의 선진 문물을 수용하고 수레와 선박을 이용하자는 북학론", "⑤ 박제가 - 절약보다 적극적인 소비를 권장하는 소비 촉진론"], "answer": 3, "explanation": {"summary": "중농학파 3대 토지개혁: 유형원(균전론) - 이익(한전론/영업전) - 정약용(여전론 ➔ 정전론)입니다.", "choices": ["① 오답: 한전론(영업전)은 이익, 유형원은 균전론입니다.", "② 오답: 균전론은 유형원, 이익은 한전론입니다.", "③ 정답: 다산 정약용은 <경세유표>, <목민심서>를 저술하고 마을 단위의 공동 농장 제도인 '여전론'을 제안했습니다.", "④ 오답: 박지원은 중상학파(이용후생파)입니다.", "⑤ 오답: 박제가는 중상학파(이용후생파)입니다."]}}, {"id": "q6_8", "question": "다음 글을 저술한 실학자에 대한 설명으로 옳은 것은?", "passage": "재물은 비유하건대 우물과 같다. 퍼내면 차고 버려두면 말라 버린다. 비단 옷을 입지 않으므로 나라에 비단 짜는 사람이 없고, 그릇이 찌그러져도 고치지 않으므로 기예가 발전하지 못한다.", "options": ["① <북학의>를 저술하고 청과의 통상 확대와 소비 촉진을 강조한 박제가이다.", "② <열하일기>와 <양반전>을 지어 양반의 허례허식을 풍자한 박지원이다.", "③ <의산문답>에서 지전설과 무한 우주론을 주장한 홍대용이다.", "④ <우서>를 지어 사농공상의 직업적 평등을 주장한 유수원이다.", "⑤ <성호사설>을 저술하고 나라를 망치는 6좀을 비판한 이익이다."], "answer": 1, "explanation": {"summary": "재물을 우물물에 비유하며 소비가 생산을 자극한다는 소비 촉진론을 편 저서는 박제가의 <북학의>입니다.", "choices": ["① 정답: 박제가는 정조 때 규장각 검서관으로 등용되었으며 <북학의>에서 청나라 문물 수용과 상공업·소비 촉진을 역설했습니다.", "② 오답: 박지원의 대표작입니다.", "③ 오답: 홍대용의 대표 사상입니다.", "④ 오답: 유수원의 대표작입니다.", "⑤ 오답: 이익의 대표작입니다."]}}, {"id": "q6_9", "question": "조선 후기 우리 고유의 역사와 지리, 문화를 연구하는 국학(國學)의 발달에 대한 설명으로 옳지 않은 것은?", "passage": "18세기 이후 중국 중심의 세계관에서 벗어나 우리의 역사, 지리, 자연을 주체적으로 연구하려는 경향이 뚜렷해졌다.", "options": ["① 유득공은 <발해고>를 저술하여 통일신라와 발해를 '남북국'으로 파악하였다.", "② 안정복은 <동사강목>을 편찬하여 고조선에서 고려까지의 역사를 체계화하였다.", "③ 이중환은 <택리지>를 지어 사람이 살 만한 곳의 조건을 제시한 인문 지리서를 남겼다.", "④ 김정호는 직접 답사한 결과를 토대로 축척과 도로망이 정밀한 <대동여지도>를 목판으로 제작하였다.", "⑤ 안견은 우리나라의 실제 산천을 그린 진경산수화를 개척하여 <인왕제색도>를 남겼다."], "answer": 5, "explanation": {"summary": "진경산수화를 개척하고 <인왕제색도>, <금강전도>를 그린 화가는 조선 후기 '정선(겸재)'입니다.", "choices": ["① 옳음: 유득공의 <발해고>는 발해사를 우리 역사의 정통으로 편입시켰습니다.", "② 옳음: 안정복의 <동사강목>은 단군-기자-마한 정통론을 세웠습니다.", "③ 옳음: 이중환의 <택리지>는 지리·생리·인심·산수를 강조한 인문 지리서입니다.", "④ 옳음: 김정호의 <대동여지도>는 10리마다 눈금을 표시하고 목판 인쇄로 대량 보급이 가능했습니다.", "⑤ 정답(옳지 않음): 안견은 조선 전기 세종 때 <몽유도원도>를 그린 화가입니다. <인왕제색도>는 조선 후기 '정선'입니다."]}}, {"id": "q6_10", "question": "조선 후기 상품 화폐 경제와 상업의 발달에 대한 설명으로 옳은 것은?", "passage": "모내기법(이앙법) 보급으로 농업 생산력이 늘고 대동법이 시행되면서 전국적으로 장시와 사상(사적인 상인)이 크게 성장하였다.", "options": ["① 개성의 송상, 의주의 만상, 동래의 내상 등 거대 사상들이 대외 무역과 유통을 주도하였다.", "② 숙종 때 발행된 건원중보가 전국적으로 유통되며 세금 납부에 쓰였다.", "③ 금난전권이 강화되면서 사상들의 자유로운 상업 활동이 완전히 금지되었다.", "④ 포구에서 객주와 여각의 활동이 금지되고 관영 수공업만이 유일하게 허용되었다.", "⑤ 은광 개발이 중단되면서 화폐 유통이 급격히 위축되는 전황이 해소되었다."], "answer": 1, "explanation": {"summary": "조선 후기에는 송상(개성-송방), 만상(의주-청 무역), 내상(동래-일본 무역), 경강상인(한강-운송업) 등 사상이 크게 성장했습니다.", "choices": ["① 정답: 송상·만상·내상 등 사상들이 전국 유통망과 중계 무역을 장악했습니다.", "② 오답: 건원중보는 고려 성종 때 최초 철전입니다. 조선 숙종 때 전국 유통 화폐는 '상평통보'입니다.", "③ 오답: 정조의 신해통공(1791)으로 금난전권이 철폐되어 사상 활동이 더욱 자유로워졌습니다.", "④ 오답: 포구에서 객주·여각이 중개·숙박·금융업으로 번성했고 민영 수공업(선대제)이 발달했습니다.", "⑤ 오답: 부유층이 상평통보를 재산 축적 수단으로 쌓아두어 시중에 동전이 부족해지는 '전황'이 발생했습니다."]}}, {"id": "q6_11", "question": "19세기 순조·헌종·철종 3대 60여 년간 전개된 세도 정치 시기의 사회상으로 옳지 않은 것은?", "passage": "정조가 급서한 뒤 어린 왕들이 잇따라 즉위하자 안동 김씨, 풍양 조씨 등 소수 외척 가문이 권력을 독점하였다.", "options": ["① 외척 가문이 비변사의 요직과 훈련도감 등 군사 지휘권을 독점하였다.", "② 매관매직과 과거 시험의 부정이 만연하여 탐관오리가 급증하였다.", "③ 죽은 사람에게 군포를 물리는 백골징포, 어린아이에게 물리는 황구첨정이 성행하였다.", "④ 빈민 구제 제도였던 환곡이 고리대금처럼 변질되어 삼정의 문란 중 가장 극심한 폐단을 낳았다.", "⑤ 왕권이 극도로 강화되어 외척 세력을 완전히 배제하고 탕평 정치가 완성되었다."], "answer": 5, "explanation": {"summary": "세도 정치기에는 왕권이 극도로 약화되고 외척 가문이 국정을 농단하며 삼정의 문란이 극에 달했습니다.", "choices": ["① 옳음: 비변사와 군영을 외척이 장악했습니다.", "② 옳음: 관직을 돈으로 사고파는 매관매직이 횡행했습니다.", "③ 옳음: 군정의 문란(백골징포, 황구첨정, 족징, 인징)이 백성을 괴롭혔습니다.", "④ 옳음: 환곡의 폐단이 가장 심각했습니다.", "⑤ 정답(옳지 않음): 세도 정치기는 왕권이 극도로 쇠퇴하고 탕평 정치가 완전히 붕괴된 시기입니다."]}}, {"id": "q6_12", "question": "세도 정치기 일어난 두 대규모 농민 봉기 (가), (나)에 대한 설명으로 옳은 것은?", "passage": "(가) 1811년 순조 때 평안도 지역에 대한 차별과 수탈에 반발하여 몰락 양반, 광산 노동자, 상인, 농민이 연합해 일으킨 봉기로 청천강 이북 대부분을 장악하였다.\n(나) 1862년 철종 때 경상 우병사 백낙신의 탐학에 항거한 진주 민란에서 시작되어 전국 삼남 지방으로 확산되었다.", "options": ["① (가)는 홍경래의 난으로 정주성 전투에서 관군에게 진압되었다.", "② (가)의 수습을 위해 정부는 안핵사 박규수를 파견하고 삼정이정청을
